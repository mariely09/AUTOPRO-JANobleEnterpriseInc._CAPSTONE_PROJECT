    <style>
        /* -- Status badges -- */
        .rcv-badge { display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:normal;word-break:break-word;max-width:100%; }
        .rcv-badge.pending   { background:rgba(113,128,150,0.1);color:#718096; }
        .rcv-badge.awaiting  { background:rgba(214,158,46,0.1);color:#d69e2e; }
        .rcv-badge.approved  { background:rgba(56,161,105,0.1);color:#38a169; }
        .rcv-badge.rejected  { background:rgba(232,0,28,0.1);color:#E8001C; }
        /* -- Filter pills -- */
        .rcv-pill { padding:6px 16px;border-radius:20px;border:1.5px solid #e2e8f0;background:white;font-size:12px;font-weight:600;color:#4a5568;cursor:pointer;transition:all .15s; }
        .rcv-pill:hover { border-color:#003087;color:#003087; }
        .rcv-pill.active { background:#003087;color:white;border-color:#003087; }
        /* -- Item rows inside modals -- */
        .rcv-item-card { background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:border-color .15s; }
        .rcv-item-card:hover { border-color:#cbd5e0; }
        .rcv-item-name { font-size:13px;font-weight:700;color:#1a202c; }
        .rcv-item-num  { font-size:11px;color:#718096;margin-top:2px; }
        /* -- Condition toggle buttons -- */
        .rcv-cond { padding:5px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:white;transition:all .15s;white-space:nowrap; }
        .rcv-cond:hover { opacity:.85; }
        .rcv-cond.ok       { border-color:#38a169;color:#38a169;background:rgba(56,161,105,0.08); }
        .rcv-cond.defect   { border-color:#E8001C;color:#E8001C;background:rgba(232,0,28,0.08); }
        .rcv-cond.shortage { border-color:#d69e2e;color:#d69e2e;background:rgba(214,158,46,0.08); }
        /* -- Qty input -- */
        .rcv-qty { width:80px;padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;text-align:center;font-family:inherit;transition:border-color .15s; }
        .rcv-qty:focus { outline:none;border-color:#003087;background:white; }
        /* -- Modal form inputs -- */
        .rcv-label { font-size:0.78rem;font-weight:600;color:#4a5568;display:block;margin-bottom:0.3rem; }
        .rcv-input { width:100%;padding:0.55rem 0.75rem;border:1px solid #e2e8f0;border-radius:8px;font-size:0.83rem;font-family:inherit;transition:border-color .2s; }
        .rcv-input:focus { outline:none;border-color:#E8001C; }
        .rcv-textarea { width:100%;padding:0.55rem 0.75rem;border:1px solid #e2e8f0;border-radius:8px;font-size:0.83rem;font-family:inherit;resize:vertical;transition:border-color .2s; }
        .rcv-textarea:focus { outline:none;border-color:#E8001C; }
        /* -- Review read-only card -- */
        .rv-item-card { background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px; }
        .rv-grid { display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center;margin-top:10px; }
        .rv-col-label { font-size:10px;font-weight:700;color:#a0aec0;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px; }
        .rv-col-val { font-size:13px;font-weight:600;color:#1a202c; }
        /* ── Receiving card grid (same style as admin_PO.html) ── */
        .rcv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        .rcv-card {
            background: white;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px 20px;
            cursor: pointer;
            transition: box-shadow .15s, transform .15s, border-color .15s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .rcv-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.09);
            transform: translateY(-2px);
            border-color: #cbd5e0;
        }
        .rcv-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .rcv-card-id   { font-size: 13px; font-weight: 800; color: #1a202c; letter-spacing: 0.2px; }
        .rcv-card-date { font-size: 11px; color: #718096; margin-top: 2px; }
        .rcv-card-divider { border: none; border-top: 1px solid #f0f4f8; margin: 10px 0; }
        .rcv-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }
        .rcv-card-lines-preview {
            font-size: 11px;
            color: #718096;
            margin-top: 6px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<script>
// Instant auth guard - blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login');
  }
})();
</script>

    <svg id="fabIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

<script>
// ── Constants & state ─────────────────────────────────────────────────────────
var db              = firebase.firestore();
var _RCV_COL        = 'receivings';        // new collection
var _PO_COL         = 'purchase_orders';   // read-only reference
var _allRcv         = [];
var _currentFilter  = 'all';
var _currentRcvId   = null;   // receiving header docId being worked on
var _currentLineIdx = null;   // line index being received
var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── Helpers ───────────────────────────────────────────────────────────────────
function _fmtDate(raw) {
  if (!raw) return '—';
  if (raw && typeof raw === 'object' && raw.toDate) raw = raw.toDate().toISOString();
  if (raw && typeof raw === 'object' && raw.seconds) raw = new Date(raw.seconds * 1000).toISOString();
  var dt = new Date(raw);
  if (isNaN(dt)) return raw;
  return MO[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear();
}

// Status config: [text-color, bg-color, label]
var _STATUS_CFG = {
  'DRAFT':    ['#718096','rgba(113,128,150,0.10)','Draft'],
  'INPROG':   ['#003087','rgba(0,48,135,0.08)',   'In Progress'],
  'COMP':     ['#38a169','rgba(56,161,105,0.10)',  'Complete'],
  'PARTIAL':  ['#d69e2e','rgba(214,158,46,0.10)',  'Partial'],
};
var _LINE_STATUS_CFG = {
  'DRAFT':     ['#718096','rgba(113,128,150,0.10)','Draft'],
  'COMP':      ['#38a169','rgba(56,161,105,0.10)', 'Complete'],
  'MISSING':   ['#E8001C','rgba(232,0,28,0.08)',   'Missing'],
  'DEFECTIVE': ['#E8001C','rgba(232,0,28,0.08)',   'Defective'],
  'INCOMP':    ['#d69e2e','rgba(214,158,46,0.10)', 'Incomplete'],
};

function _badge(cfg, status) {
  var c = cfg[status] || ['#718096','rgba(113,128,150,0.10)', status];
  return '<span class="rcv-badge" style="color:' + c[0] + ';background:' + c[1] + ';">' + c[2] + '</span>';
}

// Generate receiving number: RCV-YYYYMMDD-0001
function _genRcvNum() {
  var now = new Date();
  var prefix = 'RCV-' + now.getFullYear()
    + String(now.getMonth()+1).padStart(2,'0')
    + String(now.getDate()).padStart(2,'0') + '-';
  var todayCount = _allRcv.filter(function(r){ return (r.receivingNum||'').startsWith(prefix); }).length;
  return prefix + String(todayCount + 1).padStart(4,'0');
}

// ── Card click — event delegation (survives DOM mutations) ───────────────────
document.addEventListener('click', function(e) {
  var card = e.target.closest('.rcv-card');
  if (!card) return;
  // Ignore clicks on action buttons inside the card
  if (e.target.closest('button')) return;
  var docId = card.getAttribute('data-rcvid');
  if (docId) rcvOpenCard(docId);
});

// Open the first pending line, or the item view for completed records
window.rcvOpenCard = function(docId) {
  var r = _allRcv.find(function(x){ return x._docId === docId; });
  if (!r) return;
  var lines = r.receivingLines || [];
  if (!lines.length) {
    showToast('No lines in this receiving record.', 'error');
    return;
  }
  // Find first DRAFT line
  var firstDraft = -1;
  for (var i = 0; i < lines.length; i++) {
    if ((lines[i].lineStatus || 'DRAFT') === 'DRAFT') { firstDraft = i; break; }
  }
  var s = r.status || 'DRAFT';
  if ((s === 'INPROG' || s === 'DRAFT') && firstDraft >= 0) {
    openReceiveModal(docId, firstDraft);
  } else {
    // All lines done — open view of first line
    openItemViewModal(docId, 0);
  }
};

// ── Real-time listener ────────────────────────────────────────────────────────
(function _listen() {
  db.collection(_RCV_COL)
    .onSnapshot(function(snap) {
      _allRcv = snap.docs.map(function(d) { return Object.assign({ _docId: d.id }, d.data()); })
                         .filter(function(r) { return r.archived !== true; });
      _rcvUpdateStats();
      _rcvRenderList();
    }, function(err) {
      console.error('Receivings listener error:', err);
      var el = document.getElementById('deliveriesList');
      if (el) el.innerHTML = '<div style="padding:3rem;text-align:center;color:#718096;font-size:13px;">No receiving records found. Create one using the + button.</div>';
    });
})();

// ── Stats ─────────────────────────────────────────────────────────────────────
function _rcvUpdateStats() {
  var c = { DRAFT:0, INPROG:0, PARTIAL:0, COMP:0 };
  _allRcv.forEach(function(r) { var s = r.status||'DRAFT'; if(c[s]!==undefined) c[s]++; });
  document.getElementById('statDraft').textContent  = c.DRAFT;
  document.getElementById('statInprog').textContent = c.INPROG;
  document.getElementById('statPartial').textContent= c.PARTIAL;
  document.getElementById('statComp').textContent   = c.COMP;
}

// ── Filter & render ───────────────────────────────────────────────────────────
window.setFilter = function(f, btn) {
  _currentFilter = f;
  document.querySelectorAll('#rcvFilterPills .dss-pill').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  _rcvRenderList();
};

window.deliveryApplySearch = function() { _rcvRenderList(); };

function _rcvRenderList() {
  var q    = ((document.getElementById('deliverySearch')||{}).value||'').trim().toLowerCase();
  var sort = ((document.getElementById('deliverySortSelect')||{}).value||'date-desc');

  var list = _currentFilter === 'all' ? _allRcv.slice()
    : _allRcv.filter(function(r){ return (r.status||'DRAFT') === _currentFilter; });

  if (q) {
    list = list.filter(function(r) {
      return (r.receivingNum||'').toLowerCase().includes(q) ||
             (r.poNum||'').toLowerCase().includes(q) ||
             (r.receivingLines||[]).some(function(l){
               return (l.itemName||'').toLowerCase().includes(q) ||
                      (l.supplierCode||'').toLowerCase().includes(q) ||
                      (l.itemNum||'').toLowerCase().includes(q);
             });
    });
  }

  function _ms(r) {
    var raw = r.createdAt || '';
    if (raw && typeof raw === 'object' && raw.toDate) raw = raw.toDate().toISOString();
    if (raw && typeof raw === 'object' && raw.seconds) raw = new Date(raw.seconds*1000).toISOString();
    var dt = new Date(typeof raw === 'string' ? raw : '');
    return isNaN(dt) ? 0 : dt.getTime();
  }
  list.sort(function(a,b){ return sort === 'date-asc' ? _ms(a)-_ms(b) : _ms(b)-_ms(a); });

  var grid = document.getElementById('deliveriesList');

  // Clear skeleton cards on first real render
  var skel = grid.querySelector('.rcv-card[style*="cursor:default"]');
  if (skel) grid.innerHTML = '';

  if (!list.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;padding:4rem;text-align:center;color:#718096;font-size:13px;">'
      + (_allRcv.length ? 'No receiving records match your search.' : 'No receiving records found. Create one using the + button.')
      + '</div>';
    return;
  }

  // Line status summary helper
  function _lineSummary(lines) {
    if (!lines.length) return '';
    var total = lines.length;
    var comp  = lines.filter(function(l){ return l.lineStatus === 'COMP'; }).length;
    var done  = lines.filter(function(l){ return l.lineStatus !== 'DRAFT'; }).length;
    return comp + '/' + total + ' lines received';
  }

  // Build action buttons based on status
  function _cardActions(r) {
    var s = r.status || 'DRAFT';
    if (s === 'DRAFT') {
      return '<button onclick="event.stopPropagation();rcvStartReceiving(\'' + r._docId + '\')" '
        + 'style="padding:5px 14px;background:#003087;border:none;border-radius:8px;color:white;'
        + 'font-size:11px;font-weight:700;cursor:pointer;transition:opacity .15s;" '
        + 'onmouseover="this.style.opacity=\'0.85\'" onmouseout="this.style.opacity=\'1\'">▶ Start</button>';
    }
    if (s === 'INPROG') {
      return '<button onclick="event.stopPropagation();rcvOpenCard(\'' + r._docId + '\')" '
        + 'style="padding:5px 14px;background:#E8001C;border:none;border-radius:8px;color:white;'
        + 'font-size:11px;font-weight:700;cursor:pointer;transition:opacity .15s;" '
        + 'onmouseover="this.style.opacity=\'0.85\'" onmouseout="this.style.opacity=\'1\'">▶ Continue</button>';
    }
    return '';
  }

  grid.innerHTML = list.map(function(r) {
    var c         = _STATUS_CFG[r.status||'DRAFT'] || _STATUS_CFG['DRAFT'];
    var badge     = '<span class="rcv-badge" style="color:' + c[0] + ';background:' + c[1] + ';flex-shrink:0;">' + c[2] + '</span>';
    var lines     = r.receivingLines || [];
    var lineCount = lines.length;
    var lineSumm  = _lineSummary(lines);
    var itemNames = lines.map(function(l){ return l.itemName||''; }).filter(Boolean).join(', ');
    var total     = lines.reduce(function(s,l){ return s + (parseFloat(l.unitCost||0)||0)*(parseInt(l.receivedQty)||0); }, 0);
    var totalStr  = total > 0 ? '₱'+total.toLocaleString('en-PH',{minimumFractionDigits:2}) : '—';
    var actions   = _cardActions(r);

    return '<div class="rcv-card" data-rcvid="' + r._docId + '">'
      + '<div class="rcv-card-header">'
      +   '<div>'
      +     '<div class="rcv-card-id">' + (r.receivingNum||r._docId) + '</div>'
      +     '<div class="rcv-card-date">' + _fmtDate(r.createdAt) + (r.poNum ? '  •  PO: ' + r.poNum : '') + '</div>'
      +   '</div>'
      +   badge
      + '</div>'
      + '<hr class="rcv-card-divider">'
      + '<div class="rcv-card-meta">'
      +   '<div style="font-size:12px;color:#4a5568;">'
      +     '<span style="font-weight:700;color:#1a202c;">' + lineCount + '</span> item' + (lineCount!==1?'s':'')
      +     (lineSumm ? ' <span style="color:#718096;">— ' + lineSumm + '</span>' : '')
      +   '</div>'
      +   '<div style="display:flex;align-items:center;gap:8px;">'
      +     (actions ? actions : '<span style="font-size:13px;font-weight:800;color:#1a202c;">' + totalStr + '</span>')
      +   '</div>'
      + '</div>'
      + (itemNames ? '<div class="rcv-card-lines-preview">' + itemNames + '</div>' : '')
      + '</div>';
  }).join('');
}

// ── Start Receiving (DRAFT → INPROG) ─────────────────────────────────────────
window.rcvStartReceiving = function(docId) {
  var r = _allRcv.find(function(x){ return x._docId === docId; });
  if (!r) return;
  if (r.status === 'INPROG') { showToast('Already in progress.', 'error'); return; }
  db.collection(_RCV_COL).doc(docId).update({
    status: 'INPROG',
    startedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){ showToast('Receiving started!', 'success'); })
    .catch(function(e){ showToast('Error: '+e.message, 'error'); });
};

// ── Open Receive Modal (per line) ─────────────────────────────────────────────
window.openReceiveModal = function(docId, lineIdx) {
  var r = _allRcv.find(function(x){ return x._docId === docId; });
  if (!r) return;
  _currentRcvId   = docId;
  _currentLineIdx = lineIdx;
  var line = (r.receivingLines||[])[lineIdx];
  if (!line) return;

  var apUser = JSON.parse(sessionStorage.getItem('apUser') || sessionStorage.getItem('spUser') || '{}');
  var userName = apUser.name || '';
  document.getElementById('rmReceivedBy').value      = userName;
  document.getElementById('rmReceivedByLabel').textContent = userName || '—';

  var uom = line.uom || '';
  document.getElementById('rmItemCard').innerHTML =
    '<div style="background:white;border:1.5px solid #90cdf4;border-radius:12px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,0.04);">'
    + '<div style="font-weight:700;font-size:0.9rem;color:#1a202c;">' + (line.itemName||'') + (uom ? ' <span style="font-weight:400;font-size:0.76rem;color:#718096;">(' + uom + ')</span>' : '') + '</div>'
    + '<div style="font-size:0.75rem;color:#718096;margin-top:3px;">' + (line.supplierCode ? line.supplierCode+' · ' : '') + 'PO Qty: <strong style="color:#1a202c;">' + (line.poQty||0) + '</strong></div>'
    + '<div style="height:1px;background:#f0f4f8;margin:10px 0;"></div>'
    + '<div style="margin-bottom:10px;">'
    +   '<label style="font-size:0.75rem;font-weight:600;color:#4a5568;display:block;margin-bottom:4px;">Received Qty *</label>'
    +   '<input type="number" id="rmRcvQty" value="' + (line.poQty||0) + '" min="0"'
    +     ' oninput="rmAutoLineStatus(' + (line.poQty||0) + ')"'
    +     ' style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:0.6rem 0.8rem;font-size:0.9rem;outline:none;box-sizing:border-box;transition:border-color .15s;"'
    +     ' onfocus="this.style.borderColor=\'#003087\'" onblur="this.style.borderColor=\'#e2e8f0\'">'
    + '</div>'
    + '<div style="margin-bottom:10px;">'
    +   '<label style="font-size:0.75rem;font-weight:600;color:#4a5568;display:block;margin-bottom:6px;">Line Status</label>'
    +   '<div style="display:flex;gap:6px;flex-wrap:wrap;">'
    +     '<button id="rmStatus_COMP"      onclick="setLineStatus(\'COMP\')"      style="padding:5px 12px;border:1.5px solid #38a169;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(56,161,105,0.1);color:#38a169;">✅ Complete</button>'
    +     '<button id="rmStatus_INCOMP"    onclick="setLineStatus(\'INCOMP\')"    style="padding:5px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:white;color:#718096;">⚠️ Incomplete</button>'
    +     '<button id="rmStatus_MISSING"   onclick="setLineStatus(\'MISSING\')"   style="padding:5px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:white;color:#718096;">❌ Missing</button>'
    +     '<button id="rmStatus_DEFECTIVE" onclick="setLineStatus(\'DEFECTIVE\')" style="padding:5px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:white;color:#718096;">🔴 Defective</button>'
    +   '</div>'
    + '</div>'
    + '<div>'
    +   '<label style="font-size:0.75rem;font-weight:600;color:#4a5568;display:block;margin-bottom:4px;">Remarks <span style="font-weight:400;color:#a0aec0;">(optional)</span></label>'
    +   '<input type="text" id="rmRemark" placeholder="e.g. 2 units damaged"'
    +     ' style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:0.55rem 0.75rem;font-size:0.83rem;outline:none;box-sizing:border-box;transition:border-color .15s;"'
    +     ' onfocus="this.style.borderColor=\'#003087\'" onblur="this.style.borderColor=\'#e2e8f0\'">'
    + '</div>'
    + '</div>';

  // Auto-set initial status
  rmAutoLineStatus(line.poQty||0);
  document.getElementById('receiveModal').classList.add('active');
};

window.rmAutoLineStatus = function(poQty) {
  var actual = parseInt(document.getElementById('rmRcvQty').value) || 0;
  var status;
  if (actual === 0)        status = 'MISSING';
  else if (actual < poQty) status = 'INCOMP';
  else                     status = 'COMP';
  setLineStatus(status);
};

window.setLineStatus = function(status) {
  var cfg = {
    'COMP':      { border:'#38a169', bg:'rgba(56,161,105,0.1)',  color:'#38a169' },
    'INCOMP':    { border:'#d69e2e', bg:'rgba(214,158,46,0.1)',  color:'#d69e2e' },
    'MISSING':   { border:'#E8001C', bg:'rgba(232,0,28,0.08)',   color:'#E8001C' },
    'DEFECTIVE': { border:'#E8001C', bg:'rgba(232,0,28,0.08)',   color:'#E8001C' },
  };
  ['COMP','INCOMP','MISSING','DEFECTIVE'].forEach(function(s) {
    var b = document.getElementById('rmStatus_'+s);
    if (!b) return;
    b.style.borderColor = '#e2e8f0';
    b.style.background  = 'white';
    b.style.color       = '#718096';
    b.removeAttribute('data-active');
  });
  var active = cfg[status];
  if (active) {
    var b = document.getElementById('rmStatus_'+status);
    if (b) {
      b.style.borderColor = active.border;
      b.style.background  = active.bg;
      b.style.color       = active.color;
      b.setAttribute('data-active','1');
    }
  }
};

// ── Submit Receiving ──────────────────────────────────────────────────────────
window.submitReceiving = function() {
  var receivedBy = document.getElementById('rmReceivedBy').value.trim();
  if (!receivedBy) { showToast('Could not detect logged-in user.', 'error'); return; }

  var r = _allRcv.find(function(x){ return x._docId === _currentRcvId; });
  if (!r || _currentLineIdx === null) return;

  // Get active line status
  var lineStatus = 'COMP';
  ['COMP','INCOMP','MISSING','DEFECTIVE'].forEach(function(s) {
    var b = document.getElementById('rmStatus_'+s);
    if (b && b.getAttribute('data-active')) lineStatus = s;
  });

  var rcvQtyEl = document.getElementById('rmRcvQty');
  var remarkEl = document.getElementById('rmRemark');
  var rcvQty   = parseInt(rcvQtyEl ? rcvQtyEl.value : 0) || 0;
  var remark   = remarkEl ? remarkEl.value.trim() : '';

  var updatedLines = (r.receivingLines||[]).slice();
  var origLine     = updatedLines[_currentLineIdx];

  updatedLines[_currentLineIdx] = Object.assign({}, origLine, {
    receivedQty:    rcvQty,
    lineStatus:     lineStatus,
    remark:         remark,
    receivedBy:     receivedBy,
    receivedAt:     new Date().toISOString(),
    stockAtReceive: origLine._stock !== undefined ? origLine._stock : null
  });

  // Compute header status
  var allDone  = updatedLines.every(function(l){ return l.lineStatus !== 'DRAFT'; });
  var allComp  = updatedLines.every(function(l){ return l.lineStatus === 'COMP'; });
  var anyComp  = updatedLines.some(function(l){  return l.lineStatus === 'COMP'; });
  var hdrStatus = allComp ? 'COMP' : (allDone && anyComp) ? 'PARTIAL' : (allDone ? 'PARTIAL' : 'INPROG');

  var btn = document.getElementById('rmSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  // Build update
  var updateData = {
    receivingLines: updatedLines,
    status:         hdrStatus,
    receivedBy:     receivedBy,
    receivedAt:     firebase.firestore.FieldValue.serverTimestamp()
  };
  if (hdrStatus === 'COMP' || hdrStatus === 'PARTIAL') {
    updateData.completedAt = firebase.firestore.FieldValue.serverTimestamp();
  }

  db.collection(_RCV_COL).doc(_currentRcvId).update(updateData)
    .then(function() {
      closeModal('receiveModal');
      showToast('Line updated — ' + lineStatus + '!', 'success');

      // ── Update stock for COMP or INCOMP lines ─────────────────────────────
      if ((lineStatus === 'COMP' || lineStatus === 'INCOMP') && rcvQty > 0) {
        var itemNum  = origLine.itemNum  || '';
        var itemName = origLine.itemName || '';
        var uom      = origLine.uom      || '';
        if (!itemNum) return;
        db.collection('stock_inventory').where('num','==',itemNum).limit(1).get()
          .then(function(snap) {
            var now = new Date();
            var dateStr = MO[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();
            if (!snap.empty) {
              var doc = snap.docs[0];
              var cur = parseInt(doc.data().stock) || 0;
              var newStock = cur + rcvQty;
              var minLevel = parseInt(doc.data().min) || 0;
              doc.ref.update({
                stock: newStock,
                status: newStock >= minLevel ? 'OK' : 'Low',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            } else {
              db.collection('stock_inventory').add({
                num: itemNum, name: itemName, uom: uom,
                stock: rcvQty, min: 0, max: 0, reorder: 0, status: 'OK',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            }
            db.collection('transactions').add({
              item: itemName,
              desc: 'Stock received — ' + (r.receivingNum||_currentRcvId),
              type: 'IN', qty: '+'+rcvQty,
              date: MO[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear(),
              by: receivedBy,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }).catch(function(){});
      }
    })
    .catch(function(err){ showToast('Error: '+err.message, 'error'); })
    .finally(function(){ btn.disabled=false; btn.textContent='Submit'; });
};

// ── Item View Modal ───────────────────────────────────────────────────────────
window.openItemViewModal = function(docId, lineIdx) {
  var r = _allRcv.find(function(x){ return x._docId === docId; });
  if (!r) return;
  var line = (r.receivingLines||[])[lineIdx];
  if (!line) return;

  var ls = line.lineStatus || 'DRAFT';
  var lc = _LINE_STATUS_CFG[ls] || ['#718096','rgba(113,128,150,0.1)', ls];

  document.getElementById('ivItemName').textContent = (line.itemName||'—') + (line.uom ? '  ('+line.uom+')' : '');
  document.getElementById('ivItemMeta').textContent = line.supplierCode || '';

  var cost     = parseFloat(line.unitCost||0) || 0;
  var poQty    = parseInt(line.poQty)    || 0;
  var rcvQty   = parseInt(line.receivedQty) || 0;
  var subtotal = cost * rcvQty;
  var diff     = rcvQty - poQty;

  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;">'
    + _ivCard('PO Qty', ''+poQty)
    + _ivCard('Received Qty', ''+rcvQty, rcvQty===poQty?'#38a169':rcvQty<poQty?'#E8001C':'#d69e2e')
    + (cost>0 ? _ivCard('Unit Price','₱'+cost.toLocaleString('en-PH',{minimumFractionDigits:2})) : '')
    + (subtotal>0 ? _ivCard('Subtotal','₱'+subtotal.toLocaleString('en-PH',{minimumFractionDigits:2}),'#E8001C') : '')
    + '</div>';

  // Status + difference
  html += '<div style="background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:1rem;">'
    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">'
    + '<div><div style="font-size:10px;color:#a0aec0;font-weight:700;text-transform:uppercase;">Status</div>'
    +   '<div style="margin-top:4px;">' + _badge(_LINE_STATUS_CFG, ls) + '</div></div>'
    + '<div><div style="font-size:10px;color:#a0aec0;font-weight:700;text-transform:uppercase;">Difference</div>'
    +   '<div style="font-size:1.1rem;font-weight:800;color:' + (diff===0?'#38a169':diff<0?'#E8001C':'#d69e2e') + ';margin-top:4px;">' + (diff===0?'0':(diff>0?'+':'')+diff) + '</div></div>'
    + (line.remark ? '<div><div style="font-size:10px;color:#a0aec0;font-weight:700;text-transform:uppercase;">Remarks</div>'
    +   '<div style="font-size:12px;font-weight:600;color:#1a202c;margin-top:4px;">' + line.remark + '</div></div>' : '')
    + '</div></div>';

  // Info rows
  html += '<div style="background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;">';
  if (r.receivingNum) html += _ivRow('Receiving No.', r.receivingNum);
  if (r.poNum)        html += _ivRow('PO Reference',  r.poNum);
  if (line.receivedAt)html += _ivRow('Received Date', _fmtDate(line.receivedAt));
  if (line.receivedBy)html += _ivRow('Received By',   line.receivedBy);
  html += '</div>';

  document.getElementById('ivBody').innerHTML = html;

  // Footer
  var canReceive = (r.status==='INPROG'||r.status==='DRAFT') && ls==='DRAFT';
  document.getElementById('ivFooter').innerHTML =
    '<button type="button" class="btn-secondary" style="flex:1;" onclick="closeModal(\'itemViewModal\')">Close</button>'
    + (canReceive ? '<button type="button" style="flex:1.5;padding:0.7rem;background:linear-gradient(135deg,#E31E24,#C41E3A);border:none;border-radius:10px;color:white;font-weight:700;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:6px;" onclick="closeModal(\'itemViewModal\');openReceiveModal(\''+docId+'\','+lineIdx+')">'
    + '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
    + 'Receive</button>' : '');

  document.getElementById('itemViewModal').classList.add('active');
};

function _ivCard(label, val, color) {
  return '<div style="background:white;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px;">'
    + '<div style="font-size:10px;color:#a0aec0;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;">' + label + '</div>'
    + '<div style="font-size:15px;font-weight:700;color:' + (color||'#1a202c') + ';margin-top:3px;">' + val + '</div>'
    + '</div>';
}
function _ivRow(label, val) {
  return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f4f8;">'
    + '<span style="font-size:12px;color:#718096;">' + label + '</span>'
    + '<span style="font-size:12px;font-weight:600;color:#1a202c;">' + val + '</span>'
    + '</div>';
}

// ── Copy from PO Modal ────────────────────────────────────────────────────────
window.openCopyFromPOModal = function() {
  document.getElementById('cpoPOList').innerHTML =
    '<div style="text-align:center;padding:2rem;color:#a0aec0;font-size:13px;">Loading POs…</div>';
  document.getElementById('copyFromPOModal').classList.add('active');

  db.collection(_PO_COL)
    .where('status','in',['Ordered','Pending'])
    .get()
    .then(function(snap) {
      var pos = snap.docs.map(function(d){ return Object.assign({_docId:d.id}, d.data()); });
      if (!pos.length) {
        document.getElementById('cpoPOList').innerHTML =
          '<div style="text-align:center;padding:2rem;color:#718096;font-size:13px;">No ordered POs found.<br><span style="font-size:11px;">POs must be in "Ordered" or "Pending" status.</span></div>';
        return;
      }
      document.getElementById('cpoPOList').innerHTML = pos.map(function(po) {
        var itemCount = (po.items||[]).length;
        var total = po.totalAmount > 0 ? '₱'+parseFloat(po.totalAmount).toLocaleString('en-PH',{minimumFractionDigits:2}) : '—';
        return '<div onclick="createReceivingFromPO(\'' + po._docId + '\')" '
          + 'style="padding:14px 16px;cursor:pointer;border-bottom:1px solid #f0f4f8;display:flex;align-items:center;gap:12px;transition:background .1s;" '
          + 'onmouseover="this.style.background=\'#f7fafc\'" onmouseout="this.style.background=\'white\'">'
          + '<div style="width:40px;height:40px;background:#EBF4FF;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'
          + '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#003087" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
          + '</div>'
          + '<div style="flex:1;min-width:0;">'
          +   '<div style="font-weight:700;font-size:13px;color:#1a202c;">' + (po.poNum||po._docId) + '</div>'
          +   '<div style="font-size:11px;color:#718096;margin-top:2px;">' + _fmtDate(po.createdAt) + '  •  ' + itemCount + ' item' + (itemCount!==1?'s':'') + '  •  ' + total + '</div>'
          + '</div>'
          + '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
          + '</div>';
      }).join('');
    }).catch(function(err) {
      document.getElementById('cpoPOList').innerHTML =
        '<div style="text-align:center;padding:2rem;color:#E8001C;font-size:13px;">Error: ' + err.message + '</div>';
    });
};

window.createReceivingFromPO = function(poDocId) {
  closeModal('copyFromPOModal');
  db.collection(_PO_COL).doc(poDocId).get().then(function(poDoc) {
    if (!poDoc.exists) { showToast('PO not found.','error'); return; }
    var po = poDoc.data();
    var sess = JSON.parse(sessionStorage.getItem('apUser')||sessionStorage.getItem('spUser')||'{}');

    var lines = (po.items||[]).map(function(item) {
      return {
        itemNum:      item.itemNum      || '',
        itemName:     item.itemName     || '',
        uom:          item.uom          || '',
        supplierCode: item.supplierCode || '',
        unitCost:     parseFloat(item.unitCost||0) || 0,
        poQty:        parseInt(item.expectedQty) || 0,
        receivedQty:  0,
        lineStatus:   'DRAFT',
        remark:       '',
        receivedAt:   null,
        receivedBy:   ''
      };
    });

    db.collection(_RCV_COL).add({
      receivingNum: _genRcvNum(),
      status:       'DRAFT',
      poRef:        poDocId,
      poNum:        po.poNum || '',
      receivingLines: lines,
      createdBy:    sess.name || '',
      createdAt:    firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      // Mark PO as Partially Received
      db.collection(_PO_COL).doc(poDocId).update({ status: 'Partially Received' }).catch(function(){});
      showToast('Receiving record created from ' + (po.poNum||'PO') + '!', 'success');
    }).catch(function(e){ showToast('Error: '+e.message,'error'); });
  });
};

// ── New Blank Receiving ───────────────────────────────────────────────────────
window.createBlankReceiving = function() {
  var sess = JSON.parse(sessionStorage.getItem('apUser')||sessionStorage.getItem('spUser')||'{}');
  db.collection(_RCV_COL).add({
    receivingNum:   _genRcvNum(),

    receivingLines: [],
    createdBy:      sess.name || '',

  }).then(function(){ showToast('Blank receiving record created!', 'success'); })
    .catch(function(e){ showToast('Error: '+e.message,'error'); });
};
