<script>
// Instant auth guard â€â€ blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
  }
})();
</script>

<!-- ── Step 1: Restore cached data instantly (before Firestore responds) ── -->
<script>
(function() {
  try {
    var uid = (JSON.parse(sessionStorage.getItem('apUser') || '{}')).uid || '';
    if (!uid) return;
    var raw = sessionStorage.getItem('bookingsCache_' + uid);
    if (!raw) return;
    var docs = JSON.parse(raw);
    if (!Array.isArray(docs) || !docs.length) return;

    // Restore serialised Timestamp-like objects
    docs.forEach(function(d) {
      if (d.createdAt && d.createdAt._ms) {
        var ms = d.createdAt._ms;
        d.createdAt = { toMillis: function() { return ms; }, seconds: Math.floor(ms / 1000) };
      }
    });

    window._sbAllDocs = docs;

    // Paint stats from cache immediately
    (function() {
      var s = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
      var rescheduled = docs.filter(function(d){ return d.status === 'Approved' && d.previousDate && d.previousDate !== d.preferredDate; }).length;
      var approved    = docs.filter(function(d){ return d.status === 'Approved' && !(d.previousDate && d.previousDate !== d.preferredDate); }).length;
      var cancelled   = docs.filter(function(d){ return d.status === 'Cancelled' || d.status === 'Dismissed'; }).length;
      s('sbStatTotal',       approved + rescheduled + cancelled);
      s('sbStatApproved',    approved);
      s('sbStatRescheduled', rescheduled);
      s('sbStatCancelled',   cancelled);
    })();

    // Render table from cache; live Firestore snapshot will overwrite shortly
    if (typeof window.renderRescheduleList === 'function') {
      window.renderRescheduleList();
    }
  } catch(e) {}
})();
</script>
<script>
(function () {
  var db = firebase.firestore();
  var _allDocs = [];
  window._sbAllDocs = _allDocs; // expose for cache restore

  function _timeAgo(ts) {
    if (!ts || !ts.toMillis) return 'â€â€';
    var diff = Date.now() - ts.toMillis();
    var mins = Math.floor(diff / 60000);
    if (mins < 1)  return 'Just now';
    if (mins < 60) return mins + ' min ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24)  return hrs + ' hr ago';
    var days = Math.floor(hrs / 24);
    return days === 1 ? 'Yesterday' : days + ' days ago';
  }

  var _MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function _formatDate(dateStr) {
    if (!dateStr) return 'â€â€';
    var parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    var y = parseInt(parts[0]);
    var m = parseInt(parts[1]) - 1;
    var d = parseInt(parts[2]);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return dateStr;
    return _MONTHS[m] + ' ' + d + ', ' + y;
  }

  window.renderRescheduleList = function () {
    var filter = _currentFilter;
    var body = document.getElementById('rescheduleTableBody');
    if (!body) return;
    // Use cached window._sbAllDocs if local _allDocs is still empty (cache restore path)
    if (!_allDocs.length && window._sbAllDocs && window._sbAllDocs.length) {
      _allDocs = window._sbAllDocs;
    }

    // Remove skeleton on first real render
    var skel = document.getElementById('sbSkeleton');
    if (skel) skel.remove();

    var docs;
    if (filter === 'all') {
      docs = _allDocs.filter(function(d) { return d.status === 'Approved' || d.status === 'Cancelled' || d.status === 'Dismissed'; });
    } else if (filter === 'Rescheduled') {
      docs = _allDocs.filter(function(d) { return d.status === 'Approved' && d.previousDate && d.previousDate !== d.preferredDate; });
    } else if (filter === 'Approved') {
      docs = _allDocs.filter(function(d) { return d.status === 'Approved' && !(d.previousDate && d.previousDate !== d.preferredDate); });
    } else if (filter === 'Cancelled') {
      docs = _allDocs.filter(function(d) { return d.status === 'Cancelled' || d.status === 'Dismissed'; });
    } else {
      docs = _allDocs.filter(function(d) { return d.status === filter; });
    }

    // Apply search
    var sbQ = ((document.getElementById('sbSearch') || {}).value || '').trim().toLowerCase();
    if (sbQ) {
      docs = docs.filter(function(r) {
        return (r.plate || '').toLowerCase().includes(sbQ)
          || (r.customerName || '').toLowerCase().includes(sbQ)
          || (r.services || []).join(' ').toLowerCase().includes(sbQ)
          || (r.preferredDate || '').toLowerCase().includes(sbQ);
      });
    }

    if (docs.length === 0) {
      body.innerHTML = '<div style="padding:3rem;text-align:center;color:#718096;font-size:13px;">No bookings found.</div>';
      _apPages['rescheduleTableBody'] = 1;

    // Apply sort

        case 'date-desc':    return dateMs(b.preferredDate) - dateMs(a.preferredDate);
        case 'plate-asc':    return (a.plate||'').localeCompare(b.plate||'');
        case 'plate-desc':   return (b.plate||'').localeCompare(a.plate||'');
        case 'customer-asc': return (a.customerName||'').localeCompare(b.customerName||'');
        case 'customer-desc':return (b.customerName||'').localeCompare(a.customerName||'');
        default:             return dateMs(b.preferredDate) - dateMs(a.preferredDate);
      }
    });

    var rows = docs.map(function(r) {
      var isPending  = false;
      var isApproved = r.status === 'Approved';
      var isRescheduled = r.previousDate && r.previousDate !== r.preferredDate;

      } else {

      var svcList = (r.services || []).join(', ') || 'â€â€';

          + '<div style="font-size:11px;color:#718096;margin-top:2px;text-decoration:line-through;">' + _formatDate(r.previousDate) + '</div>'
          + '<div style="font-size:10px;color:#003087;margin-top:1px;display:flex;align-items:center;gap:3px;">'
          + '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#003087" stroke-width="2.5"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>'
          + 'Rescheduled</div>';
      } else {
        dateHtml = '<div style="font-weight:600;color:#003087;">' + _formatDate(r.preferredDate) + '</div>';

      return '<div class="table-row" style="grid-template-columns:1fr 1.5fr 1.5fr 1fr 0.8fr 1fr 140px;align-items:center;">'
        + '<div style="font-weight:700;color:#1a202c;">' + (r.plate || 'â€â€') + '</div>'
        + '<div style="color:#4a5568;font-size:13px;">' + (r.customerName || 'â€â€') + '</div>'
        + '<div style="color:#718096;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + svcList + '">' + svcList + '</div>'
        + '<div>' + dateHtml + '</div>'
        + '<div style="font-size:12px;color:#4a5568;">' + (r.preferredTime || 'â€â€') + '</div>'
        + '<div><span style="background:' + sb + ';color:' + sc + ';font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">' + statusLabel + '</span></div>'
        + '<div style="display:flex;gap:6px;">'
        + (isApproved
            ? (function() {
                var now = new Date();
                var mm = String(now.getMonth()+1).padStart(2,'0');
                var dd = String(now.getDate()).padStart(2,'0');
                var todayKey = now.getFullYear() + '-' + mm + '-' + dd;
                var isToday = r.preferredDate === todayKey;
                var btnStyle = 'width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;border-radius:7px;color:white;';
                if (isToday) {
                  return '<button onclick="startServiceFromBooking(\'' + r.id + '\',\'' + (r.plate||'').replace(/'/g,"\\'") + '\',\'' + encodeURIComponent(JSON.stringify(r.services||[])) + '\',\'' + (r.preferredDate||'') + '\',\'' + (r.customerName||'').replace(/'/g,"\\'") + '\')" title="Start Service" style="' + btnStyle + 'background:#38a169;cursor:pointer;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>';
                } else {
                  var isPastDate = r.preferredDate < todayKey;
                  var disabledTitle = isPastDate
                    ? 'Scheduled date has passed â€â€ please reschedule.'
                    : 'Scheduled on ' + _formatDate(r.preferredDate) + ' â€â€ not yet available to start.';
                  return '<button disabled title="' + disabledTitle + '" style="' + btnStyle + 'background:#38a169;opacity:0.35;cursor:not-allowed;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>';
                }
              })()
              + '<button onclick="rescheduleBooking(\'' + r.id + '\',\'' + (r.plate||'') + '\',\'' + (r.preferredDate||'') + '\',\'' + (r.customerId||'') + '\',\'' + (r.customerName||'').replace(/'/g,"\\'") + '\')" title="Reschedule" style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#003087;border:none;border-radius:7px;color:white;cursor:pointer;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>'
              + '<button onclick="dismissBooking(\'' + r.id + '\')" title="Cancel" style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#e53e3e;border:none;border-radius:7px;color:white;cursor:pointer;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
            : '')

    apRenderPaged('rescheduleTableBody', rows, 10, 'renderRescheduleList');

  window.rescheduleBooking = function(docId, plate, currentDate, customerId, customerName) {
    window._rsDocId = docId;
    window._rsPlate = plate;
    window._rsCurrentDate = currentDate;
    window._rsCurrentTime = '';
    window._rsCustomerId = customerId || '';
    window._rsCustomerName = customerName || '';
    window._rsSelectedDate = '';
    window._rsSelectedTime = '';
    window._rsBookedSlots = {}; // date ? [time, time, ...]

    // Fetch current time from booking doc
    db.collection('service_bookings').doc(docId).get().then(function(doc) {
      if (doc.exists) window._rsCurrentTime = doc.data().preferredTime || '';
      var currentInfo = document.getElementById('rsCurrentInfo');
      if (currentInfo) {
        currentInfo.textContent = currentDate
          ? 'Current: ' + _formatDate(currentDate) + (window._rsCurrentTime ? ' at ' + window._rsCurrentTime : '')
          : '';
      }
    });

    var now = new Date();
    window._rsYear = now.getFullYear();
    window._rsMonth = now.getMonth();

    document.getElementById('rsPlate').textContent = plate;
    document.getElementById('rsCurrentInfo').textContent = currentDate
      ? 'Current: ' + _formatDate(currentDate)
      : '';
    document.getElementById('rsSelectedInfo').style.display = 'none';
    document.getElementById('rsTimeSection').style.display = 'none';
    document.getElementById('rsArriveBy').style.display = 'none';
    document.getElementById('rsConfirmBtn').disabled = true;
    document.getElementById('rsConfirmBtn').style.opacity = '0.5';

    // Load booked slots (date ? taken times), exclude self
    db.collection('service_bookings')
      .where('status', 'in', ['Approved'])
      .get().then(function(snap) {
        var slots = {};
        snap.docs.forEach(function(d) {
          if (d.id === docId) return; // exclude self
          var date = d.data().preferredDate;
          var time = d.data().preferredTime;
          if (date && time) {
            if (!slots[date]) slots[date] = [];
            if (slots[date].indexOf(time) === -1) slots[date].push(time);
          }
        });
        window._rsBookedSlots = slots;
        rsRenderCal();
      }).catch(function() { rsRenderCal(); });

    document.getElementById('rescheduleModal').style.display = 'flex';
  };

  window.closeRescheduleModal = function() {
    document.getElementById('rescheduleModal').style.display = 'none';
  };

  window.rsCalNav = function(dir) {
    window._rsMonth += dir;
    if (window._rsMonth > 11) { window._rsMonth = 0; window._rsYear++; }
    if (window._rsMonth < 0) { window._rsMonth = 11; window._rsYear--; }
    rsRenderCal();
  };

  var _ALL_TIME_SLOTS = ['8:00 AM','9:00 AM','10:00 AM','11:00 AM','1:00 PM','2:00 PM','3:00 PM','4:00 PM'];
  var _ARRIVE_BY_MAP = {
    '8:00 AM':'7:45 AM','9:00 AM':'8:45 AM','10:00 AM':'9:45 AM','11:00 AM':'10:45 AM',
    '1:00 PM':'12:45 PM','2:00 PM':'1:45 PM','3:00 PM':'2:45 PM','4:00 PM':'3:45 PM'
  };

  function rsRenderCal() {
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('rsCalMonth').textContent = MONTHS[window._rsMonth] + ' ' + window._rsYear;
    var firstDay = new Date(window._rsYear, window._rsMonth, 1).getDay();
    var daysInMonth = new Date(window._rsYear, window._rsMonth + 1, 0).getDate();
    var today = new Date(); today.setHours(0,0,0,0);
    var slots = window._rsBookedSlots || {};
    var cells = '';
    for (var i = 0; i < firstDay; i++) cells += '<button class="rs-day empty"></button>';
    for (var d = 1; d <= daysInMonth; d++) {
      var dt = new Date(window._rsYear, window._rsMonth, d);
      var yyyy = dt.getFullYear();
      var mm = String(dt.getMonth() + 1).padStart(2, '0');
      var dd = String(dt.getDate()).padStart(2, '0');
      var dateStr = yyyy + '-' + mm + '-' + dd;
      var isPast = dt < today;
      var isSel = dateStr === window._rsSelectedDate;
      var isCurrent = dateStr === window._rsCurrentDate;
      var takenTimes = slots[dateStr] || [];
      var isFull = takenTimes.length >= _ALL_TIME_SLOTS.length;
      var cls = 'rs-day';
      if (isSel) cls += ' selected';
      else if (isCurrent && !isPast) cls += ' current';
      else if (isPast) cls += ' past';
      else if (isFull) cls += ' full';
      var clickable = !isPast && !isFull;
      var click = clickable ? ' onclick="rsPickDate(\'' + dateStr + '\')"' : '';
      cells += '<button class="' + cls + '"' + click + '>' + d + '</button>';
    }
    document.getElementById('rsCalGrid').innerHTML = cells;
  }

  window.rsPickDate = function(dateStr) {
    window._rsSelectedDate = dateStr;
    window._rsSelectedTime = ''; // reset time on new date
    rsRenderCal();
    // Show time section
    document.getElementById('rsTimeSection').style.display = 'block';
    document.getElementById('rsArriveBy').style.display = 'none';
    document.getElementById('rsSelectedInfo').style.display = 'none';
    document.getElementById('rsConfirmBtn').disabled = true;
    document.getElementById('rsConfirmBtn').style.opacity = '0.5';
    rsRenderTimeSlots();
  };

  function rsRenderTimeSlots() {
    var takenTimes = (window._rsBookedSlots || {})[window._rsSelectedDate] || [];
    var html = _ALL_TIME_SLOTS.map(function(time) {
      var isTaken = takenTimes.indexOf(time) !== -1;
      var isSel = time === window._rsSelectedTime;
      var cls = 'rs-time-chip' + (isSel ? ' selected' : '');
      if (isTaken) {
        return '<button class="' + cls + '" disabled title="Already booked">' + time + '</button>';
      }
      return '<button class="' + cls + '" onclick="rsPickTime(\'' + time + '\')">' + time + '</button>';
    }).join('');
    document.getElementById('rsTimeSlots').innerHTML = html;
  }

  window.rsPickTime = function(time) {
    window._rsSelectedTime = time;
    rsRenderTimeSlots();
    // Arrive-by hint
    var arriveEl = document.getElementById('rsArriveBy');
    var arriveText = document.getElementById('rsArriveByTime');
    if (arriveEl && arriveText) {
      arriveText.textContent = _ARRIVE_BY_MAP[time] || time;
      arriveEl.style.display = 'flex';
    }
    // Summary card
    var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var parts = window._rsSelectedDate.split('-');
    var dateLabel = MONTHS_SHORT[parseInt(parts[1])-1] + ' ' + parseInt(parts[2]) + ', ' + parts[0];
    document.getElementById('rsSelectedDate').textContent = '?? ' + dateLabel;
    document.getElementById('rsSelectedTime').textContent = '?? ' + time;
    document.getElementById('rsSelectedInfo').style.display = 'block';
    // Enable confirm
    document.getElementById('rsConfirmBtn').disabled = false;
    document.getElementById('rsConfirmBtn').style.opacity = '1';
  };

  window.confirmReschedule = function() {
    if (!window._rsSelectedDate || !window._rsSelectedTime || !window._rsDocId) return;
    var oldDate = window._rsCurrentDate || '';
    var oldTime = window._rsCurrentTime || '';
    var newDate = window._rsSelectedDate;
    var newTime = window._rsSelectedTime;
    var plate = window._rsPlate || '';
    var customerId = window._rsCustomerId || '';
    var customerName = window._rsCustomerName || '';

    db.collection('service_bookings').doc(window._rsDocId).update({
      preferredDate: newDate,
      preferredTime: newTime,
      previousDate: oldDate,
      previousTime: oldTime,
      rescheduledBy: 'admin',
      rescheduledAt: firebase.firestore.FieldValue.serverTimestamp(),
    })
    .then(function() {
      closeRescheduleModal();
      var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var p = newDate.split('-');
      var newDateLabel = MONTHS_SHORT[parseInt(p[1])-1] + ' ' + parseInt(p[2]) + ', ' + p[0];
      showToast('Booking rescheduled to ' + newDateLabel + ' at ' + newTime, 'success');

      // Notify customer in-app
      if (customerId) {
        db.collection('notifications').add({
          title: '?? Booking Rescheduled',
          message: 'Your booking for ' + plate + ' has been rescheduled from ' + _formatDate(oldDate) + (oldTime ? ' at ' + oldTime : '') + ' to ' + _formatDate(newDate) + ' at ' + newTime + '.',
          type: 'warning',
          targetRole: '', targetUid: customerId,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(), readBy: {}, isRead: false,
        });
      }

      // Send reschedule email to customer
      db.collection('service_bookings').doc(window._rsDocId).get().then(function(doc) {
        if (!doc.exists) return;
        var bookingData = doc.data();
        var services = (bookingData.services || []).join(', ');
        if (customerId) {
          db.collection('users').doc(customerId).get().then(function(userDoc) {
            if (!userDoc.exists) return;
            var userData = userDoc.data();
            var email = userData.email || '';
            if (!email) return;
            fetch('/api/send-reschedule-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                to_email: email,
                to_name: customerName || userData.name || '',
                plate: plate,
                old_date: oldDate + (oldTime ? ' at ' + oldTime : ''),
                new_date: newDate + ' at ' + newTime,
                services: services
              })
            }).catch(function(err) { console.error('Reschedule email error:', err); });
          });
        }
      });
    })
    .catch(function(err) { showToast('Error: ' + err.message, 'error'); });
  };

  function _updateStats() {
    var s = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
    var rescheduled = _allDocs.filter(function(d){ return d.status === 'Approved' && d.previousDate && d.previousDate !== d.preferredDate; }).length;
    var approved = _allDocs.filter(function(d){ return d.status === 'Approved' && !(d.previousDate && d.previousDate !== d.preferredDate); }).length;
    var cancelled = _allDocs.filter(function(d){ return d.status === 'Cancelled' || d.status === 'Dismissed'; }).length;
    s('sbStatTotal', approved + rescheduled + cancelled);
    s('sbStatApproved', approved);
    s('sbStatRescheduled', rescheduled);
    s('sbStatCancelled', cancelled);
  }
  // Expose so admin_firebase.js global listener can call stats refresh from outside this IIFE
  window._sbUpdateStats = function() {
    if (window._sbAllDocs && window._sbAllDocs.length) _allDocs = window._sbAllDocs;
    _updateStats();
  };

  // ── Auto-cancel past-due bookings ────────────────────────────────────────
  // Cancels any Approved/Pending booking that was never started when:
  //   • preferredDate is before today, OR
  //   • preferredDate is today AND current time is past 5:00 PM
  // Notifies the customer, admin, and staff on each auto-cancel.
  function _autoCancelPastDue(docs) {
    var now = new Date();
    var currentHour = now.getHours(); // 0-23, 17 = 5 PM
    var todayKey = now.getFullYear() + '-'
      + String(now.getMonth() + 1).padStart(2, '0') + '-'
      + String(now.getDate()).padStart(2, '0');

    docs.forEach(function(r) {
      if (r.status !== 'Approved' && r.status !== 'Pending') return;
      if (!r.preferredDate) return;

      var isPastDate  = r.preferredDate < todayKey;
      var isToday     = r.preferredDate === todayKey;
      var isPast5PM   = isToday && currentHour >= 17;

      if (!isPastDate && !isPast5PM) return;

      var cancelReason = isPastDate
        ? 'No-show / Service date passed'
        : 'No-show / Service not started by 5:00 PM';

      // ── Update booking ──
      db.collection('service_bookings').doc(r.id).update({
        status: 'Cancelled',
        cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
        cancelledBy: 'system',
        cancellationReason: cancelReason,
      }).then(function() {
        var plate   = r.plate || '';
        var dateLabel = _formatDate(r.preferredDate);
        var timeLabel = r.preferredTime ? ' at ' + r.preferredTime : '';
        var custName  = r.customerName || 'Customer';

        // ── Notify customer ──
        if (r.customerId) {
          db.collection('notifications').add({
            title: '❌ Booking Auto-Cancelled',
            message: 'Your booking for ' + plate + ' on ' + dateLabel + timeLabel
              + ' was automatically cancelled because the service was not started by 5:00 PM.',
            type: 'warning',
            targetRole: '', targetUid: r.customerId,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            readBy: {}, isRead: false,
          });
        }

        var adminStaffMsg = custName + '\'s booking for ' + plate + ' on ' + dateLabel
          + timeLabel + ' was auto-cancelled (no-show / not started by 5:00 PM).';

        // ── Notify admin ──
        db.collection('notifications').add({
          title: '🔔 Booking Auto-Cancelled',
          message: adminStaffMsg,
          type: 'warning',
          targetRole: 'admin', targetUid: '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          readBy: {}, isRead: false,
        });

        // ── Notify staff ──
        db.collection('notifications').add({
          title: '🔔 Booking Auto-Cancelled',
          message: adminStaffMsg,
          type: 'warning',
          targetRole: 'staff', targetUid: '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          readBy: {}, isRead: false,
        });

      }).catch(function() {}); // silent — will retry on next snapshot
    });
  }

  // ── Data loading — use globally pre-loaded data from admin_firebase.js ──────
  // admin_firebase.js already listens to service_bookings and stores it in
  // window._fbBookings. We just read from there instead of opening a second
  // Firestore connection per page, which was causing the visible delay.
  function _loadFromGlobal() {
    var docs = window._fbBookings || [];
    if (!docs.length) return false;
    _allDocs = docs;
    window._sbAllDocs = _allDocs;
    _autoCancelPastDue(_allDocs);
    _updateStats();
    renderRescheduleList();
    return true;
  }

  // Try immediately (data may already be loaded from another tab/section)
  if (!_loadFromGlobal()) {
    // Data not ready yet — poll briefly until admin_firebase.js listener fires
    var _sbPollCount = 0;
    var _sbPoll = setInterval(function() {
      _sbPollCount++;
      if (_loadFromGlobal() || _sbPollCount >= 40) {
        clearInterval(_sbPoll);
        // If still empty after 4s, fall back to a direct one-shot get
        if (!_allDocs.length) {
          db.collection('service_bookings').orderBy('createdAt', 'desc').get()
            .then(function(snap) {
              _allDocs = snap.docs.map(function(d) {
                var data = d.data(); data.id = d.id; return data;
              });
              window._sbAllDocs = _allDocs;
              _autoCancelPastDue(_allDocs);
              _updateStats();
              renderRescheduleList();
            });
        }
      }
    }, 100); // check every 100ms
  }
})();
</script>
