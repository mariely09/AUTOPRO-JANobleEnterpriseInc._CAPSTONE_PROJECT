<script>
// Instant auth guard — blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
  }
})();
</script>

<script>
// ── Smart AI Widget — fully fixed version ─────────────────────────────────
var _aiVehicles = [], _aiMaintenance = [], _aiLoaded = false;
var _aiPanelOpen = false;
var _aiChatHistory = [];
var _aiCurrentUid = null;
var _aiResolvedName = '';   // resolved from Firestore (not just sessionStorage)
var _aiSessionId = null;    // server-side session key
var _aiRateLimited = false;

// ── localStorage persistence ──────────────────────────────────────────────
function _aiStorKey(uid) { return 'ai_widget_chat_' + uid; }
function _aiLoadSessions(uid) {
    try { var r = localStorage.getItem(_aiStorKey(uid)); return r ? JSON.parse(r) : []; } catch(e) { return []; }
}
function _aiSaveChat() {
    if (!_aiCurrentUid) return;
    try {
        var sessions = _aiLoadSessions(_aiCurrentUid);
        var sid = _aiSessionId || ('w_' + _aiCurrentUid);
        var idx = -1; for (var i=0;i<sessions.length;i++){if(sessions[i].id===sid){idx=i;break;}}
        var s = { id: sid, ts: Date.now(), messages: _aiChatHistory.slice() };
        if (idx>=0) sessions[idx]=s; else sessions.unshift(s);
        if (sessions.length>50) sessions=sessions.slice(0,50);
        localStorage.setItem(_aiStorKey(_aiCurrentUid), JSON.stringify(sessions));
    } catch(e){}
}
function _aiRestoreSession(uid) {
    var sessions = _aiLoadSessions(uid);
    if (!sessions.length) return;
    var latest = sessions[0];
    if (!latest.messages || !latest.messages.length) return;
    _aiChatHistory = latest.messages.slice();
    if (latest.id && latest.id.indexOf('w_')!==0) _aiSessionId = latest.id;
    var welcome = document.getElementById('aiWelcome');
    if (welcome) welcome.style.display = 'none';
    document.getElementById('aiChips').style.display = 'none';
    var cb = document.getElementById('aiClearBtn'); if(cb){ cb.style.display='flex'; }
    _aiChatHistory.forEach(function(m){ _aiAddBubble(m.text, m.role==='user'); });
}

// ── History drawer ────────────────────────────────────────────────────────
window.aiOpenHistory = function() {
    _aiRenderHistory();
    document.getElementById('aiHistDrawer').style.right = '0';
    document.getElementById('aiHistOverlay').style.opacity = '1';
    document.getElementById('aiHistOverlay').style.pointerEvents = 'auto';
};
window.aiCloseHistory = function() {
    document.getElementById('aiHistDrawer').style.right = '-340px';
    document.getElementById('aiHistOverlay').style.opacity = '0';
    document.getElementById('aiHistOverlay').style.pointerEvents = 'none';
};
window.aiDeleteAllChats = function() {
    if (!confirm('Delete all chat history? This cannot be undone.')) return;
    if (_aiCurrentUid) localStorage.removeItem(_aiStorKey(_aiCurrentUid));
    if (_aiSessionId) { fetch('/api/ai-session/'+_aiSessionId,{method:'DELETE'}).catch(function(){}); _aiSessionId=null; }
    _aiChatHistory = [];
    _aiRebuildWelcome();
    aiCloseHistory();
};
function _aiEscH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').slice(0,80); }
function _aiRenderHistory() {
    var list = document.getElementById('aiHistList'); if(!list) return;
    var sessions = _aiCurrentUid ? _aiLoadSessions(_aiCurrentUid) : [];
    sessions = sessions.filter(function(s){ return s.messages && s.messages.length>0; });
    if (!sessions.length) { list.innerHTML='<div style="text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px;">No chat history yet.<br>Start a conversation!</div>'; return; }
    var html='',today=new Date(),todayStr=today.toDateString(),yest=new Date(today);
    yest.setDate(today.getDate()-1); var yestStr=yest.toDateString(),lastLabel='';
    sessions.forEach(function(s){
        var d=new Date(s.ts),label=d.toDateString()===todayStr?'Today':d.toDateString()===yestStr?'Yesterday':d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
        if(label!==lastLabel){html+='<div style="font-size:10.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px;">'+label+'</div>';lastLabel=label;}
        var first=null; for(var i=0;i<s.messages.length;i++){if(s.messages[i].role==='user'){first=s.messages[i];break;}}
        var preview=first?first.text:'(empty)',time=d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
        html+='<div style="background:#f8f9fb;border:1.5px solid #e8edf2;border-radius:11px;padding:10px 12px;margin-bottom:7px;cursor:pointer;" onclick="aiLoadSession(\''+s.id+'\')" onmouseover="this.style.background=\'#fff5f5\';this.style.borderColor=\'#E8001C\'" onmouseout="this.style.background=\'#f8f9fb\';this.style.borderColor=\'#e8edf2\'">'
             +'<div style="font-size:12px;color:#1a202c;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;">'+_aiEscH(preview)+'</div>'
             +'<div style="font-size:10.5px;color:#94a3b8;margin-top:3px;">'+time+' &nbsp;·&nbsp; '+s.messages.length+' message'+(s.messages.length!==1?'s':'')+'</div></div>';
    });
    list.innerHTML=html;
}
window.aiLoadSession = function(sid) {
    var sessions = _aiCurrentUid ? _aiLoadSessions(_aiCurrentUid) : [];
    var session=null; for(var i=0;i<sessions.length;i++){if(sessions[i].id===sid){session=sessions[i];break;}}
    if(!session||!session.messages||!session.messages.length) return;
    var msgs=document.getElementById('aiMessages');
    var welcome=document.getElementById('aiWelcome');
    if(welcome&&welcome.parentNode===msgs) msgs.removeChild(welcome);
    msgs.innerHTML='';
    if(welcome){ welcome.style.display='none'; msgs.appendChild(welcome); }
    document.getElementById('aiChips').style.display='none';
    var cb=document.getElementById('aiClearBtn'); if(cb) cb.style.display='flex';
    _aiChatHistory=session.messages.slice();
    _aiSessionId=(session.id&&session.id.indexOf('w_')!==0)?session.id:null;
    _aiChatHistory.forEach(function(m){ _aiAddBubble(m.text, m.role==='user'); });
    aiCloseHistory();
};

// ── Rebuild welcome (used by clear + delete) ──────────────────────────────

// ── Load customer data (ownerId first, fallback owner name) ───────────────
async function _aiLoadData() {
    try {
        var user = firebase.auth().currentUser; if(!user) return;
        var stored = sessionStorage.getItem('cpUser');
        var cpUser = stored ? JSON.parse(stored) : {};
        var userName = cpUser.name || '';
        if (!userName) {
            var uDoc = await firebase.firestore().collection('users').doc(user.uid).get();
            if (uDoc.exists) userName = uDoc.data().name || '';
        }
        if (userName) _aiResolvedName = userName;

        // Query by ownerId (primary) + owner name (fallback), deduplicate
        var seenIds = {};
        var vSnap1 = await firebase.firestore().collection('vehicles').where('ownerId','==',user.uid).get();
        vSnap1.docs.forEach(function(d){ seenIds[d.id]=true; _aiVehicles.push(Object.assign({id:d.id},d.data())); });
        if (userName) {
            var vSnap2 = await firebase.firestore().collection('vehicles').where('owner','==',userName).get();
            vSnap2.docs.forEach(function(d){ if(!seenIds[d.id]){ seenIds[d.id]=true; _aiVehicles.push(Object.assign({id:d.id},d.data())); }});
        }

        var subEl = document.getElementById('aiWelcomeSub');
        if (subEl) subEl.textContent = _aiVehicles.length
            ? 'Ask me anything about your '+_aiVehicles.length+' vehicle'+(_aiVehicles.length!==1?'s':'')+' — PMS, history, bookings, and more.'
            : 'No vehicles found under your account.';

        if (_aiVehicles.length) {
            var plates = _aiVehicles.map(function(v){return v.plate||v.plateNumber||'';}).filter(Boolean).slice(0,10);
            if (plates.length) {
                var mSnap = await firebase.firestore().collection('maintenance').where('plate','in',plates).get();
                _aiMaintenance = mSnap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
            }
        }
        _aiLoaded = true;
    } catch(e) { console.error('AI load error:',e); }
}

// ── Add chat bubble ───────────────────────────────────────────────────────
function _aiAddBubble(text, isUser) {
    var msgs = document.getElementById('aiMessages');
    var row = document.createElement('div');
    row.className = 'ai-row' + (isUser ? ' user' : '');
    var av = document.createElement('div');
    if (isUser) {
        av.className = 'ai-av-usr';
        var initials = _aiResolvedName ? _aiResolvedName.trim().split(' ').filter(Boolean).map(function(p){return p[0];}).slice(0,2).join('').toUpperCase() : '?';
        av.textContent = initials;
    } else {
        av.className = 'ai-av-bot';
        av.innerHTML = '<img src="../static/img/AI_LOGO.png" width="22" height="22" style="object-fit:contain;display:block;" alt="AI">';
    }
    var bub = document.createElement('div');
    bub.className = isUser ? 'ai-bubble-user' : 'ai-bubble-bot';
    bub.textContent = text;
    if (isUser) { row.appendChild(bub); row.appendChild(av); }
    else { row.appendChild(av); row.appendChild(bub); }
    msgs.appendChild(row);
    row.scrollIntoView({behavior:'smooth'});
    return bub;
}

function _aiAddTyping() {
    var msgs = document.getElementById('aiMessages');
    var row = document.createElement('div');
    row.className = 'ai-row'; row.id = '_aiTypingRow';
    var av = document.createElement('div');
    av.className = 'ai-av-bot';
    av.innerHTML = '<img src="../static/img/AI_LOGO.png" width="22" height="22" style="object-fit:contain;display:block;" alt="AI">';
    var dots = document.createElement('div');
    dots.className = 'ai-typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(av); row.appendChild(dots);
    msgs.appendChild(row); row.scrollIntoView({behavior:'smooth'});
    return row;
}

// ── Scoped local fallback (AI backend unreachable) ────────────────────────
function _aiFallback(q) {
    var ql = q.toLowerCase().trim();
    // Out-of-scope: inventory
    if (ql.indexOf('inventory')!==-1||ql.indexOf('stock level')!==-1||ql.indexOf('issuance')!==-1||ql.indexOf('warehouse')!==-1||ql.indexOf('purchase order')!==-1)
        return "I can only answer questions related to the Automotive Service and Inventory Management System.";
    // Out-of-scope: reports
    if ((ql.indexOf('report')!==-1||ql.indexOf('generate')!==-1||ql.indexOf(' pdf')!==-1||ql.indexOf('excel')!==-1)&&ql.indexOf('my service')===-1&&ql.indexOf('my vehicle')===-1)
        return "I can only answer questions related to the Automotive Service and Inventory Management System.";
    // Privacy: another customer
    if (ql.indexOf('another customer')!==-1||ql.indexOf('juan dela cruz')!==-1||ql.indexOf('other customer')!==-1||ql.indexOf('bookings of customer')!==-1)
        return "I can only show information for your own account.";
    // Out-of-scope: general knowledge
    var oos=['capital of','weather','news','sport','coding','math','recipe','movie','music','game','history of','who is','what country','population','translate','bitcoin','crypto'];
    for(var i=0;i<oos.length;i++){ if(ql.indexOf(oos[i])!==-1) return "I can only answer questions related to the Automotive Service and Inventory Management System."; }
    // Garbage
    var meaningful = (q.match(/[a-zA-Z0-9]/g)||[]).length;
    if (meaningful<2) return "I didn't understand that. Please type a question about your vehicles, bookings, or services.";
    // Previous question after clear
    if (ql.indexOf('previous question')!==-1||ql.indexOf('last question')!==-1||ql.indexOf('what did i ask')!==-1) {
        var prevMsgs = _aiChatHistory.filter(function(m){return m.role==='user'&&m.text!==q;});
        if (!prevMsgs.length) return "There's no previous conversation in this session. Feel free to ask me anything about your vehicles, bookings, or services!";
        return 'Your previous question was: "'+prevMsgs[prevMsgs.length-1].text+'"';
    }
    if (!_aiVehicles.length) return 'No vehicles are registered under your account yet.';
    // Service history
    if (ql.indexOf('service history')!==-1||ql.indexOf('past service')!==-1||ql.indexOf('show my service')!==-1||ql.indexOf('spent')!==-1||ql.indexOf('maintenance record')!==-1) {
        var done=_aiMaintenance.filter(function(m){return (m.status||'').toLowerCase()==='completed';});
        if (!done.length) return "You don't have any completed service records yet.";
        var total=done.reduce(function(s,r){var raw=r.cost||'0';return s+(parseFloat(String(raw).replace(/[₱,\s]/g,''))||0);},0);
        return 'You have '+done.length+' completed service record'+(done.length!==1?'s':'')+'.\nTotal spent: ₱'+total.toLocaleString('en-PH',{minimumFractionDigits:2})+'\n\nGo to the "PMS History" tab to view full details.';
    }
    // Vehicles
    if (ql.indexOf('my vehicle')!==-1||ql.indexOf('my fleet')!==-1||ql.indexOf('my car')!==-1||ql.indexOf('list my')!==-1||ql.indexOf('show my vehicle')!==-1) {
        var lines=_aiVehicles.map(function(v){var e=(v.status==='On Track'||v.status==='Active')?'✅':v.status&&v.status.toLowerCase().indexOf('maintenance')!==-1?'🔧':v.status==='Overdue'?'⚠️':'•'; return e+' '+(v.plate||v.plateNumber||'—')+' — '+(v.desc||v.assetDescription||'—')+' ('+(v.status||'Active')+')';}).join('\n');
        return 'Your fleet ('+_aiVehicles.length+' vehicle'+(_aiVehicles.length!==1?'s':'')+'): \n'+lines;
    }
    // PMS overdue
    if (ql.indexOf('overdue')!==-1) {
        var list=_aiVehicles.filter(function(v){return (v.status||'').toLowerCase()==='overdue';});
        return list.length?'PMS Overdue ('+list.length+'):\n'+list.map(function(v){return '• '+(v.plate||'—')+' — '+(v.desc||'—');}).join('\n')+'\n\nPlease schedule a service soon!':'None of your vehicles are overdue for PMS. ✅';
    }
    // Pricing
    if (ql.indexOf('how much')!==-1||ql.indexOf('price')!==-1||ql.indexOf('cost of')!==-1||ql.indexOf('oil change')!==-1||ql.indexOf('change oil')!==-1)
        return 'For service pricing, please ask when the AI service is online — it can look up exact prices from the catalog.';
    // Fleet summary fallback
    var active=_aiVehicles.filter(function(v){return (v.status==='Active'||v.status==='On Track');}).length;
    var maint=_aiVehicles.filter(function(v){return v.status&&v.status.toLowerCase().indexOf('maintenance')!==-1;}).length;
    var over=_aiVehicles.filter(function(v){return (v.status||'').toLowerCase()==='overdue';}).length;
    return 'Fleet Summary:\n✅ Active: '+active+'\n🔧 Under Maintenance: '+maint+'\n⚠️ PMS Overdue: '+over+'\n🚗 Total: '+_aiVehicles.length;
}

// ── Send ──────────────────────────────────────────────────────────────────
window.aiSend = async function(preset) {
    var input = document.getElementById('aiInput');
    var text = (preset || input.value).trim();
    if (!text || _aiRateLimited) return;

    var welcome = document.getElementById('aiWelcome');
    if (welcome) welcome.style.display = 'none';
    document.getElementById('aiChips').style.display = 'none';
    var cb = document.getElementById('aiClearBtn'); if(cb) cb.style.display='flex';

    _aiChatHistory.push({role:'user',text:text,ts:Date.now()});
    _aiAddBubble(text, true);
    input.value=''; input.style.height='auto';

    if (!_aiLoaded) {
        var msg='Still loading your profile — please try again in a moment.';
        _aiChatHistory.push({role:'bot',text:msg,ts:Date.now()});
        _aiAddBubble(msg, false); _aiSaveChat(); return;
    }

    var typing = _aiAddTyping();
    try {
        var user = firebase.auth().currentUser;
        var resp = await fetch('/api/ai-chat', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                message:       text,
                user_type:     'customer',
                customer_uid:  user ? user.uid : '',
                customer_name: _aiResolvedName,
                session_id:    _aiSessionId
            })
        });
        var data = await resp.json();
        typing.remove();

        if (data.rate_limited) {
            _aiRateLimited = true;
            var rlMsg = 'AI Unavailable — Daily token limit reached. Resets in '+(data.reset_in||'some time')+'.';
            _aiChatHistory.push({role:'bot',text:rlMsg,ts:Date.now()});
            _aiAddBubble(rlMsg, false);
            var inp=document.getElementById('aiInput'); if(inp){inp.disabled=true;inp.placeholder='AI unavailable — daily limit reached';}
            var sb=document.getElementById('aiSendBtn'); if(sb){sb.disabled=true;sb.style.opacity='0.45';}
        } else if (data.answer) {
            if (data.session_id) _aiSessionId = data.session_id;
            _aiChatHistory.push({role:'bot',text:data.answer,ts:Date.now()});
            _aiAddBubble(data.answer, false);
        } else if (data.offline || !data.success) {
            var fbReply = _aiFallback(text);
            _aiChatHistory.push({role:'bot',text:fbReply,ts:Date.now()});
            _aiAddBubble(fbReply, false);
        } else {
            var fbReply2 = _aiFallback(text);
            _aiChatHistory.push({role:'bot',text:fbReply2,ts:Date.now()});
            _aiAddBubble(fbReply2, false);
        }
    } catch(e) {
        typing.remove();
        var errReply = _aiFallback(text);
        _aiChatHistory.push({role:'bot',text:errReply,ts:Date.now()});
        _aiAddBubble(errReply, false);
    }
    _aiSaveChat();
};

// ── Clear chat ────────────────────────────────────────────────────────────
window.aiClear = function() {
    if (_aiChatHistory.length) _aiSaveChat();
    if (_aiSessionId) { fetch('/api/ai-session/'+_aiSessionId,{method:'DELETE'}).catch(function(){}); _aiSessionId=null; }
    _aiRateLimited = false;
    _aiChatHistory = [];
    _aiRebuildWelcome();
};

    });
}
