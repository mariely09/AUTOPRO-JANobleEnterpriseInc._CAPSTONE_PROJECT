        .bs-col { }

        .bs-card { background:white; border-radius:14px; border:1.5px solid #e2e8f0; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .bs-card:hover { border-color:#cbd5e0; box-shadow:0 4px 14px rgba(0,0,0,0.10); }
        .bs-card.selected { border-color:#E8001C; border-width:2px; background:#fff5f5; box-shadow:0 4px 14px rgba(232,0,28,0.12); }
        .bs-card-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

        .bs-date-btn { width:100%; padding:16px; background:white; border:1.5px solid #e2e8f0; border-radius:14px; font-size:14px; color:#a0aec0; cursor:pointer; display:flex; align-items:center; gap:12px; font-family:inherit; text-align:left; transition:all .15s; position:relative; box-shadow:0 2px 8px rgba(0,0,0,0.06); }

        .bs-empty { text-align:center; padding:28px; color:#718096; font-size:13px; background:white; border-radius:14px; border:1.5px solid #e2e8f0; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .bs-bottom { margin-top:28px; }

        /* ?? Calendar ?? */
        .bs-calendar-wrap { background:white; border-radius:14px; border:1.5px solid #e2e8f0; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }

        .bs-cal-days { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:6px; }
        .bs-cal-days span { font-size:11px; font-weight:700; color:#a0aec0; text-transform:uppercase; padding:4px 0; }
        .bs-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }

<script>
// Instant auth guard — blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
  }
})();
</script>

<script>
var _bsVehicles = [], _bsServices = [];
var _bsSelectedVehicles = {};
// Per-vehicle service selections: vehicleId — { serviceId: true }
var _bsVehicleServices = {};
var _bsDate = '';
var _bsTime = '';
var _bsBookedTimes = {}; // date — array of taken times

window.bsSelectTime = function(btn) {
  document.querySelectorAll('.bs-time-chip').forEach(function(c){ c.classList.remove('selected'); });
  btn.classList.add('selected');
  _bsTime = btn.getAttribute('data-time');
  // Show "Arrive by" (15 min before)
  var arriveMap = {
    '8:00 AM':'7:45 AM','9:00 AM':'8:45 AM','10:00 AM':'9:45 AM','11:00 AM':'10:45 AM',
    '1:00 PM':'12:45 PM','2:00 PM':'1:45 PM','3:00 PM':'2:45 PM','4:00 PM':'3:45 PM'
  };
  var arriveEl = document.getElementById('bsArriveBy');
  var arriveText = document.getElementById('bsArriveByTime');
  if (arriveEl && arriveText) {
    arriveText.textContent = arriveMap[_bsTime] || _bsTime;
    arriveEl.style.display = 'flex';
  }
};

function _updateSummaryCard() {
  // Summary card removed — services per vehicle now shown in right column
}

// Load sidebar + header
(function() {
  var sess = JSON.parse(sessionStorage.getItem('cpUser') || '{}');
  var name = sess.name || '';
  var parts = name.trim().split(' ').filter(Boolean);
  var ini = parts.length >= 2 ? (parts[0][0]+parts[1][0]).toUpperCase() : (parts[0]?parts[0][0].toUpperCase():'CU');
  fetch('customer_sidebar.html').then(function(r){return r.text();}).then(function(html){
    document.getElementById('customerSidebar').innerHTML = html;
    if (typeof setGreeting === 'function') setGreeting();
    if (typeof setActiveTab === 'function') setActiveTab();
    if (name) {
      var av = document.getElementById('cuAvatar'); if(av) av.textContent = ini;
      var hn = document.getElementById('cuHeaderName'); if(hn) hn.textContent = name;
      var ge = document.getElementById('cuGreetLine'); if(ge && !ge.textContent) ge.textContent = sess.email || '';
      var mn = document.getElementById('cuAvatarName'); if(mn) mn.textContent = name;
    }
  });
  fetch('customer_header.html').then(function(r){return r.text();}).then(function(html){
    document.getElementById('customerHeader').innerHTML = html;
  });
})();

// Load data
firebase.auth().onAuthStateChanged(function(user){
  if (!user) { window.location.href = 'login.html'; return; }
  _loadBookingData(user);
});

async function _loadBookingData(user) {
  var db = firebase.firestore();
  // Get user name and company name
  var uDoc = await db.collection('users').doc(user.uid).get();
  var uData = uDoc.exists ? uDoc.data() : {};
  var userName = (uData.name || '').toLowerCase().trim();
  var companyName = (uData.companyName || '').toLowerCase().trim();

  // Load vehicles — match if owner equals user name OR company name (case-insensitive)
  var vSnap = await db.collection('vehicles').get();
  _bsVehicles = vSnap.docs
    .map(function(d){ return Object.assign({id:d.id}, d.data()); })
    .filter(function(v){
      var owner = (v.owner || '').toLowerCase().trim();
      var ownerId = (v.ownerId || '').trim();
      return (userName && owner === userName)
          || (companyName && owner === companyName)
          || (ownerId && ownerId === user.uid);
    });

  // Load services from item_master
  var iSnap = await db.collection('item_master').get();
  _bsServices = iSnap.docs
    .map(function(d){ return Object.assign({id:d.id}, d.data()); })
    .filter(function(i){ return (i.type||i.itemType||'').toLowerCase() === 'service'; });

  // Auto-select vehicle from URL param (e.g. ?vehicleId=xxx)
  var urlParams = new URLSearchParams(window.location.search);
  var preselectedId = urlParams.get('vehicleId');
  if (preselectedId && _bsVehicles.some(function(v){ return v.id === preselectedId; })) {
    _bsSelectedVehicles[preselectedId] = true;
    _bsVehicleServices[preselectedId] = {};
  }

  _renderVehicles();
  _renderServices();
  _renderPerVehicleServices();
  _updateDateSuggestion();
  _updateSummaryCard();
}

function _renderVehicles() {
  var el = document.getElementById('bsVehicles');
  if (!_bsVehicles.length) { el.innerHTML = '<div class="bs-empty">No vehicles found under your account.</div>'; return; }
  el.innerHTML = _bsVehicles.map(function(v){
    var sel = !!_bsSelectedVehicles[v.id];

var _bsSuggestedDate = '';
function _updateDateSuggestion() {
  var el = document.getElementById('bsDateSuggestion');
  var txt = document.getElementById('bsDateSuggestionText');
  if (!el || !txt) return;
  var vehicleIds = Object.keys(_bsSelectedVehicles);
  if (!vehicleIds.length) { el.style.display = 'none'; return; }

  var vehicle = _bsVehicles.find(function(v){ return v.id === vehicleIds[0]; });
  if (!vehicle) { el.style.display = 'none'; return; }

  var lastSvc = vehicle.lastSvcDate || '';
  var freq = parseInt(vehicle.svcFreq) || 0;
  var now = new Date();
  var tomorrow = new Date(now.getTime() + 86400000);
  tomorrow.setHours(0,0,0,0);
  var suggested = null;
  var reason = '';

  if (lastSvc && freq > 0) {
    var lastDate = new Date(lastSvc);
    if (!isNaN(lastDate)) {
      var nextPms = new Date(lastDate.getFullYear(), lastDate.getMonth() + freq, lastDate.getDate());
      if (nextPms > now) {
        suggested = new Date(nextPms.getTime() - 3*86400000);
        if (suggested < tomorrow) suggested = new Date(tomorrow);
        reason = 'Based on PMS schedule (due ' + _toLocalDateStr(nextPms) + ')';
      } else {
        suggested = new Date(tomorrow);
        reason = 'PMS is overdue — book ASAP';
      }
    }
  }

  if (!suggested) {
    suggested = new Date(tomorrow);
    reason = 'Next available open day';
  }

  // Shift forward past fully-booked dates (all 8 slots taken)
  var attempts = 0;
  while (attempts < 60) {
    var ds = _toLocalDateStr(suggested);
    var takenSlots = _bsBookedDates[ds] || [];
    var isFull = takenSlots.length >= _ALL_TIME_SLOTS.length;
    if (!isFull) break;
    suggested = new Date(suggested.getTime() + 86400000);
    attempts++;
  }

  _bsSuggestedDate = _toLocalDateStr(suggested);
  txt.textContent = _fmtDatePretty(_bsSuggestedDate) + ' - ' + reason;
  el.style.display = 'flex';
}

// ?? Custom Calendar ??
var _bsCalYear, _bsCalMonth, _bsCalSelectedDate = '';
var _bsBookedDates = {}; // date -> Set of taken time strings
var _ALL_TIME_SLOTS = ['8:00 AM','9:00 AM','10:00 AM','11:00 AM','1:00 PM','2:00 PM','3:00 PM','4:00 PM'];

// Load existing bookings to show availability
async function _loadBookedDates() {
  try {
    var db = firebase.firestore();
    var snap = await db.collection('service_bookings')
      .where('status', 'in', ['Approved', 'Pending'])
      .get();
    _bsBookedDates = {};
    snap.docs.forEach(function(d) {
      var date = d.data().preferredDate;
      var time = d.data().preferredTime;
      if (date && time) {
        if (!_bsBookedDates[date]) _bsBookedDates[date] = [];
        if (_bsBookedDates[date].indexOf(time) === -1) _bsBookedDates[date].push(time);
      }
    });
    bsRenderCalendar();
    _updateDateSuggestion(); // re-evaluate suggestion now that availability data is loaded
  } catch(e) { /* ignore */ }
}

function _initCalendar() {
  var now = new Date();
  _bsCalYear = now.getFullYear();
  _bsCalMonth = now.getMonth();
  _loadBookedDates();
  bsRenderCalendar();
}

window.bsCalNav = function(dir) {
  _bsCalMonth += dir;
  if (_bsCalMonth > 11) { _bsCalMonth = 0; _bsCalYear++; }
  if (_bsCalMonth < 0) { _bsCalMonth = 11; _bsCalYear--; }
  bsRenderCalendar();
};

function bsRenderCalendar() {
  var monthEl = document.getElementById('bsCalMonth');
  var gridEl = document.getElementById('bsCalGrid');
  if (!monthEl || !gridEl) return;

  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  monthEl.textContent = MONTHS[_bsCalMonth] + ' ' + _bsCalYear;

  var firstDay = new Date(_bsCalYear, _bsCalMonth, 1).getDay();
  var daysInMonth = new Date(_bsCalYear, _bsCalMonth + 1, 0).getDate();
  var today = new Date();
  today.setHours(0,0,0,0);

  var cells = '';

  // Empty cells before first day
  for (var i = 0; i < firstDay; i++) {
    cells += '<div class="bs-cal-cell empty"></div>';
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var dateObj = new Date(_bsCalYear, _bsCalMonth, d);
    var yyyy = dateObj.getFullYear();
    var mm = String(dateObj.getMonth() + 1).padStart(2, '0');
    var dd = String(dateObj.getDate()).padStart(2, '0');
    var dateStr = yyyy + '-' + mm + '-' + dd;
    var dayOfWeek = dateObj.getDay();
    var isPast = dateObj < today;
    var takenSlots = _bsBookedDates[dateStr] || [];
    var isFull = takenSlots.length >= _ALL_TIME_SLOTS.length;
    var isSelected = dateStr === _bsCalSelectedDate;

    var cls = 'bs-cal-cell';
    if (isSelected) {
      cls += ' selected';
    } else if (isPast) {
      cls += ' closed';
    } else if (isFull) {
      cls += ' full';
    } else {
      cls += ' available';
    }

    var clickable = !isPast && !isFull;
    var onclick = clickable ? ' onclick="bsSelectDate(\'' + dateStr + '\')"' : '';

    cells += '<div class="' + cls + '"' + onclick + '>'
      + '<span>' + d + '</span>'
      + '<span class="bs-cal-dot"></span>'
      + '</div>';
  }

  gridEl.innerHTML = cells;
}

window.bsToggleCalendar = function() {
  var wrap = document.getElementById('bsCalendarWrap');
  if (wrap.style.display === 'none') {
    wrap.style.display = 'block';
    if (!_bsCalYear) _initCalendar();
    else bsRenderCalendar();
  } else {
    wrap.style.display = 'none';
  }
};

async function _loadBookedTimesForDate(dateStr) {
  // Reuse already-loaded slot data from _bsBookedDates, only fetch if not yet loaded
  if (_bsBookedTimes[dateStr] !== undefined) {
    _renderTimeSlots();
    return;
  }
  // If _bsBookedDates is populated, derive from it directly
  if (Object.keys(_bsBookedDates).length > 0) {
    _bsBookedTimes[dateStr] = _bsBookedDates[dateStr] ? _bsBookedDates[dateStr].slice() : [];
    _renderTimeSlots();
    return;
  }
  try {
    var db = firebase.firestore();
    var snap = await db.collection('service_bookings')
      .where('preferredDate', '==', dateStr)
      .where('status', 'in', ['Approved', 'Pending'])
      .get();
    var times = [];
    snap.docs.forEach(function(d) {
      var t = d.data().preferredTime;
      if (t && times.indexOf(t) === -1) times.push(t);
    });
    _bsBookedTimes[dateStr] = times;
  } catch(e) {
    _bsBookedTimes[dateStr] = [];
  }
  _renderTimeSlots();
}

function _renderTimeSlots() {
  var takenTimes = _bsDate ? (_bsBookedTimes[_bsDate] || []) : [];
  var now = new Date();
  var todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  var isToday = (_bsDate === todayStr);
  // Map each slot to its 24h hour for comparison
  var slotHour24 = {
    '8:00 AM':8,'9:00 AM':9,'10:00 AM':10,'11:00 AM':11,
    '1:00 PM':13,'2:00 PM':14,'3:00 PM':15,'4:00 PM':16
  };
  var currentHour = now.getHours();
  var currentMinute = now.getMinutes();

  document.querySelectorAll('.bs-time-chip').forEach(function(btn) {
    var time = btn.getAttribute('data-time');
    var isTaken = takenTimes.indexOf(time) !== -1;
    var isPast = false;
    if (isToday && slotHour24[time] !== undefined) {
      var h = slotHour24[time];
      isPast = currentHour > h || (currentHour === h && currentMinute >= 0);
    }
    var isDisabled = isTaken || isPast;
    if (isDisabled) {
      btn.disabled = true;
      btn.classList.add('taken');
      btn.classList.remove('selected');
      btn.title = isPast ? 'This time has already passed' : 'Already booked — choose another time';
      if (_bsTime === time) {
        _bsTime = '';
        var arriveEl = document.getElementById('bsArriveBy');
        if (arriveEl) arriveEl.style.display = 'none';
      }
    } else {
      btn.disabled = false;
      btn.classList.remove('taken');
      btn.title = '';
    }
  });
}

      var vbNames = _bsServices
        .filter(function(s) { return vbSvcs[s.id]; })
        .map(function(s) { return s.name || ''; })
        .filter(Boolean);
      return { plate: v.plate || '', desc: v.desc || '', services: vbNames };
    });
    fetch(_kFlaskBaseUrl + '/api/send-booking-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({
        customer_name:  customerName,
        vehicles:       vehiclePayload,
        preferred_date: _fmtDatePretty(_bsDate),
        preferred_time: _bsTime,
        notes:          (document.getElementById('bsNotes').value || '').trim(),
        target_roles:   ['admin', 'staff'],
      }),
    }).catch(function(e) { console.warn('Booking email dispatch error:', e); });

    // ?? Notify customer (in-app only — they're on the web) ??
    await db.collection('notifications').add({
      title: 'Booking Confirmed',
      message: 'Your service booking on ' + _fmtDatePretty(_bsDate) + ' at ' + _bsTime + ' has been confirmed.\n' + detailedMsg,
      type: 'success', targetRole: '', targetUid: user.uid,
      readBy: {}, isRead: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });

    _toast('Booking confirmed for ' + vCount + ' vehicle(s)!', 'success');
    setTimeout(function(){ window.location.href = 'customer_my_bookings.html'; }, 2000);
  } catch(e) {
    _toast('Error: '+e.message,'error');
    btn.disabled = false; btn.textContent = 'Book Service';
  }
};

function _toast(msg, type) {
  var t = document.getElementById('cuToast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'cu-toast show' + (type==='success'?' success':'');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = 'cu-toast'; }, 3500);
}

function _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function _fmtCost(c) {
  var raw = String(c||'').replace(/[₱\s]/g,'').trim();
  if (!raw) return '';
  var num = parseFloat(raw);
  if (isNaN(num)) return '₱' + raw;
  return '₱' + num.toLocaleString('en-PH');
}

var _MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function _toLocalDateStr(d) {
  var yyyy = d.getFullYear();
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}

function _fmtDatePretty(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return _MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
</script>
