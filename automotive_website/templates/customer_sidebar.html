<!-- Customer Sidebar — icon-only by default, expands on toggle -->
<aside class="cu-sidebar" id="cuSidebar">

    <!-- Avatar + User info (visible when expanded) -->
    <div class="cu-sb-profile" onclick="toggleAvatarMenu('cuSidebarAvatarMenu')" style="position:relative;cursor:pointer;">
        <div class="cu-sb-avatar" id="cuAvatar">CU</div>
        <div class="cu-sb-user">
            <div class="cu-sidebar-name"  id="cuHeaderName">Customer</div>
            <div class="cu-sidebar-greet" id="cuGreetLine"></div>
        </div>
        <!-- Dropdown -->
        <div class="avatar-menu cu-sidebar-avatar-menu" id="cuSidebarAvatarMenu" style="display:none;">
            <div class="avatar-menu-user">
                <div class="avatar-menu-name" id="cuAvatarName">Customer</div>
                <div class="avatar-menu-role">Customer</div>
            </div>
            <div class="avatar-menu-divider"></div>
            <a href="/profile" class="avatar-menu-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                My Profile
            </a>
            <div class="avatar-menu-divider"></div>
            <button class="avatar-menu-item avatar-menu-logout" onclick="cuAvatarLogout()">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </button>
        </div>
    </div>

    <!-- Nav links -->
    <nav class="cu-sb-nav">
        <a href="/customer_dashboard" class="cu-sb-link" data-page="dashboard" title="Home">
            <span class="cu-sb-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
            <span class="cu-sb-label">Home</span>
        </a>
        <a href="/customer_my_bookings" class="cu-sb-link" data-page="my-bookings" title="My Bookings">
            <span class="cu-sb-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
            </span>
            <span class="cu-sb-label">My Bookings</span>
        </a>
        <a href="/customer_pms_history" class="cu-sb-link" data-page="pms" title="PMS History">
            <span class="cu-sb-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            </span>
            <span class="cu-sb-label">PMS History</span>
        </a>
    </nav>

    <div style="flex:1;"></div>

    <!-- Bottom items -->
    <div class="cu-sb-bottom">
        <!-- Profile -->
        <a href="/profile" class="cu-sb-link" data-page="profile" title="Profile">
            <span class="cu-sb-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span class="cu-sb-label">Profile</span>
        </a>

        <!-- Logout -->
        <button class="cu-sb-link cu-sb-btn cu-sb-logout" onclick="cuAvatarLogout()" title="Logout">
            <span class="cu-sb-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </span>
            <span class="cu-sb-label">Logout</span>
        </button>
    </div>
</aside>

<!-- Mobile overlay -->
<div class="cu-sidebar-overlay" id="cuSidebarOverlay" onclick="cuCloseSidebar()"></div>
