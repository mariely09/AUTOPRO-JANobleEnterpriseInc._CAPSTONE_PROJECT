<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMS History Details</title>
    <link rel="icon" type="image/png" href="../static/img/LOGO_CALTEX.png" />
    <link rel="stylesheet" href="../static/css/customer_dashboard.css">
    <style>
        .phd-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            padding: 24px 32px;
        }
        .phd-sidebar { position: sticky; top: 24px; align-self: start; }
        .phd-vehicle-card {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 55%, #E8001C 100%);
            border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 16px rgba(232,0,28,0.25); border: none;
        }
        .phd-vehicle-plate { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .phd-vehicle-desc  { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 16px; }
        .phd-stats { display: flex; flex-direction: column; gap: 10px; }
        .phd-stat-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .phd-stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(255,255,255,0.15); }
        .phd-stat-value { font-size: 16px; font-weight: 700; color: #fff; }
        .phd-stat-label { font-size: 11px; color: rgba(255,255,255,0.6); }
        .phd-records { min-width: 0; }
        .phd-records-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .phd-records-title  { font-size: 16px; font-weight: 700; color: #1a202c; }
        .phd-record-card {
            background: white; border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 14px;
            overflow: hidden; border: 1px solid #f0f4f8;
            transition: box-shadow .15s, transform .15s;
        }
        .phd-record-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.12); transform: translateY(-1px); }
        .phd-empty { text-align: center; padding: 60px 20px; color: #718096; }
        .phd-loading { text-align: center; padding: 40px 20px; color: #718096; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 768px) {
            .phd-layout { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
            .phd-sidebar { position: static; }
        }
    </style>
</head>
<body data-page="pms-details">

<!-- Sidebar (loaded dynamically) -->
<div id="customerSidebar"></div>

<div class="cu-page-shell">
<!-- Header (loaded dynamically) -->
<div id="customerHeader"></div>

<!-- Main content -->
<main class="cu-main">
    <div class="phd-layout" id="phdMain">
        <div class="phd-loading" style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:200px;">Loading...</div>
    </div>
</main>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyCaoJWbwJk0Xi694ARHpdHhiNjT0SpASRs",
    authDomain: "caltex-autopro-1e664.firebaseapp.com",
    projectId: "caltex-autopro-1e664",
    storageBucket: "caltex-autopro-1e664.firebasestorage.app",
    messagingSenderId: "930140433367",
    appId: "1:930140433367:web:cf67bfa388fa517422b992"
  });

  const db = firebase.firestore();
  const params = new URLSearchParams(window.location.search);
  const plate = params.get('plate');
  const desc  = params.get('desc');
  const type  = params.get('type') || '';

  function vehicleIconSvg(vehicleType, size) {
    const t = (vehicleType || '').toLowerCase();
    const s = size || 24;
    if (t.includes('truck')) {
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`;
    }
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-4h10l2 4h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>`;
  }

  async function init() {
    if (!plate) {
      document.getElementById('phdMain').innerHTML = '<div class="phd-empty"><div style="font-size:48px;margin-bottom:12px;">&#128269;</div><div>No vehicle selected.</div></div>';
      return;
    }

    try {
      // Load completed maintenance records for this plate
      const snap = await db.collection('maintenance')
        .where('plate', '==', plate)
        .where('status', '==', 'Completed')
        .get();

      const records = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      // Compute total cost
      const totalCost = records.reduce((sum, r) => {
        const raw = r.cost || r.totalCost || '0';
        const num = typeof raw === 'number' ? raw
          : parseFloat(String(raw).replace(/[^0-9.]/g, '')) || 0;
        return sum + num;
      }, 0);

      // Get last service odometer from vehicle document
      let lastSvcOdo = '';
      const vSnap = await db.collection('vehicles').where('plate', '==', plate).limit(1).get();
      if (!vSnap.empty) {
        const vData = vSnap.docs[0].data();
        const odo = vData.lastSvcOdo || vData.lastServiceOdometer || '';
        if (odo) lastSvcOdo = String(odo).replace(/[^0-9]/g, '');
      }

      // ── LEFT SIDEBAR ──
      const sidebarHtml = `
        <div class="phd-sidebar">
          <a href="customer_pms_history.html" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#718096;text-decoration:none;margin-bottom:16px;transition:color .2s;" onmouseover="this.style.color='#E8001C'" onmouseout="this.style.color='#718096'">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back to PMS History
          </a>
          <div class="phd-vehicle-card">
            <div class="phd-vehicle-plate">${plate}</div>
            <div class="phd-vehicle-desc">${desc || '&#8212;'}</div>
            <div class="phd-stats">
              <div class="phd-stat-item">
                <div class="phd-stat-icon" style="background:rgba(0,48,135,0.08);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <div>
                  <div class="phd-stat-value">${records.length}</div>
                  <div class="phd-stat-label">Service Records</div>
                </div>
              </div>
              <div class="phd-stat-item">
                <div class="phd-stat-icon" style="background:rgba(232,0,28,0.08);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div>
                  <div class="phd-stat-value">&#x20B1;${totalCost.toLocaleString('en-PH', {minimumFractionDigits:2})}</div>
                  <div class="phd-stat-label">Total Spent</div>
                </div>
              </div>
              ${lastSvcOdo ? `
              <div class="phd-stat-item">
                <div class="phd-stat-icon" style="background:rgba(13,148,136,0.08);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div>
                  <div class="phd-stat-value">${parseInt(lastSvcOdo).toLocaleString()} km</div>
                  <div class="phd-stat-label">Last Service Odometer</div>
                </div>
              </div>` : ''}
            </div>
          </div>
        </div>
      `;

      // ── RIGHT CONTENT — Records ──
      let recordsHtml = '';
      if (!records.length) {
        recordsHtml = '<div class="phd-empty"><div style="font-size:48px;margin-bottom:12px;">&#128269;</div><div>No completed services yet.</div></div>';
      } else {
        recordsHtml = `` + records.map((r, idx) => {
          const costRaw = r.cost || r.totalCost || '';
          const costDisplay = costRaw ? costRaw : '&#8212;';
          return `
            <div class="phd-record-card" style="cursor:pointer;" onclick="phdOpenModal(${idx})">
              <div style="padding:14px;display:flex;align-items:center;gap:12px;">
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:700;font-size:13px;color:#1a202c;">${r.date || '&#8212;'}</div>
                  <div style="font-size:11px;color:#718096;margin-top:2px;">${r.mechanic || '&#8212;'}</div>
                  ${r.odometer ? `<div style="font-size:10px;color:#718096;margin-top:1px;">${r.odometer} km</div>` : ''}
                </div>
                <div style="text-align:right;flex-shrink:0;">
                  <div style="font-weight:700;font-size:14px;color:#1a202c;">${costDisplay}</div>
                  <span style="background:rgba(22,163,106,0.1);color:#16a34a;font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;">Completed</span>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>`;
        }).join('');
      }

      document.getElementById('phdMain').innerHTML = sidebarHtml + `<div class="phd-records">${recordsHtml}</div>`;
      window._phdRecords = records;

    } catch (err) {
      console.error('Error loading PMS history:', err);
      document.getElementById('phdMain').innerHTML =
        `<div class="phd-empty"><div style="font-size:48px;margin-bottom:12px;">&#9888;</div><div>Error loading data: ${err.message}</div></div>`;
    }
  }

  firebase.auth().onAuthStateChanged((user) => {
    if (user) init();
    else window.location.href = 'login.html';
  });
</script>
<script src="../static/js/customer_shared.js"></script>
<script>
  (function() {
    var sess = JSON.parse(sessionStorage.getItem('cpUser') || '{}');
    var name = sess.name || '';
    var parts = name.trim().split(' ').filter(Boolean);
    var ini = parts.length >= 2 ? (parts[0][0]+parts[1][0]).toUpperCase() : (parts[0]?parts[0][0].toUpperCase():'CU');
    fetch('customer_sidebar.html').then(r => r.text()).then(html => {
      document.getElementById('customerSidebar').innerHTML = html;
      if (typeof setGreeting === 'function') setGreeting();
      if (typeof setActiveTab === 'function') setActiveTab();
      if (name) {
        var av = document.getElementById('cuAvatar'); if(av) av.textContent = ini;
        var hn = document.getElementById('cuHeaderName'); if(hn) hn.textContent = name;
        var ge = document.getElementById('cuGreetLine'); if(ge && !ge.textContent) ge.textContent = sess.email || '';
        var mn = document.getElementById('cuAvatarName'); if(mn) mn.textContent = name;
      }
    });
    fetch('customer_header.html').then(r => r.text()).then(html => {
      document.getElementById('customerHeader').innerHTML = html;
    });
  })();
</script>

<!-- View Modal -->
<div id="phdModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)phdCloseModal()">
  <div style="background:white;border-radius:20px;width:100%;max-width:560px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
    <div style="background:#E8001C;padding:20px;display:flex;align-items:center;gap:14px;flex-shrink:0;">
      <div style="flex:1;min-width:0;">
        <div id="phdModalDate" style="font-size:16px;font-weight:800;color:white;">&#8212;</div>
        <div id="phdModalMechanic" style="font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px;">&#8212;</div>
      </div>
      <button onclick="phdCloseModal()" style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">&times;</button>
    </div>
    <div id="phdModalBody" style="padding:20px;overflow-y:auto;"></div>
  </div>
</div>

<script>
  window._phdRecords = [];

  function phdOpenModal(idx) {
    const r = window._phdRecords[idx];
    if (!r) return;

    document.getElementById('phdModalDate').textContent     = r.date     || '&#8212;';
    document.getElementById('phdModalMechanic').textContent = r.mechanic || '&#8212;';

    const svcRows = (r.svcRows || []).filter(s => s.name);
    const matRows = (r.matRows || []).filter(m => m.name);
    const issues  = (r.issues  || []).filter(i => i && String(i).trim());

    function parseCost(val) {
      if (typeof val === 'number') return val;
      return parseFloat(String(val || '0').replace(/[^0-9.]/g, '')) || 0;
    }
    function rowSub(row) {
      return parseCost(row.cost) * (parseFloat(row.qty) || 1);
    }
    function detailRow(label, value) {
      return `<div style="display:flex;padding:6px 0;"><span style="width:130px;font-size:12px;color:#718096;font-weight:500;">${label}</span><span style="font-size:13px;font-weight:600;color:#1a202c;">${value || '&#8212;'}</span></div>`;
    }
    function itemCard(item, color) {
      const sub = rowSub(item);
      const unitCost = parseCost(item.cost).toFixed(2);
      return `<div style="margin-bottom:8px;padding:10px;background:${color}18;border-radius:10px;border:1px solid ${color}30;display:flex;align-items:center;">
        <div style="flex:1;"><div style="font-weight:600;font-size:12px;">${item.name}</div>
        <div style="font-size:10px;color:#718096;">${item.qty} ${item.uom} &middot; &#x20B1;${unitCost} / unit</div></div>
        <span style="font-weight:700;font-size:12px;color:${color};">&#x20B1;${sub.toLocaleString('en-PH',{minimumFractionDigits:2})}</span>
      </div>`;
    }

    let html = '';
    html += detailRow('Service Date', r.date);
    html += detailRow('Mechanic', r.mechanic);
    html += detailRow('Odometer', r.odometer ? r.odometer + ' km' : '');
    html += detailRow('Total Cost', r.cost || r.totalCost);
    html += `<div style="display:flex;padding:6px 0;"><span style="width:130px;font-size:12px;color:#718096;font-weight:500;">Status</span><span style="background:rgba(22,163,106,0.1);color:#16a34a;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">Completed</span></div>`;

    if (issues.length) {
      html += `<div style="margin-top:16px;font-size:12px;font-weight:700;color:#4a5568;">Vehicle Issues Reported</div>`;
      html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">`;
      html += issues.map(i => `<span style="background:#fff5f5;border:1.5px solid #fed7d7;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:#E8001C;">${i}</span>`).join('');
      html += `</div>`;
    }
    if (svcRows.length) {
      html += `<div style="margin-top:16px;font-size:12px;font-weight:700;color:#2b6cb0;">Services Rendered</div>`;
      html += `<div style="margin-top:8px;">${svcRows.map(s => itemCard(s, '#2b6cb0')).join('')}</div>`;
    }
    if (matRows.length) {
      html += `<div style="margin-top:16px;font-size:12px;font-weight:700;color:#0d9488;">Materials Used</div>`;
      html += `<div style="margin-top:8px;">${matRows.map(m => itemCard(m, '#0d9488')).join('')}</div>`;
    }

    html += `<hr style="border:none;border-top:1px solid #e2e8f0;margin:16px 0;">`;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:600;font-size:13px;color:#4a5568;">Total</span>
      <span style="font-weight:700;font-size:16px;color:#1a202c;">${r.cost || r.totalCost || '&#8212;'}</span>
    </div>`;

    document.getElementById('phdModalBody').innerHTML = html;
    document.getElementById('phdModal').style.display = 'flex';
  }

  function phdCloseModal() {
    document.getElementById('phdModal').style.display = 'none';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') phdCloseModal();
  });
</script>
</div><!-- /.cu-page-shell -->
</body>
</html>
