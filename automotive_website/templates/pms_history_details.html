<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMS History Details</title>
    <link rel="icon" type="image/png" href="../static/img/LOGO_CALTEX.png" />
    <link rel="stylesheet" href="../static/css/customer_dashboard.css">
    <style>
        /* ── Print styles ── */
        @media print {
            body * { visibility: hidden; }
            #phdPrintArea, #phdPrintArea * { visibility: visible; }
            #phdPrintArea {
                position: fixed; inset: 0; width: 100%; padding: 20px;
                font-family: Arial, sans-serif; font-size: 12px; color: #1a202c;
                background: white;
            }
        }
    <style>
        .phd-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            padding: 24px 32px;
        }
        .phd-sidebar { position: sticky; top: 24px; align-self: start; }
        .phd-vehicle-card {
            background: linear-gradient(135deg, #004B5F 0%, #EE152A 100%);
            border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 16px rgba(0,75,95,0.3); border: none;
        }
        .phd-vehicle-plate { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .phd-vehicle-desc  { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 16px; }
        .phd-stats { display: flex; flex-direction: column; gap: 10px; }
        .phd-stat-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .phd-stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(255,255,255,0.15); }
        .phd-stat-value { font-size: 16px; font-weight: 700; color: #fff; }
        .phd-stat-label { font-size: 11px; color: rgba(255,255,255,0.6); }
        .phd-records { min-width: 0; }
        .phd-records-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .phd-records-title  { font-size: 16px; font-weight: 700; color: #1a202c; }
        .phd-record-card {
            background: white; border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 14px;
            overflow: hidden; border: 1px solid #f0f4f8;
            transition: box-shadow .15s, transform .15s;
        }
        .phd-record-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.12); transform: translateY(-1px); }
        .phd-empty { text-align: center; padding: 60px 20px; color: #718096; }
        .phd-loading { text-align: center; padding: 40px 20px; color: #718096; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 768px) {
            .phd-layout { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
            .phd-sidebar { position: static; }
        }
    </style>
</head>
<body data-page="pms-details">

<!-- Sidebar (loaded dynamically) -->
<div id="customerSidebar"></div>

<div class="cu-page-shell">
<!-- Header (loaded dynamically) -->
<div id="customerHeader"></div>

<!-- Main content -->
<main class="cu-main">
    <div class="phd-layout" id="phdMain">
        <div class="phd-loading" style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:200px;">Loading...</div>
    </div>
</main>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyCaoJWbwJk0Xi694ARHpdHhiNjT0SpASRs",
    authDomain: "caltex-autopro-1e664.firebaseapp.com",
    projectId: "caltex-autopro-1e664",
    storageBucket: "caltex-autopro-1e664.firebasestorage.app",
    messagingSenderId: "930140433367",
    appId: "1:930140433367:web:cf67bfa388fa517422b992"
  });

  const db = firebase.firestore();
  const params = new URLSearchParams(window.location.search);
  const plate = params.get('plate');
  const desc  = params.get('desc');
  const type  = params.get('type') || '';

  // Cache key per plate
  const _PHD_CACHE_KEY = 'phdCache_' + (plate || '').toLowerCase().replace(/\s+/g, '_');

  // ── Shared render helpers ─────────────────────────────────────────────────
  function _buildSidebarHtml(records, totalCost, lastSvcOdo, customerInfo) {
    return `
      <div class="phd-sidebar">
        <a href="/customer_pms_history" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#718096;text-decoration:none;margin-bottom:16px;transition:color .2s;" onmouseover="this.style.color='#E8001C'" onmouseout="this.style.color='#718096'">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back to PMS History
        </a>
        <div class="phd-vehicle-card">
          <div class="phd-vehicle-plate">${plate}</div>
          <div class="phd-vehicle-desc">${desc || '&mdash;'}</div>
          <div class="phd-stats">
            <div class="phd-stat-item">
              <div class="phd-stat-icon" style="background:rgba(0,48,135,0.08);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <div>
                <div class="phd-stat-value">${records.length}</div>
                <div class="phd-stat-label">Service Records</div>
              </div>
            </div>
            <div class="phd-stat-item">
              <div class="phd-stat-icon" style="background:rgba(232,0,28,0.08);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              </div>
              <div>
                <div class="phd-stat-value">&#x20B1;${totalCost.toLocaleString('en-PH', {minimumFractionDigits:2})}</div>
                <div class="phd-stat-label">Total Spent</div>
              </div>
            </div>
            ${lastSvcOdo ? `
            <div class="phd-stat-item">
              <div class="phd-stat-icon" style="background:rgba(13,148,136,0.08);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <div>
                <div class="phd-stat-value">${parseInt(lastSvcOdo).toLocaleString()} km</div>
                <div class="phd-stat-label">Last Service Odometer</div>
              </div>
            </div>` : ''}
          </div>
          ${customerInfo ? `
          <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,0.15);padding-top:14px;">
            <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;">Customer Info</div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
              <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <span style="font-size:11px;font-weight:700;color:#fff;">${(customerInfo.name||'?').split(' ').filter(Boolean).map(p=>p[0]).join('').toUpperCase().slice(0,2)}</span>
              </div>
              <div>
                <div style="font-size:13px;font-weight:700;color:#fff;line-height:1.3;">${customerInfo.name}</div>
                ${customerInfo.company ? `<div style="font-size:11px;color:rgba(255,255,255,0.6);">${customerInfo.company}</div>` : ''}
              </div>
            </div>
            ${customerInfo.email && customerInfo.email !== '—' ? `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <span style="font-size:11px;color:rgba(255,255,255,0.75);word-break:break-all;">${customerInfo.email}</span>
            </div>` : ''}
            ${customerInfo.phone ? `
            <div style="display:flex;align-items:center;gap:8px;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.1 9.81 19.79 19.79 0 0 1 1.08 1.18 2 2 0 0 1 3.06 0h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <span style="font-size:11px;color:rgba(255,255,255,0.75);">${customerInfo.phone}</span>
            </div>` : ''}
          </div>` : ''}
          <!-- ── Report Buttons ── -->
          <div style="margin-top:14px;">
            <button onclick="phdPrint()" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;width:100%;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.30);border-radius:10px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .18s;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print Report
            </button>
          </div>
        </div>
      </div>`;
  }

  function _buildRecordsHtml(records) {
    if (!records.length) {
      return '<div class="phd-empty"><div style="font-size:48px;margin-bottom:12px;">&#128269;</div><div>No completed services yet.</div></div>';
    }
    return records.map((r, idx) => {
      const costRaw    = r.cost || r.totalCost || '';
      const costDisplay = costRaw ? costRaw : '&mdash;';
      return `
        <div class="phd-record-card" style="cursor:pointer;" onclick="phdOpenModal(${idx})">
          <div style="padding:14px;display:flex;align-items:center;gap:12px;">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:13px;color:#1a202c;">${r.date || '&mdash;'}</div>
              <div style="font-size:11px;color:#718096;margin-top:2px;">${r.mechanic || '&mdash;'}</div>
              ${r.odometer ? `<div style="font-size:10px;color:#718096;margin-top:1px;">${r.odometer} km</div>` : ''}
            </div>
            <div style="text-align:right;flex-shrink:0;">
              <div style="font-weight:700;font-size:14px;color:#1a202c;">${costDisplay}</div>
              <span style="background:rgba(22,163,106,0.1);color:#16a34a;font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;">Completed</span>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>`;
    }).join('');
  }

  function _render(records, totalCost, lastSvcOdo, customerInfo) {
    window._phdRecords = records;
    const sidebarHtml = _buildSidebarHtml(records, totalCost, lastSvcOdo, customerInfo);
    const recordsHtml = _buildRecordsHtml(records);
    document.getElementById('phdMain').innerHTML = sidebarHtml + `<div class="phd-records">${recordsHtml}</div>`;
  }

  // ── Restore from cache immediately (no waiting for Firebase auth) ─────────
  (function _phdRestoreCache() {
    if (!plate) return;
    try {
      const raw = sessionStorage.getItem(_PHD_CACHE_KEY);
      if (!raw) return;
      const cached = JSON.parse(raw);
      if (!cached || !Array.isArray(cached.records)) return;
      _render(cached.records, cached.totalCost || 0, cached.lastSvcOdo || '', cached.customerInfo || null);
    } catch(e) {}
  })();

  function vehicleIconSvg(vehicleType, size) {
    const t = (vehicleType || '').toLowerCase();
    const s = size || 24;
    if (t.includes('truck')) {
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`;
    }
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-4h10l2 4h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>`;
  }

  async function init() {
    if (!plate) {
      document.getElementById('phdMain').innerHTML = '<div class="phd-empty"><div style="font-size:48px;margin-bottom:12px;">&#128269;</div><div>No vehicle selected.</div></div>';
      return;
    }

    try {
      // Load completed maintenance records for this plate
      const snap = await db.collection('maintenance')
        .where('plate', '==', plate)
        .where('status', '==', 'Completed')
        .get();

      const records = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      // Compute total cost
      const totalCost = records.reduce((sum, r) => {
        const raw = r.cost || r.totalCost || '0';
        const num = typeof raw === 'number' ? raw
          : parseFloat(String(raw).replace(/[^0-9.]/g, '')) || 0;
        return sum + num;
      }, 0);

      // Get last service odometer from vehicle document
      let lastSvcOdo = '';
      let customerInfo = null;
      const vSnap = await db.collection('vehicles').where('plate', '==', plate).limit(1).get();
      if (!vSnap.empty) {
        const vData = vSnap.docs[0].data();
        const odo = vData.lastSvcOdo || vData.lastServiceOdometer || '';
        if (odo) lastSvcOdo = String(odo).replace(/[^0-9]/g, '');

        // Fetch customer info from users collection
        const ownerId = vData.ownerId || '';
        const ownerName = vData.owner || '';
        try {
          let uSnap = null;
          if (ownerId) {
            const uDoc = await db.collection('users').doc(ownerId).get();
            if (uDoc.exists) uSnap = uDoc.data();
          }
          if (!uSnap && ownerName) {
            const byName = await db.collection('users').where('name', '==', ownerName).limit(1).get();
            if (!byName.empty) uSnap = byName.docs[0].data();
          }
          if (uSnap) {
            customerInfo = {
              name:    uSnap.name        || ownerName || '—',
              email:   uSnap.email       || '—',
              phone:   uSnap.phone       || uSnap.contactNumber || uSnap.mobile || '',
              company: uSnap.companyName || '',
            };
          } else if (ownerName) {
            customerInfo = { name: ownerName, email: '—', phone: '', company: '' };
          }
        } catch(_) {}
      }

      // Persist fresh data back to cache (including odometer)
      try {
        sessionStorage.setItem(_PHD_CACHE_KEY, JSON.stringify({
          plate, desc: desc || '', type: type || '',
          records, totalCost, lastSvcOdo, customerInfo, savedAt: Date.now(),
        }));
      } catch(e) {}

      _render(records, totalCost, lastSvcOdo, customerInfo);

    } catch (err) {
      console.error('Error loading PMS history:', err);
      document.getElementById('phdMain').innerHTML =
        `<div class="phd-empty"><div style="font-size:48px;margin-bottom:12px;">&#9888;</div><div>Error loading data: ${err.message}</div></div>`;
    }
  }

  firebase.auth().onAuthStateChanged((user) => {
    if (user) init();
    else window.location.href = '/login';
  });
</script>
<script src="../static/js/customer_shared.js"></script>
<script>
  (function() {
    var sess = JSON.parse(sessionStorage.getItem('cpUser') || '{}');
    var name = sess.name || '';
    var parts = name.trim().split(' ').filter(Boolean);
    var ini = parts.length >= 2 ? (parts[0][0]+parts[1][0]).toUpperCase() : (parts[0]?parts[0][0].toUpperCase():'CU');
    fetch('/customer_sidebar').then(r => r.text()).then(html => {
      document.getElementById('customerSidebar').innerHTML = html;
      if (typeof setGreeting === 'function') setGreeting();
      if (typeof setActiveTab === 'function') setActiveTab();
      if (name) {
        var av = document.getElementById('cuAvatar'); if(av) av.textContent = ini;
        var hn = document.getElementById('cuHeaderName'); if(hn) hn.textContent = name;
        var ge = document.getElementById('cuGreetLine'); if(ge && !ge.textContent) ge.textContent = sess.email || '';
        var mn = document.getElementById('cuAvatarName'); if(mn) mn.textContent = name;
      }
    });
    fetch('/customer_header').then(r => r.text()).then(html => {
      document.getElementById('customerHeader').innerHTML = html;
    });
  })();
</script>

<!-- View Modal -->
<div id="phdModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this)phdCloseModal()">
  <div style="background:white;border-radius:20px;width:100%;max-width:560px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
    <div style="background:#E8001C;padding:20px;display:flex;align-items:center;gap:14px;flex-shrink:0;">
      <div style="flex:1;min-width:0;">
        <div id="phdModalDate" style="font-size:16px;font-weight:800;color:white;">&#8212;</div>
        <div id="phdModalMechanic" style="font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px;">&#8212;</div>
      </div>
      <button onclick="phdCloseModal()" style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">&times;</button>
    </div>
    <div id="phdModalBody" style="padding:20px;overflow-y:auto;"></div>
  </div>
</div>

<script>
  window._phdRecords = [];

  function phdOpenModal(idx) {
    const r = window._phdRecords[idx];
    if (!r) return;

    document.getElementById('phdModalDate').textContent     = r.date     || '&#8212;';
    document.getElementById('phdModalMechanic').textContent = r.mechanic || '&#8212;';

    const svcRows = (r.svcRows || []).filter(s => s.name);
    const matRows = (r.matRows || []).filter(m => m.name);
    const issues  = (r.issues  || []).filter(i => i && String(i).trim());

    function parseCost(val) {
      if (typeof val === 'number') return val;
      return parseFloat(String(val || '0').replace(/[^0-9.]/g, '')) || 0;
    }
    function rowSub(row) {
      return parseCost(row.cost) * (parseFloat(row.qty) || 1);
    }
    function detailRow(label, value) {
      return `<div style="display:flex;padding:6px 0;"><span style="width:130px;font-size:12px;color:#718096;font-weight:500;">${label}</span><span style="font-size:13px;font-weight:600;color:#1a202c;">${value || '&#8212;'}</span></div>`;
    }
    function itemCard(item, color) {
      const sub = rowSub(item);
      const unitCost = parseCost(item.cost).toFixed(2);
      return `<div style="margin-bottom:8px;padding:10px;background:${color}18;border-radius:10px;border:1px solid ${color}30;display:flex;align-items:center;">
        <div style="flex:1;"><div style="font-weight:600;font-size:12px;">${item.name}${item.uom ? ' <span style="font-weight:400;color:#718096;">('+item.uom+')</span>' : ''}</div>
        <div style="font-size:10px;color:#718096;">${item.qty} &middot; &#x20B1;${unitCost} / unit</div></div>
        <span style="font-weight:700;font-size:12px;color:${color};">&#x20B1;${sub.toLocaleString('en-PH',{minimumFractionDigits:2})}</span>
      </div>`;
    }

    let html = '';
    html += detailRow('Service Date', r.date);
    html += detailRow('Mechanic', r.mechanic);
    html += detailRow('Odometer', r.odometer ? r.odometer + ' km' : '');
    html += detailRow('Total Cost', r.cost || r.totalCost);
    html += `<div style="display:flex;padding:6px 0;"><span style="width:130px;font-size:12px;color:#718096;font-weight:500;">Status</span><span style="background:rgba(22,163,106,0.1);color:#16a34a;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;">Completed</span></div>`;

    if (issues.length) {
      html += `<div style="margin-top:16px;font-size:12px;font-weight:700;color:#4a5568;">Vehicle Issues Reported</div>`;
      html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">`;
      html += issues.map(i => `<span style="background:#fff5f5;border:1.5px solid #fed7d7;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:#E8001C;">${i}</span>`).join('');
      html += `</div>`;
    }
    if (svcRows.length) {
      html += `<div style="margin-top:16px;font-size:12px;font-weight:700;color:#2b6cb0;">Services Rendered</div>`;
      html += `<div style="margin-top:8px;">${svcRows.map(s => itemCard(s, '#2b6cb0')).join('')}</div>`;
    }
    if (matRows.length) {
      html += `<div style="margin-top:16px;font-size:12px;font-weight:700;color:#0d9488;">Materials Used</div>`;
      html += `<div style="margin-top:8px;">${matRows.map(m => itemCard(m, '#0d9488')).join('')}</div>`;
    }

    html += `<hr style="border:none;border-top:1px solid #e2e8f0;margin:16px 0;">`;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:600;font-size:13px;color:#4a5568;">Total</span>
      <span style="font-weight:700;font-size:16px;color:#1a202c;">${r.cost || r.totalCost || '&#8212;'}</span>
    </div>`;

    document.getElementById('phdModalBody').innerHTML = html;
    document.getElementById('phdModal').style.display = 'flex';
  }

  function phdCloseModal() {
    document.getElementById('phdModal').style.display = 'none';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') phdCloseModal();
  });
</script>
</div><!-- /.cu-page-shell -->

<!-- Hidden print area — populated by phdPrint() -->
<div id="phdPrintArea" style="display:none;"></div>

<script>
// ── Shared helpers ──────────────────────────────────────────────────────────
function _phdParseCost(val) {
  if (typeof val === 'number') return val;
  return parseFloat(String(val || '0').replace(/[^0-9.]/g, '')) || 0;
}
function _phdFmtPeso(n) {
  return '₱' + Number(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function _phdGetCustomerInfo() {
  // Try to get from cached data in sessionStorage
  try {
    const raw = sessionStorage.getItem('phdCache_' + (plate||'').toLowerCase().replace(/\s+/g,'_'));
    if (raw) {
      const c = JSON.parse(raw);
      return c.customerInfo || null;
    }
  } catch(_) {}
  return null;
}
function _phdNow() {
  const d = new Date();
  return d.toLocaleDateString('en-PH', {year:'numeric',month:'long',day:'numeric'})
       + ' ' + d.toLocaleTimeString('en-PH', {hour:'2-digit',minute:'2-digit'});
}

// ── PRINT ───────────────────────────────────────────────────────────────────
function phdPrint() {
  const records = window._phdRecords || [];
  const ci = _phdGetCustomerInfo();
  const totalCost = records.reduce((s, r) => s + _phdParseCost(r.cost || r.totalCost), 0);

  // Build print-friendly HTML
  let html = `
    <div style="font-family:Arial,sans-serif;font-size:12px;color:#1a202c;max-width:900px;margin:0 auto;">

      <!-- Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #E8001C;padding-bottom:14px;margin-bottom:20px;">
        <div>
          <div style="font-size:20px;font-weight:900;color:#1a202c;">PMS Service History</div>
          <div style="font-size:13px;color:#718096;margin-top:2px;">Vehicle Maintenance Report</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:#718096;">Generated</div>
          <div style="font-size:12px;font-weight:600;">${_phdNow()}</div>
        </div>
      </div>

      <!-- Vehicle + Customer info row -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
        <div style="background:#f8fafc;border-radius:10px;padding:14px;border:1px solid #e2e8f0;">
          <div style="font-size:10px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Vehicle</div>
          <div style="font-size:16px;font-weight:800;color:#1a202c;">${plate || '—'}</div>
          <div style="font-size:12px;color:#718096;margin-top:2px;">${desc || '—'}</div>
        </div>
        <div style="background:#f8fafc;border-radius:10px;padding:14px;border:1px solid #e2e8f0;">
          <div style="font-size:10px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Customer</div>
          <div style="font-size:14px;font-weight:700;color:#1a202c;">${ci ? ci.name : '—'}</div>
          ${ci && ci.company ? `<div style="font-size:11px;color:#718096;">${ci.company}</div>` : ''}
          ${ci && ci.email && ci.email !== '—' ? `<div style="font-size:11px;color:#718096;margin-top:2px;">${ci.email}</div>` : ''}
          ${ci && ci.phone ? `<div style="font-size:11px;color:#718096;">${ci.phone}</div>` : ''}
        </div>
      </div>

      <!-- Summary stats -->
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;">
        <div style="background:#EFF6FF;border-radius:10px;padding:12px 14px;border:1px solid #DBEAFE;">
          <div style="font-size:10px;font-weight:700;color:#2563EB;text-transform:uppercase;letter-spacing:0.5px;">Total Records</div>
          <div style="font-size:22px;font-weight:800;color:#1E40AF;margin-top:2px;">${records.length}</div>
        </div>
        <div style="background:#FFF5F5;border-radius:10px;padding:12px 14px;border:1px solid #FED7D7;">
          <div style="font-size:10px;font-weight:700;color:#E8001C;text-transform:uppercase;letter-spacing:0.5px;">Total Spent</div>
          <div style="font-size:22px;font-weight:800;color:#C53030;margin-top:2px;">${_phdFmtPeso(totalCost)}</div>
        </div>
      </div>

      <!-- Records table -->
      <div style="font-size:12px;font-weight:700;color:#1a202c;margin-bottom:8px;">Service Records (${records.length})</div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead>
          <tr style="background:linear-gradient(135deg,#004B5F,#E8001C);color:#fff;">
            <th style="padding:9px 12px;text-align:left;font-weight:700;">#</th>
            <th style="padding:9px 12px;text-align:left;font-weight:700;">Date</th>
            <th style="padding:9px 12px;text-align:left;font-weight:700;">Mechanic</th>
            <th style="padding:9px 12px;text-align:left;font-weight:700;">Services</th>
            <th style="padding:9px 12px;text-align:left;font-weight:700;">Materials</th>
            <th style="padding:9px 12px;text-align:left;font-weight:700;">Odometer</th>
            <th style="padding:9px 12px;text-align:right;font-weight:700;">Total Cost</th>
          </tr>
        </thead>
        <tbody>
          ${records.map((r, i) => {
            const svcNames = (r.svcRows||[]).filter(s=>s.name).map(s=>s.name).join(', ') || '—';
            const matNames = (r.matRows||[]).filter(m=>m.name).map(m=>m.name).join(', ') || '—';
            const cost = _phdFmtPeso(_phdParseCost(r.cost || r.totalCost));
            const bg = i % 2 === 0 ? '#fff' : '#f8fafc';
            return `<tr style="background:${bg};border-bottom:1px solid #e2e8f0;">
              <td style="padding:9px 12px;color:#718096;">${i+1}</td>
              <td style="padding:9px 12px;font-weight:600;">${r.date || '—'}</td>
              <td style="padding:9px 12px;">${r.mechanic || '—'}</td>
              <td style="padding:9px 12px;max-width:160px;">${svcNames}</td>
              <td style="padding:9px 12px;max-width:160px;">${matNames}</td>
              <td style="padding:9px 12px;">${r.odometer ? r.odometer + ' km' : '—'}</td>
              <td style="padding:9px 12px;text-align:right;font-weight:700;color:#E8001C;">${cost}</td>
            </tr>`;
          }).join('')}
        </tbody>
        <tfoot>
          <tr style="background:#f0f4f8;border-top:2px solid #e2e8f0;">
            <td colspan="6" style="padding:10px 12px;font-weight:700;font-size:12px;">Total</td>
            <td style="padding:10px 12px;text-align:right;font-weight:800;font-size:13px;color:#E8001C;">${_phdFmtPeso(totalCost)}</td>
          </tr>
        </tfoot>
      </table>

      <div style="margin-top:24px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:10px;color:#a0aec0;display:flex;justify-content:space-between;">
        <span>JA Noble Enterprise Inc. · Caltex San Pedro</span>
        <span>Plate: ${plate} · Printed: ${_phdNow()}</span>
      </div>
    </div>`;

  const area = document.getElementById('phdPrintArea');
  area.innerHTML = html;
  area.style.display = 'block';
  window.print();
  area.style.display = 'none';
}

</script>
</body>
</html>
