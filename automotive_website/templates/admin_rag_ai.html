<!-- ── Admin AI Assistant Floating Widget ── -->
<!-- Include this file in admin pages that need the AI chatbot -->
<!-- Requires: window.assets, window.inventory, window.serviceTransactions from admin_firebase.js -->

<!-- History overlay + drawer (mirrors customer widget) -->
<div id="ragHistoryOverlay" onclick="ragCloseHistory()"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:1202;opacity:0;pointer-events:none;transition:opacity .25s;"></div>
<div id="ragHistoryDrawer"
  style="position:fixed;top:0;right:-340px;width:320px;height:100%;z-index:1203;
         background:white;box-shadow:-4px 0 24px rgba(0,0,0,0.13);
         transition:right .28s cubic-bezier(.4,0,.2,1);
         display:flex;flex-direction:column;overflow:hidden;">
  <!-- Drawer header -->
  <div style="background:linear-gradient(135deg,#c62828,#E8001C);padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    <div style="flex:1;color:#fff;font-size:14px;font-weight:700;">Chat History</div>
    <button onclick="ragCloseHistory()"
      style="width:28px;height:28px;background:rgba(255,255,255,0.18);border:none;color:white;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s;"
      onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.18)'">×</button>
  </div>
  <!-- Delete all button -->
  <button onclick="ragDeleteAllHistory()"
    style="margin:12px 14px 0;padding:9px 14px;background:#fff5f5;border:1.5px solid #fca5a5;
           border-radius:10px;color:#dc2626;font-size:12px;font-weight:600;cursor:pointer;
           font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .18s;width:calc(100% - 28px);"
    onmouseover="this.style.background='#fee2e2';this.style.borderColor='#E8001C'"
    onmouseout="this.style.background='#fff5f5';this.style.borderColor='#fca5a5'">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    Delete All Chats
  </button>
  <!-- Session list -->
  <div id="ragHistoryList" style="flex:1;overflow-y:auto;padding:12px 14px;">
    <div style="text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px;">No chat history yet.</div>
  </div>
</div>

<!-- Floating toggle button -->
<div id="ragAiFabWrap" style="position:fixed;bottom:2rem;right:2rem;z-index:1200;display:inline-flex;">
  <div style="position:relative;display:inline-flex;align-items:center;justify-content:center;">
    <!-- FAB pulse rings -->
    <span id="ragFabPulseOuter" style="position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid #22c55e;opacity:0;animation:ragRingPulse 1.8s ease-out infinite;pointer-events:none;"></span>
    <span id="ragFabPulseInner" style="position:absolute;width:58px;height:58px;border-radius:50%;border:1.5px solid #22c55e;opacity:0;animation:ragRingPulse 1.8s ease-out 0.45s infinite;pointer-events:none;"></span>
    <button id="ragAiToggleBtn" onclick="ragAiToggle()"
      title="AI Assistant"
      style="width:58px;height:58px;border-radius:50%;border:2.5px solid #22c55e;cursor:pointer;
             background:white;
             box-shadow:0 0 10px rgba(34,197,94,0.45),0 4px 20px rgba(0,0,0,0.15);
             display:flex;align-items:center;justify-content:center;
             transition:all 0.25s ease;padding:3px;overflow:hidden;position:relative;">
      <img id="ragFabAiImg" src="../static/img/AI_LOGO.png"
           style="width:50px;height:50px;object-fit:cover;border-radius:50%;display:block;" alt="AI">
    </button>
    <!-- Status indicator dot on FAB -->
    <span id="ragFabOnlineDot"
      style="position:absolute;bottom:3px;right:3px;width:13px;height:13px;
             border-radius:50%;background:#22c55e;border:2.5px solid white;
             z-index:2;
             transition:background 0.3s,box-shadow 0.3s;"></span>
  </div>
</div>

<!-- Floating AI chat panel -->
<div id="ragAiPanel"
  style="display:none;position:fixed;bottom:6.2rem;right:2rem;z-index:1201;
         width:390px;height:580px;max-height:calc(100vh - 8rem);
         background:#fff;border-radius:22px;
         box-shadow:0 20px 60px rgba(0,0,0,0.18),0 4px 16px rgba(232,0,28,0.08);
         border:1px solid rgba(226,232,240,0.8);overflow:hidden;
         display:none;flex-direction:column;
         animation:ragAiSlideIn 0.28s cubic-bezier(.34,1.56,.64,1);">

  <!-- Panel header -->
  <div id="ragAiHeader" style="background:linear-gradient(135deg,#c62828 0%,#E8001C 60%,#ff5252 100%);padding:12px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;position:relative;overflow:visible;">
    <!-- Subtle shine overlay -->
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(255,255,255,0.1) 0%,transparent 65%);pointer-events:none;border-radius:22px 22px 0 0;"></div>
    <!-- Avatar — white bg with gradient border -->
    <div style="position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
      <!-- Animated pulse rings -->
      <span id="ragHdrPulseOuter" style="position:absolute;width:36px;height:36px;border-radius:50%;border:2px solid #22c55e;opacity:0;animation:ragRingPulse 1.8s ease-out infinite;pointer-events:none;"></span>
      <span id="ragHdrPulseInner" style="position:absolute;width:36px;height:36px;border-radius:50%;border:1.5px solid #22c55e;opacity:0;animation:ragRingPulse 1.8s ease-out 0.45s infinite;pointer-events:none;"></span>
      <div id="ragHdrAvatarRing" style="width:36px;height:36px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px rgba(34,197,94,0.45),0 2px 8px rgba(0,0,0,0.15);background:white;border:2.5px solid #22c55e;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;z-index:1;transition:border-color 0.3s,box-shadow 0.3s;">
        <img src="../static/img/AI_LOGO.png" style="width:28px;height:28px;object-fit:contain;display:block;" alt="AI">
      </div>
      <!-- Online dot on avatar -->
      <span id="ragHeaderOnlineDot" style="position:absolute;bottom:1px;right:1px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid white;box-shadow:0 0 5px rgba(34,197,94,0.8);z-index:2;transition:background 0.3s,box-shadow 0.3s;"></span>
    </div>
    <!-- Title -->
    <div style="flex:1;min-width:0;">
      <div style="color:#fff;font-size:13px;font-weight:700;">AI Assistant</div>
      <div style="display:flex;align-items:center;gap:4px;margin-top:1px;">
        <span id="ragAiDot" style="width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0;box-shadow:0 0 6px rgba(74,222,128,0.8);"></span>
        <span id="ragAiStatus" style="font-size:10px;color:rgba(255,255,255,0.8);">Online · AI Assistant</span>
      </div>
    </div>
    <!-- Button group: New Chat + History + Clear + Close -->
    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
      <!-- New Chat button -->
      <button onclick="ragNewChat()" id="ragNewChatBtn" title="New chat"
        style="width:30px;height:30px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
               color:white;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
               flex-shrink:0;transition:background .18s;"
        onmouseover="this.style.background='rgba(255,255,255,0.28)'"
        onmouseout="this.style.background='rgba(255,255,255,0.15)'">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <!-- History button -->
      <button onclick="ragOpenHistory()" id="ragHistoryBtn" title="Chat history"
        style="width:30px;height:30px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
               color:white;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
               flex-shrink:0;transition:background .18s;"
        onmouseover="this.style.background='rgba(255,255,255,0.28)'"
        onmouseout="this.style.background='rgba(255,255,255,0.15)'">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <!-- Close button -->
      <button onclick="ragAiToggle()" title="Close"
        style="width:30px;height:30px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
               color:white;border-radius:8px;cursor:pointer;font-size:17px;line-height:1;
               display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s;"
        onmouseover="this.style.background='rgba(255,255,255,0.28)'"
        onmouseout="this.style.background='rgba(255,255,255,0.15)'">×</button>
    </div>
  </div>

  <!-- Messages area -->
  <div id="ragAiChat" style="flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#f8f9fb 0%,#f2f4f7 100%);scroll-behavior:smooth;"></div>

  <!-- Quick chips — hidden -->
  <div id="ragAiChips" style="display:none;"></div>

  <!-- Input bar -->
  <div style="padding:10px 12px 12px;background:white;border-top:1px solid #edf0f5;flex-shrink:0;">
    <div style="display:flex;gap:8px;align-items:center;background:#f4f6f9;border:1.5px solid #edf0f5;border-radius:20px;padding:8px 8px 8px 14px;transition:border-color .2s,box-shadow .2s;" id="ragInputWrap">
      <textarea id="ragAiInput" placeholder="Ask about fleet, inventory, reports…"
        rows="1" style="flex:1;border:none;background:transparent;font-size:12.5px;font-family:inherit;color:#1a202c;outline:none;resize:none;max-height:80px;overflow-y:auto;line-height:1.5;padding:2px 0;margin:0;display:block;align-self:center;"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ragAiSend();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"
        onfocus="document.getElementById('ragInputWrap').style.borderColor='#E8001C';document.getElementById('ragInputWrap').style.boxShadow='0 0 0 3px rgba(232,0,28,0.08)';"
        onblur="document.getElementById('ragInputWrap').style.borderColor='#edf0f5';document.getElementById('ragInputWrap').style.boxShadow='none';"></textarea>
      <button onclick="ragAiSend()" id="ragSendBtn"
        style="width:34px;height:34px;min-width:34px;background:linear-gradient(135deg,#E8001C,#c0001a);border:none;border-radius:50%;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(232,0,28,0.35);transition:all .18s;"
        onmouseover="this.style.transform='scale(1.08)';this.style.boxShadow='0 5px 14px rgba(232,0,28,0.45)'"
        onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 3px 10px rgba(232,0,28,0.35)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(45deg)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div style="text-align:center;font-size:10px;color:#c0c8d4;margin-top:5px;">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
  </div>
</div>

<style>
@keyframes ragAiSlideIn { from{opacity:0;transform:translateY(16px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes ragRingPulse { 0%{transform:scale(1);opacity:0.55} 100%{transform:scale(1.65);opacity:0} }
@keyframes ragBounce    { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
@keyframes ragSpin      { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.rag-chip { padding:4px 10px;background:#f7f8fa;border:1.5px solid #e2e8f0;border-radius:16px;font-size:11px;font-weight:500;color:#4a5568;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit; }
.rag-chip:hover { background:#E8001C;color:white;border-color:#E8001C; }

/* ── Message rows ── */
#ragAiChat .rag-row { display:flex;gap:9px;align-items:flex-end; }
#ragAiChat .rag-row.user { flex-direction:row-reverse; }

/* ── Avatars ── */
#ragAiChat .rag-av { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden; }
#ragAiChat .rag-av.ai  { background:white;box-shadow:0 0 5px rgba(34,197,94,0.3),0 2px 8px rgba(0,0,0,0.08);border:1.5px solid #22c55e; }
#ragAiChat .rag-av.usr { background:linear-gradient(135deg,#475569,#334155);color:white;font-size:10px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.15); }

/* ── Bubbles ── */
#ragAiChat .rag-bub { max-width:80%;padding:10px 14px;border-radius:16px;font-size:12.5px;line-height:1.65;word-break:break-word; }
#ragAiChat .rag-bub.ai {
  background:white;color:#1a202c;
  border-radius:4px 16px 16px 16px;
  box-shadow:0 2px 12px rgba(0,0,0,0.07);
  border:1px solid rgba(226,232,240,0.6);
}
/* user class — matches what _ragAppend sets */
#ragAiChat .rag-bub.user,
#ragAiChat .rag-bub.usr {
  background:linear-gradient(135deg,#E8001C 0%,#c0001a 100%);
  color:white;
  border-radius:16px 4px 16px 16px;
  box-shadow:0 3px 12px rgba(232,0,28,0.25);
}

/* ── Tables inside AI bubble ── */
#ragAiChat .rag-bub table { width:100%;border-collapse:collapse;margin-top:8px;font-size:11px; }
#ragAiChat .rag-bub table th { background:#f7f8fa;padding:5px 8px;text-align:left;font-weight:700;color:#4a5568;border-bottom:1.5px solid #e2e8f0;font-size:10.5px; }
#ragAiChat .rag-bub table td { padding:5px 8px;border-bottom:1px solid #f0f4f8;color:#1a202c; }
#ragAiChat .rag-bub .sr-tag { display:inline-block;padding:1px 6px;border-radius:12px;font-size:10px;font-weight:700;margin:1px; }

/* ── Typing indicator ── */
.rag-typing { display:flex;gap:5px;align-items:center;padding:10px 14px; }
.rag-typing span { width:7px;height:7px;background:#cbd5e0;border-radius:50%;animation:ragBounce .9s ease-in-out infinite; }
.rag-typing span:nth-child(2) { animation-delay:.15s; }
.rag-typing span:nth-child(3) { animation-delay:.3s; }

/* ── Welcome suggestion pills ── */
.rag-suggest-pill {
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:white;
  border:1.5px solid #e8edf2;
  border-radius:12px;
  padding:11px 14px;
  font-size:12px;font-weight:500;color:#4a5568;
  cursor:pointer;font-family:inherit;
  transition:all .18s ease;
  box-shadow:0 1px 4px rgba(0,0,0,0.05);
  pointer-events:auto;
}
.rag-suggest-pill::before {
  content:'';width:7px;height:7px;border-radius:50%;
  background:#E8001C;
  flex-shrink:0;
}
.rag-suggest-pill:hover {
  border-color:#E8001C;color:#E8001C;
  background:#fff5f5;
  box-shadow:0 3px 12px rgba(232,0,28,0.12);
  transform:translateY(-1px);
}

/* ── Scrollbar ── */
#ragAiChat::-webkit-scrollbar { width:4px; }
#ragAiChat::-webkit-scrollbar-track { background:transparent; }
#ragAiChat::-webkit-scrollbar-thumb { background:#d1d5db;border-radius:4px; }
#ragAiChat::-webkit-scrollbar-thumb:hover { background:#9ca3af; }

/* ── History drawer ── */
#ragHistoryDrawer::-webkit-scrollbar { width:3px; }
#ragHistoryList::-webkit-scrollbar { width:3px; }
#ragHistoryList::-webkit-scrollbar-thumb { background:#e2e8f0;border-radius:3px; }
.rag-hist-day  { font-size:10.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;margin:10px 0 6px; }
.rag-hist-item {
  background:#f8f9fb;border:1.5px solid #e8edf2;border-radius:11px;
  padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:all .15s;
}
.rag-hist-item:hover,.rag-hist-item.active { background:#fff0f0;border-color:#E8001C; }
.rag-hist-preview { font-size:12px;color:#1a202c;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px; }
.rag-hist-time   { font-size:10.5px;color:#94a3b8;margin-top:3px; }

</style>

<script>
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
//  Admin AI Assistant — Floating Widget
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
(function() {
var _ragInitials = 'AD';
var _ragReady = false;
var _ragSessionId = null;  // stable conversation id — sent back on each request
var _ragRateLimited = false;
var _ragCurrentUid  = null; // Firebase UID — set after auth resolves
var _ragMessages    = [];   // structured JS array — mirrors DOM, survives close/reopen
var _ragSavedSig    = null; // dedupe guard: signature of the last saved _ragMessages

// ── localStorage history helpers ──────────────────────────────────────────
function _ragActiveKey(uid)  { return 'rag_ai_active_'  + uid; }
function _ragStorageKey(uid) { return 'rag_ai_chat_'    + uid; }

// Stable local conversation id — generated ONCE per conversation (New Chat),
// then reused across refresh/navigation so the same conversation is always
// written to the same history slot instead of creating duplicates.
function _ragLocalId() {
  return 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
}
function _ragIsLocal(id) { return !id || id.indexOf('local_') === 0; }

function _ragLoadAllSessions(uid) {
  try { var r = localStorage.getItem(_ragStorageKey(uid)); return r ? JSON.parse(r) : []; }
  catch(e) { return []; }
}

// Rename a conversation in place (history list + active slot) when the server
// assigns its real session id. Prevents the same conversation from appearing
// as two history entries (old local id + new server id).
function _ragMigrateSessionId(oldId, newId) {
  if (!_ragCurrentUid || !oldId || !newId || oldId === newId) return;
  try {
    var sessions = _ragLoadAllSessions(_ragCurrentUid);
    var changed = false;
    for (var i = 0; i < sessions.length; i++) {
      if (sessions[i].id === oldId) { sessions[i].id = newId; changed = true; }
    }
    if (changed) {
      // Drop entries duplicated by the rename — keep the renamed (live) one.
      var seen = {};
      sessions = sessions.filter(function(s) {
        if (seen[s.id]) return false;
        seen[s.id] = true;
        return true;
      });
      localStorage.setItem(_ragStorageKey(_ragCurrentUid), JSON.stringify(sessions));
    }
    var activeRaw = localStorage.getItem(_ragActiveKey(_ragCurrentUid));
    if (activeRaw) {
      var active = JSON.parse(activeRaw);
      if (active && active.id === oldId) {
        active.id = newId;
        localStorage.setItem(_ragActiveKey(_ragCurrentUid), JSON.stringify(active));
      }
    }
  } catch(e) {}
}

// Save: writes structured _ragMessages array (not DOM scraping) to both
// the active slot and the history list. Idempotent: skips the write when
// nothing changed since the last save.
function _ragSaveChat() {
  if (!_ragCurrentUid || !_ragMessages.length) return;
  // Logout guard — after the session is cleared, pagehide/unload handlers
  // must not write the chat back into storage.
  try {
    if (!sessionStorage.getItem('apUser') && !sessionStorage.getItem('spUser')) return;
  } catch(e) {}
  try {
    // Dedupe guard — avoid re-writing identical state on every event
    var sig = _ragSessionId + '|' + _ragMessages.length + '|' +
              (_ragMessages[_ragMessages.length-1] ? _ragMessages[_ragMessages.length-1].text : '');
    if (sig === _ragSavedSig) return;
    _ragSavedSig = sig;
    var sid = _ragSessionId || ('local_' + _ragCurrentUid);
    var entry = { id: sid, ts: Date.now(), messages: _ragMessages.slice() };
    localStorage.setItem(_ragActiveKey(_ragCurrentUid), JSON.stringify(entry));
    var all = _ragLoadAllSessions(_ragCurrentUid);
    var idx = all.findIndex(function(s){ return s.id === sid; });
    if (idx >= 0) all[idx] = entry; else all.unshift(entry);
    if (all.length > 50) all = all.slice(0, 50);
    localStorage.setItem(_ragStorageKey(_ragCurrentUid), JSON.stringify(all));
  } catch(e) {}
}

// Restore the active session on page load.
function _ragRestoreSession(uid) {
  try {
    var raw = localStorage.getItem(_ragActiveKey(uid));
    if (!raw) { _ragSessionId = _ragLocalId(); return; }
    var session = JSON.parse(raw);
    if (!session || !session.messages || !session.messages.length) { _ragSessionId = _ragLocalId(); return; }
    _ragSessionId = session.id || _ragLocalId(); // reuse the SAME conversation id
    // Dedupe restored messages (consecutive same-role rows from older saves)
    var msgs = session.messages.filter(function(m){ return m && m.text; });
    var clean = [];
    for (var i = 0; i < msgs.length; i++) {
      var prev = clean[clean.length-1];
      if (prev && prev.role === msgs[i].role && prev.text === msgs[i].text) continue;
      clean.push(msgs[i]);
    }
    _ragMessages = clean;
    // Render into the chat DOM
    var chat = document.getElementById('ragAiChat');
    if (!chat) return;
    var wb = document.getElementById('ragWelcomeBlock');
    if (wb) wb.remove();
    chat.innerHTML = '';
    _ragMessages.forEach(function(m) {
      _ragAppend(
        m.role === 'user' ? 'user' : 'ai',
        m.role === 'user' ? _ragEsc(m.text) : _ragMarkdown(m.text)
      );
    });
    _ragSavedSig = null;
    setTimeout(function(){ chat.scrollTop = chat.scrollHeight; }, 60);
  } catch(e) { _ragSessionId = _ragLocalId(); }
}

function _ragEscHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').slice(0,80);
}

function _ragRenderHistoryList() {
  var list = document.getElementById('ragHistoryList');
  if (!list) return;
  var sessions = _ragCurrentUid ? _ragLoadAllSessions(_ragCurrentUid) : [];
  sessions = sessions.filter(function(s){ return s.messages && s.messages.length > 0; });
  if (!sessions.length) {
    list.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px;">No chat history yet.<br>Start a conversation!</div>';
    return;
  }
  var html = '';
  var today = new Date(); var todayStr = today.toDateString();
  var yest  = new Date(today); yest.setDate(today.getDate()-1); var yestStr = yest.toDateString();
  var lastLabel = '';
  sessions.forEach(function(s) {
    var d = new Date(s.ts);
    var label = d.toDateString() === todayStr ? 'Today'
      : d.toDateString() === yestStr ? 'Yesterday'
      : d.toLocaleDateString('en-PH', {month:'short',day:'numeric',year:'numeric'});
    if (label !== lastLabel) { html += '<div class="rag-hist-day">'+label+'</div>'; lastLabel = label; }
    var firstUser = s.messages.find(function(m){ return m.role === 'user'; });
    var preview = firstUser ? firstUser.text : '(empty)';
    var time = d.toLocaleTimeString('en-PH', {hour:'2-digit',minute:'2-digit'});
    var isActive = s.id === (_ragSessionId || ('local_' + _ragCurrentUid));
    html += '<div class="rag-hist-item'+(isActive?' active':'')+'" data-sid="'+_ragEscHtml(s.id)+'">'
          + '<div class="rag-hist-preview">'+_ragEscHtml(preview)+'</div>'
          + '<div class="rag-hist-time">'+time+' &nbsp;·&nbsp; '+s.messages.length+' message'+(s.messages.length!==1?'s':'')+'</div>'
          + '</div>';
  });
  list.innerHTML = html;
  list.querySelectorAll('.rag-hist-item[data-sid]').forEach(function(el) {
    el.addEventListener('click', function() { _ragLoadSession(el.getAttribute('data-sid')); });
  });
}

function _ragLoadSession(sid) {
  var sessions = _ragCurrentUid ? _ragLoadAllSessions(_ragCurrentUid) : [];
  var session  = sessions.find(function(s){ return s.id === sid; });
  if (!session || !session.messages || !session.messages.length) return;
  _ragSessionId = session.id; // selected conversation becomes the active one
  _ragMessages  = session.messages.slice(); // sync structured array
  var chat = document.getElementById('ragAiChat');
  var wb   = document.getElementById('ragWelcomeBlock');
  if (wb) wb.remove();
  chat.innerHTML = '';
  _ragMessages.forEach(function(m) {
    _ragAppend(m.role === 'user' ? 'user' : 'ai',
               m.role === 'user' ? _ragEsc(m.text) : _ragMarkdown(m.text));
  });
  setTimeout(function(){ chat.scrollTop = chat.scrollHeight; }, 60);

function _ragEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Lightweight markdown renderer for AI responses
function _ragMarkdown(text) {
  if (!text) return '';
  var s = text;

  // Escape HTML first (we'll selectively re-insert tags)
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Bold **text** or __text__
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');

  // Italic *text* or _text_
  s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_\n]+?)_/g, '<em>$1</em>');

  // Code `inline`
  s = s.replace(/`([^`\n]+?)`/g, '<code style="background:#f1f5f9;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:0.92em;">$1</code>');

  // Headers ### ## #
  s = s.replace(/^### (.+)$/gm, '<div style="font-weight:700;font-size:13px;margin:8px 0 3px;color:#1a202c;">$1</div>');
  s = s.replace(/^## (.+)$/gm,  '<div style="font-weight:700;font-size:13.5px;margin:8px 0 3px;color:#1a202c;">$1</div>');
  s = s.replace(/^# (.+)$/gm,   '<div style="font-weight:800;font-size:14px;margin:8px 0 4px;color:#1a202c;">$1</div>');

  // Bullet lists: lines starting with - or * or •
  s = s.replace(/^[\-\*•] (.+)$/gm, '<div style="display:flex;gap:7px;margin:2px 0;"><span style="color:#E8001C;flex-shrink:0;margin-top:1px;">•</span><span>$1</span></div>');

  // Numbered lists: lines starting with 1. 2. etc.
  s = s.replace(/^(\d+)\. (.+)$/gm, '<div style="display:flex;gap:7px;margin:2px 0;"><span style="color:#E8001C;font-weight:700;flex-shrink:0;min-width:16px;">$1.</span><span>$2</span></div>');

  // Horizontal rule ---
  s = s.replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid #e2e8f0;margin:8px 0;">');

  // Line breaks — double newline = paragraph gap, single = <br>
  s = s.replace(/\n\n/g, '<div style="height:6px;"></div>');
  s = s.replace(/\n/g, '<br>');

  return s;
}

window.ragAiSend = function(preset) {
  var input = document.getElementById('ragAiInput');
  var text = (preset||input.value).trim();
  if (!text) return;
  if (_ragRateLimited) { return; }  // blocked while rate-limited
  if (!_ragReady) { _ragAppend('ai','<strong>Still loading data…</strong> Please wait.'); return; }
  // Hide welcome block on first real message
  var wb = document.getElementById('ragWelcomeBlock');
  if (wb) wb.remove();
  document.getElementById('ragAiChips').style.display='none';
  _ragAppend('user', _ragEsc(text));
  _ragMessages.push({ role: 'user', text: text });
  input.value=''; input.style.height='auto';
  _ragTyping();
  _ragSavedSig = null; // user message changed state — allow the save
  // Persist user message immediately
  _ragSaveChat();

  // Call the Flask AI endpoint — session_id enables server-side memory
  fetch('/api/ai-chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message:    text,
      user_type:  'admin',
      session_id: _ragSessionId,
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    _ragRemoveTyping();
    // Adopt the server session id (only once, when we're still on a local id)
    // so the history entry is renamed in place — never duplicated.
    if (data.session_id && _ragIsLocal(_ragSessionId)) {
      _ragMigrateSessionId(_ragSessionId, data.session_id);
      _ragSessionId = data.session_id;
    }

    // ── Rate limit notice ─────────────────────────────────────────────────
    if (data.rate_limited) {
      _ragSetRateLimited(true, data.reset_in || 'some time');
      var resetMsg = data.reset_in || 'some time';
      var rlText = 'AI Unavailable — Daily token limit reached. Resets in ' + resetMsg + '.';
      _ragMessages.push({ role: 'ai', text: rlText });
      _ragAppend('ai',
        '<div style="background:#fff7ed;border:1.5px solid #fb923c;border-radius:10px;padding:10px 13px;color:#9a3412;">' +
        '<div style="font-size:13px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px;">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="#9a3412"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>' +
        'AI Unavailable</div>' +
        '<div style="font-size:11.5px;line-height:1.6;">' +
        'The AI service has reached its <strong>daily token limit</strong> (Groq free tier).<br>' +
        'Resets in <strong>' + resetMsg + '</strong>.<br>' +
        'You cannot send new messages until the quota resets automatically.</div>' +
        '</div>');
      _ragSaveChat();
      return;
    }

    if (data.offline || !data.success) {
      // ── Check if this is a report intent — show retry UI instead of offline fallback ──
      var _isRptOffline = /\b(generate|create|make|export|download|print)\b.*\b(report|pdf|excel)\b|\b(pdf|excel)\s+report\b|\breport\s+(pdf|excel)\b/i.test(text);
      if (_isRptOffline || data.cold_start) {
        var _offlineRptBtnId = 'ragRetryBtn_' + Date.now();
        var _offlineRptQuery = text;
        var _offlineMsg = data.cold_start

window.ragNewChat = function() {
  // Save current session to history before starting fresh
  _ragSaveChat();
  // Clear server-side session memory (only for real server sessions)
  if (_ragSessionId && !_ragIsLocal(_ragSessionId)) {
    fetch('/api/ai-session/' + _ragSessionId, { method: 'DELETE' }).catch(function(){});
  }
  // Genuinely NEW conversation id so history never merges with the old chat.
  // No empty entry is written until the user sends the first message.
  _ragSessionId = _ragLocalId();
  _ragSavedSig  = null;
  // Remove active slot so re-opening doesn't restore the old session
  if (_ragCurrentUid) localStorage.removeItem(_ragActiveKey(_ragCurrentUid));
  _ragSetRateLimited(false);
  _ragMessages = [];
  document.getElementById('ragAiChat').innerHTML = '';
  document.getElementById('ragAiChips').style.display = 'none';
  _ragShowWelcome();
};

window.ragAiClear = function() {

};

window.ragDownloadReport = function(reportId, format) {
  // ── Guard: block concurrent downloads ────────────────────────────────────
  if (window._ragDownloading) return;

  // Look up the stored report params for this button
  var params = (window._ragReportParams || {})[reportId];
  if (!params) {
    // Params missing — show inline error in the error slot if it exists
    var errSlot = document.getElementById(reportId + '_err');
    if (errSlot) errSlot.innerHTML = '<span style="color:#E8001C;">Session expired. Please ask for the report again.</span>';
    return;
  }

  var reportType = params.reportType;
  var month      = params.month      || null;
  var startDate  = params.startDate  || null;
  var endDate    = params.endDate    || null;
  var filters    = params.filters    || {};
  var errSlot    = document.getElementById(reportId + '_err');
  var btn        = document.getElementById(reportId + '_' + format);

  // ── Lock: disable all buttons for this report, show spinner on clicked one ─
  window._ragDownloading = true;
  ['pdf','excel'].forEach(function(f) {
    var b = document.getElementById(reportId + '_' + f);
    if (b) {
      b.disabled = true;
      b.style.opacity = '0.6';
      b.style.cursor  = 'not-allowed';
    }
  });
  if (btn) {
    btn.style.opacity = '1';
    btn.style.cursor  = 'wait';
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;">'
      + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:ragSpin 0.8s linear infinite;">'
      + '<path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>'
      + 'Generating…</span>';
  }
  if (errSlot) errSlot.innerHTML = '';

  // ── Build request body ────────────────────────────────────────────────────
  var body = { report_type: reportType, format: format };
  if (startDate || endDate) {
    if (startDate) body.start_date = startDate;
    if (endDate)   body.end_date   = endDate;
  } else if (month) {
    body.month = month;
  }
  if (filters && typeof filters === 'object' && Object.keys(filters).length > 0) {
    body.filters = filters;
  }

  // ── Attach Firebase ID token so _require_admin() on the Flask side passes ──
  var _doReportFetch = function(authHeader) {
    var hdrs = { 'Content-Type': 'application/json' };
    if (authHeader) hdrs['Authorization'] = authHeader;
    return fetch('/api/ai-report', {
      method: 'POST',
      headers: hdrs,
      body: JSON.stringify(body)
    });
  };

  var _reportFetchPromise;
  if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
    _reportFetchPromise = firebase.auth().currentUser.getIdToken(false)
      .then(function(token) { return _doReportFetch('Bearer ' + token); })
      .catch(function() { return _doReportFetch(null); });
  } else {
    _reportFetchPromise = _doReportFetch(null);
  }

  _reportFetchPromise
  .then(function(res) {
    if (!res.ok) {
      return res.json().then(function(e) {
        var errMsg = e.error || 'Report generation failed';
        var errObj = new Error(errMsg);
        errObj.status = res.status;
        throw errObj;
      }).catch(function(thrown) {
        // Re-throw if already an Error with our message attached
        if (thrown && thrown.status) throw thrown;
        var errObj = new Error('Report generation failed (status ' + res.status + ')');
        errObj.status = res.status;
        throw errObj;
      });
    }
    return res.blob();
  })
  .then(function(blob) {
    // ── Build filename ──────────────────────────────────────────────────────
    var ext = format === 'pdf' ? '.pdf' : '.xlsx';
    var safeSuffix = '';
    if (startDate || endDate) {
      safeSuffix = '_' + (startDate || '').replace(/\s+/g, '_')
                 + '_to_' + (endDate || '').replace(/\s+/g, '_');
    } else if (month) {
      safeSuffix = '_' + month.replace(/\s+/g, '_');
    }
    var filename = reportType + '_report' + safeSuffix + ext;

    // ── Trigger browser download ────────────────────────────────────────────
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // ── Update button to "Downloaded ✓" permanently ────────────────────────
    if (btn) {
      btn.innerHTML = '&#x2713; Downloaded';
      btn.style.background = '#38a169';
      btn.style.color      = 'white';
      btn.style.border     = 'none';
      btn.style.opacity    = '1';
      btn.style.cursor     = 'default';
    }
    // Re-enable the other format button (if "both" was shown)
    ['pdf','excel'].forEach(function(f) {
      if (f === format) return;
      var b = document.getElementById(reportId + '_' + f);
      if (b) {
        b.disabled = false;
        b.style.opacity = '1';
        b.style.cursor  = 'pointer';
      }
    });
  })
  .catch(function(err) {
    // ── Restore buttons ────────────────────────────────────────────────────
    ['pdf','excel'].forEach(function(f) {
      var b = document.getElementById(reportId + '_' + f);
      if (b) {
        b.disabled = false;
        b.style.opacity = '1';
        b.style.cursor  = 'pointer';
      }
    });
    if (btn) {
      var origLabel = format.toUpperCase();
      var filterLabel = '';
      if (startDate || endDate) filterLabel = ' (' + (startDate||'—') + ' to ' + (endDate||'—') + ')';
      else if (month) filterLabel = ' (' + month + ')';
      btn.innerHTML = '&#x2193; Download ' + origLabel + filterLabel;
    }
    // ── Show contextual error message ─────────────────────────────────────
    var msg = err.message || 'Report generation failed.';
    var isQuota = /quota|resource_exhausted|429/i.test(msg);
    var isNoRecords = /no record|no data|not found/i.test(msg);
    var errHtml;
    if (isQuota) {
      errHtml = '<div style="background:#fff7ed;border:1.5px solid #fb923c;border-radius:8px;padding:7px 10px;margin-top:6px;">'
        + '<div style="font-size:11.5px;font-weight:700;color:#9a3412;margin-bottom:2px;">Firestore Quota Limit Reached</div>'
        + '<div style="font-size:11px;color:#7c3a1e;line-height:1.5;">The database is temporarily unavailable (Firestore free-tier daily read limit). '
        + 'Please wait a few minutes before trying again.</div>'
        + '</div>';
    } else if (isNoRecords) {
      errHtml = '<span style="color:#718096;font-size:11px;">' + _ragEsc(msg) + '</span>';
    } else {
      errHtml = '<span style="color:#E8001C;font-size:11px;">' + _ragEsc(msg) + '</span>';
    }
    if (errSlot) errSlot.innerHTML = errHtml;
  })
  .finally(function() {
    window._ragDownloading = false;
  });
};

//  Query Engine (same logic as admin_smart_reports.html)

function _ragProcess(query) {
  var q = query.toLowerCase().trim();

  function isMaint(a){var s=(a.status||'').toLowerCase();return s==='maintenance'||s.includes('maintenance');}

  function statusTag(raw){
    var s=(raw||'').toLowerCase(),label=raw||'—';

    else if(s==='ongoing')label='Ongoing';
    else if(s==='completed')label='Completed';
    else if(s==='low')label='Low';
    else if(s==='ok')label='OK';
    var map={'Overdue':['#E8001C','rgba(232,0,28,0.1)'],'Maintenance':['#d69e2e','rgba(214,158,46,0.1)'],'Due Soon':['#d97706','rgba(217,119,6,0.1)'],'Active':['#38a169','rgba(56,161,105,0.1)'],'Pending':['#718096','rgba(113,128,150,0.1)'],'Ongoing':['#d69e2e','rgba(214,158,46,0.1)'],'Completed':['#003087','rgba(0,48,135,0.1)'],'Low':['#E8001C','rgba(232,0,28,0.1)'],'OK':['#38a169','rgba(56,161,105,0.1)']};

  if (isReportRequest) {
    var _retryQuery = query;
    var _retryBtnId = 'ragRetryBtn_' + Date.now();

      var btn = document.getElementById(_retryBtnId);

    }, 0);
    return ret(
      '<div style="background:#fff7ed;border:1.5px solid #fb923c;border-radius:10px;padding:10px 13px;">' +
      '<div style="font-size:12.5px;font-weight:700;color:#9a3412;margin-bottom:4px;display:flex;align-items:center;gap:6px;">' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#9a3412"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>' +
      'AI Backend Unreachable</div>' +
      '<div style="font-size:11.5px;color:#7c3a1e;line-height:1.6;margin-bottom:8px;">' +
      'Report generation requires the live AI backend. The service may be warming up (cold start takes ~30–60 s on Render\'s free tier).' +
      '</div>' +
      '<button id="' + _retryBtnId + '" style="background:#E8001C;color:white;border:none;padding:5px 14px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;">&#x21BA; Try Again</button>' +
      '</div>'
    );
  }

  // ── Out-of-scope / general knowledge ─────────────────────────────────────
  var outOfScope = ['capital of','weather','news','who won','world cup','sport','movie','music','recipe','translate','currency','bitcoin','crypto','stock market','population','who is','what country'];
  if (outOfScope.some(function(k){return q.includes(k);})) {
    return ret('I can only answer questions related to the Automotive Service and Inventory Management System.');
  }

  // ── Symbols / garbage only ────────────────────────────────────────────────
  var meaningful = (query.match(/[a-zA-Z0-9]/g)||[]).length;
  if (meaningful < 2) {
    return ret("I didn't quite catch that. Could you rephrase your question about the fleet, inventory, or services?");
  }
  // Fleet summary — ONLY for an explicit "fleet summary" request.
  // A bare "summary/overview" must NOT hijack unrelated questions.
  if(q.includes('fleet summary')||q.includes('fleet overview')||(q.includes('fleet')&&q.includes('summary'))){
    var tot=assets.length,ov=assets.filter(isOverdue).length,mt=assets.filter(isMaint).length,ds=assets.filter(isDueSoon).length,ac=assets.filter(isActive).length,ls=inventory.filter(isLowStock).length;
    return ret('<strong>Fleet Summary</strong><br>• Vehicles: <strong>'+tot+'</strong> (Active: '+ac+', Maintenance: '+mt+')<br>• PMS Overdue: <strong>'+ov+'</strong>, Due Soon: <strong>'+ds+'</strong><br>• Low Stock Items: <strong>'+ls+'</strong><br>• Services: <strong>'+services.length+'</strong>');
  }
  // All vehicles
  if((q.includes('all')&&q.includes('vehicle'))||q.includes('show vehicle')||q.includes('list vehicle')){
    if(!assets.length)return ret('No vehicles found.');
    var rows=assets.slice(0,15).map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),statusTag(a.status)];});
    return ret('<strong>Vehicles ('+assets.length+')</strong>'+tbl(['Plate','Description','Status'],rows));
  }
  // Under maintenance
  if(q.includes('under maintenance')||(q.includes('maintenance')&&!q.includes('cost'))){
    var list=assets.filter(isMaint);
    if(!list.length)return ret('No vehicles under maintenance.');
    var rows=list.map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),_ragEsc(a.owner||'—')];});
    return ret('<strong>Under Maintenance ('+list.length+')</strong>'+tbl(['Plate','Description','Owner'],rows));
  }
  // PMS overdue
  if(q.includes('overdue')){
    var list=assets.filter(isOverdue);
    if(!list.length)return ret('No PMS overdue vehicles.');
    var rows=list.map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),_ragEsc(a.owner||'—')];});
    return ret('<strong>PMS Overdue ('+list.length+')</strong>'+tbl(['Plate','Description','Owner'],rows));
  }
  // Due soon
  if(q.includes('due this week')||q.includes('due soon')||(q.includes('pms')&&q.includes('due'))){
    var list=assets.filter(isDueSoon);
    if(!list.length)return ret('No PMS due soon.');
    var rows=list.map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),statusTag(a.status)];});
    return ret('<strong>PMS Due Soon ('+list.length+')</strong>'+tbl(['Plate','Description','Status'],rows));
  }
  // Low stock
  if(q.includes('low')&&q.includes('stock')){
    var list=inventory.filter(isLowStock);
    if(!list.length)return ret('All stock levels adequate.');
    var rows=list.map(function(i){return [_ragEsc(i.itemName||'—'),String(i.stock||0)+'/'+String(i.minLevel||0),_ragEsc(i.unit||'')];});
    return ret('<strong>Low Stock ('+list.length+')</strong>'+tbl(['Item','Stock/Min','Unit'],rows));
  }
  // Inventory summary
  if(q.includes('inventory summary')||q.includes('inventory overview')){
    var tot=inventory.length,ls=inventory.filter(isLowStock).length,ok=tot-ls;
    return ret('<strong>Inventory</strong><br>• Total: <strong>'+tot+'</strong><br>• OK: <strong>'+ok+'</strong><br>• Low: <strong>'+ls+'</strong>');
  }
  // Materials / parts / stock list
  if(q.includes('material')||q.includes('parts')||q.includes('supplies')||q.includes('stock item')||(q.includes('list')&&q.includes('inventor'))||(q.includes('show')&&(q.includes('stock')||q.includes('inventor')))){
    if(!inventory.length)return ret('No inventory data loaded yet.');
    var rows=inventory.slice(0,20).map(function(i){return [_ragEsc(i.itemName||i.name||'—'),String(i.stock||0),_ragEsc(i.unit||i.uom||''),_ragEsc(i.group||'—')];});
    var note=inventory.length>20?'<div style="font-size:10px;color:#718096;margin-top:4px;">Showing 20 of '+inventory.length+' items. Start the AI backend for the full list.</div>':'';
    return ret('<strong>Materials / Stock ('+inventory.length+')</strong>'+tbl(['Item','Stock','Unit','Group'],rows)+note);
  }
  // Full inventory list
  if(q.includes('inventory')){
    if(!inventory.length)return ret('No inventory data loaded yet.');
    var tot=inventory.length,ls=inventory.filter(isLowStock).length,ok=tot-ls;
    var rows=inventory.slice(0,15).map(function(i){return [_ragEsc(i.itemName||i.name||'—'),String(i.stock||0),_ragEsc(i.unit||i.uom||'')];});
    return ret('<strong>Inventory ('+tot+')</strong><br>• OK: <strong>'+ok+'</strong> &nbsp;• Low: <strong>'+ls+'</strong>'+tbl(['Item','Stock','Unit'],rows));
  }
  // Cost
  if(q.includes('cost')||q.includes('expense')){
    var now=new Date();
    var thisMonth=services.filter(function(s){var d=s.dateServiced||s.date||'';if(!d)return false;var dt=new Date(d);return !isNaN(dt)&&dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();});
    var mCost=thisMonth.reduce(function(s,t){return s+(parseFloat(t.totalCost||t.cost||0)||0);},0);
    var aCost=services.reduce(function(s,t){return s+(parseFloat(t.totalCost||t.cost||0)||0);},0);
    return ret('<strong>Maintenance Cost</strong><br>• This month: <strong>'+fmtP(mCost)+'</strong> ('+thisMonth.length+' services)<br>• All time: <strong>'+fmtP(aCost)+'</strong>');
  }
  // Pending
  if(q.includes('pending')){
    var list=services.filter(function(s){return (s.status||'').toLowerCase()==='pending';});
    if(!list.length)return ret('No pending services.');
    var rows=list.map(function(s){return [_ragEsc(s.plate||'—'),_ragEsc(s.mechanicName||s.mechanic||'—'),_ragEsc(s.dateServiced||s.date||'—')];});
    return ret('<strong>Pending ('+list.length+')</strong>'+tbl(['Plate','Mechanic','Date'],rows));
  }
  // Fast moving
  if(q.includes('fast')||q.includes('most used')){
    var counts={};
    issuances.forEach(function(i){var n=i.itemName||i.item||'';if(n)counts[n]=(counts[n]||0)+(parseFloat(i.quantity||i.qty)||0);});
    var sorted=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,8);
    if(!sorted.length)return ret('No issuance data found.');
    var rows=sorted.map(function(k){return [_ragEsc(k),String(counts[k])];});
    return ret('<strong>Fast Moving Items</strong>'+tbl(['Item','Total Issued'],rows));
  }
  // Users
  if(q.includes('user')||q.includes('staff')){
    var adm=users.filter(function(u){return u.role==='admin';}).length,stf=users.filter(function(u){return u.role==='staff';}).length,cus=users.filter(function(u){return u.role==='customer';}).length;
    return ret('<strong>Users ('+users.length+')</strong><br>• Admin: '+adm+'<br>• Staff: '+stf+'<br>• Customer: '+cus);
  }
  // Fallback — short, honest, capability-based (no fabricated data)
  var capabilities = 'I can help with vehicles & PMS status, maintenance records, inventory/stock levels, bookings, users, and PDF/Excel report generation.';
  if(q.includes('fleet')||q.includes('vehicle')){
    return ret(capabilities+'<br><br>For a fleet overview, try <em>"Fleet Summary"</em>.');
  }
  return ret('I\u2019m not able to help with that request in local mode. '+capabilities+'<br><br>For full natural-language answers, start the AI backend (<code>start.bat</code>).');
}

})();
</script>
