<!-- ── Smart Reports AI Floating Widget ── -->
<!-- Include this file in admin pages that need the AI chatbot -->
<!-- Requires: window.assets, window.inventory, window.serviceTransactions from admin_firebase.js -->

<!-- Floating toggle button -->
<div id="ragAiFabWrap" style="position:fixed;bottom:2rem;right:2rem;z-index:1200;display:inline-flex;">
  <div style="position:relative;display:inline-flex;">
    <button id="ragAiToggleBtn" onclick="ragAiToggle()"
      title="Smart Reports AI"
      style="width:58px;height:58px;border-radius:50%;border:2.5px solid #E8001C;cursor:pointer;
             background:white;
             box-shadow:0 4px 20px rgba(232,0,28,0.22),0 0 0 0 rgba(232,0,28,0.2);
             display:flex;align-items:center;justify-content:center;
             transition:all 0.25s ease;padding:3px;overflow:hidden;
             animation:ragFabPulse 2.8s ease-in-out infinite;">
      <img id="ragFabAiImg" src="../static/img/AI_LOGO.png"
           style="width:48px;height:48px;object-fit:cover;border-radius:50%;display:block;" alt="AI">
    </button>
  </div>
</div>

<!-- Floating AI chat panel -->
<div id="ragAiPanel"
  style="display:none;position:fixed;bottom:6.2rem;right:2rem;z-index:1201;
         width:390px;height:580px;max-height:calc(100vh - 8rem);
         background:#fff;border-radius:22px;
         box-shadow:0 20px 60px rgba(0,0,0,0.18),0 4px 16px rgba(232,0,28,0.08);
         border:1px solid rgba(226,232,240,0.8);overflow:hidden;
         display:none;flex-direction:column;
         animation:ragAiSlideIn 0.28s cubic-bezier(.34,1.56,.64,1);">

  <!-- Panel header -->
  <div id="ragAiHeader" style="background:linear-gradient(135deg,#c62828 0%,#E8001C 60%,#ff5252 100%);padding:14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;overflow:visible;">
    <!-- Subtle shine overlay -->
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(255,255,255,0.1) 0%,transparent 65%);pointer-events:none;border-radius:22px 22px 0 0;"></div>
    <!-- Avatar — transparent bg, image fills circle -->
    <div style="position:relative;flex-shrink:0;">
      <div style="width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,0.4);flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
        <img src="../static/img/AI_LOGO.png" style="width:40px;height:40px;object-fit:cover;display:block;" alt="AI">
      </div>
      <!-- Online dot on avatar -->
      <span id="ragHeaderOnlineDot" style="display:none;position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#4ade80;border:2px solid white;box-shadow:0 0 5px rgba(74,222,128,0.8);"></span>
    </div>
    <!-- Title -->
    <div style="flex:1;min-width:0;">
      <div style="color:#fff;font-size:13.5px;font-weight:700;">Admin AI Assistant</div>
      <div style="display:flex;align-items:center;gap:5px;margin-top:2px;">
        <span id="ragAiDot" style="width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;box-shadow:0 0 6px rgba(74,222,128,0.8);"></span>
        <span id="ragAiStatus" style="font-size:10.5px;color:rgba(255,255,255,0.8);">Online · RAG AI</span>
      </div>
    </div>
    <!-- Clear icon button with tooltip -->
    <div style="position:relative;z-index:20;" id="ragClearWrap">
      <button onclick="ragAiClear()" id="ragClearBtn"
        title="Clear chat"
        style="width:32px;height:32px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
               color:white;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;
               transition:background .18s;"
        onmouseover="this.style.background='rgba(255,255,255,0.28)';document.getElementById('ragClearTip').style.opacity='1';document.getElementById('ragClearTip').style.visibility='visible';"
        onmouseout="this.style.background='rgba(255,255,255,0.15)';document.getElementById('ragClearTip').style.opacity='0';document.getElementById('ragClearTip').style.visibility='hidden';">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </button>
      <!-- Tooltip — above the button so it's never clipped -->
      <div id="ragClearTip" style="position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
           background:rgba(30,30,30,0.88);color:#fff;font-size:10.5px;font-weight:600;
           padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;
           opacity:0;visibility:hidden;transition:opacity .18s ease;z-index:100;">Clear chat
        <div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:rgba(30,30,30,0.88);"></div>
      </div>
    </div>
    <!-- Close button -->
    <button onclick="ragAiToggle()"
      style="width:32px;height:32px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
             color:white;border-radius:9px;cursor:pointer;font-size:18px;line-height:1;
             display:flex;align-items:center;justify-content:center;flex-shrink:0;
             transition:background .18s;"
      onmouseover="this.style.background='rgba(255,255,255,0.28)'"
      onmouseout="this.style.background='rgba(255,255,255,0.15)'">×</button>
  </div>

  <!-- Messages area -->
  <div id="ragAiChat" style="flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#f8f9fb 0%,#f2f4f7 100%);scroll-behavior:smooth;"></div>

  <!-- Quick chips — hidden -->
  <div id="ragAiChips" style="display:none;"></div>

  <!-- Input bar -->
  <div style="padding:10px 12px 12px;background:white;border-top:1px solid #edf0f5;flex-shrink:0;">
    <div style="display:flex;gap:8px;align-items:center;background:#f4f6f9;border:1.5px solid #edf0f5;border-radius:20px;padding:8px 8px 8px 14px;transition:border-color .2s,box-shadow .2s;" id="ragInputWrap">
      <textarea id="ragAiInput" placeholder="Ask about fleet, inventory, reports…"
        rows="1" style="flex:1;border:none;background:transparent;font-size:12.5px;font-family:inherit;color:#1a202c;outline:none;resize:none;max-height:80px;overflow-y:auto;line-height:1.5;padding:0;margin:0;display:block;align-self:center;"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ragAiSend();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"
        onfocus="document.getElementById('ragInputWrap').style.borderColor='#E8001C';document.getElementById('ragInputWrap').style.boxShadow='0 0 0 3px rgba(232,0,28,0.08)';"
        onblur="document.getElementById('ragInputWrap').style.borderColor='#edf0f5';document.getElementById('ragInputWrap').style.boxShadow='none';"></textarea>
      <button onclick="ragAiSend()" id="ragSendBtn"
        style="width:34px;height:34px;min-width:34px;background:linear-gradient(135deg,#E8001C,#c0001a);border:none;border-radius:50%;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(232,0,28,0.35);transition:all .18s;"
        onmouseover="this.style.transform='scale(1.08)';this.style.boxShadow='0 5px 14px rgba(232,0,28,0.45)'"
        onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 3px 10px rgba(232,0,28,0.35)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(45deg)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div style="text-align:center;font-size:10px;color:#c0c8d4;margin-top:5px;">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
  </div>
</div>

<style>
@keyframes ragAiSlideIn { from{opacity:0;transform:translateY(16px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes ragFabPulse  { 0%,100%{box-shadow:0 4px 20px rgba(232,0,28,0.22),0 0 0 0 rgba(232,0,28,0.15)} 50%{box-shadow:0 4px 20px rgba(232,0,28,0.22),0 0 0 8px rgba(232,0,28,0)} }
@keyframes ragBounce    { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
@keyframes ragSpin      { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.rag-chip { padding:4px 10px;background:#f7f8fa;border:1.5px solid #e2e8f0;border-radius:16px;font-size:11px;font-weight:500;color:#4a5568;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit; }
.rag-chip:hover { background:#E8001C;color:white;border-color:#E8001C; }

/* ── Message rows ── */
#ragAiChat .rag-row { display:flex;gap:9px;align-items:flex-end; }
#ragAiChat .rag-row.user { flex-direction:row-reverse; }

/* ── Avatars ── */
#ragAiChat .rag-av { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden; }
#ragAiChat .rag-av.ai  { background:transparent;box-shadow:0 2px 8px rgba(0,0,0,0.12);border:1.5px solid rgba(226,232,240,0.8); }
#ragAiChat .rag-av.usr { background:linear-gradient(135deg,#475569,#334155);color:white;font-size:10px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.15); }

/* ── Bubbles ── */
#ragAiChat .rag-bub { max-width:80%;padding:10px 14px;border-radius:16px;font-size:12.5px;line-height:1.65;word-break:break-word; }
#ragAiChat .rag-bub.ai {
  background:white;color:#1a202c;
  border-radius:4px 16px 16px 16px;
  box-shadow:0 2px 12px rgba(0,0,0,0.07);
  border:1px solid rgba(226,232,240,0.6);
}
/* user class — matches what _ragAppend sets */
#ragAiChat .rag-bub.user,
#ragAiChat .rag-bub.usr {
  background:linear-gradient(135deg,#E8001C 0%,#c0001a 100%);
  color:white;
  border-radius:16px 4px 16px 16px;
  box-shadow:0 3px 12px rgba(232,0,28,0.25);
}

/* ── Tables inside AI bubble ── */
#ragAiChat .rag-bub table { width:100%;border-collapse:collapse;margin-top:8px;font-size:11px; }
#ragAiChat .rag-bub table th { background:#f7f8fa;padding:5px 8px;text-align:left;font-weight:700;color:#4a5568;border-bottom:1.5px solid #e2e8f0;font-size:10.5px; }
#ragAiChat .rag-bub table td { padding:5px 8px;border-bottom:1px solid #f0f4f8;color:#1a202c; }
#ragAiChat .rag-bub .sr-tag { display:inline-block;padding:1px 6px;border-radius:12px;font-size:10px;font-weight:700;margin:1px; }

/* ── Typing indicator ── */
.rag-typing { display:flex;gap:5px;align-items:center;padding:10px 14px; }
.rag-typing span { width:7px;height:7px;background:#cbd5e0;border-radius:50%;animation:ragBounce .9s ease-in-out infinite; }
.rag-typing span:nth-child(2) { animation-delay:.15s; }
.rag-typing span:nth-child(3) { animation-delay:.3s; }

/* ── Welcome suggestion pills ── */
.rag-suggest-pill {
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:white;
  border:1.5px solid #e8edf2;
  border-radius:12px;
  padding:11px 14px;
  font-size:12px;font-weight:500;color:#4a5568;
  cursor:pointer;font-family:inherit;
  transition:all .18s ease;
  box-shadow:0 1px 4px rgba(0,0,0,0.05);
  pointer-events:auto;
}
.rag-suggest-pill::before {
  content:'';width:7px;height:7px;border-radius:50%;
  background:#E8001C;
  flex-shrink:0;
}
.rag-suggest-pill:hover {
  border-color:#E8001C;color:#E8001C;
  background:#fff5f5;
  box-shadow:0 3px 12px rgba(232,0,28,0.12);
  transform:translateY(-1px);
}

/* ── Scrollbar ── */
#ragAiChat::-webkit-scrollbar { width:4px; }
#ragAiChat::-webkit-scrollbar-track { background:transparent; }
#ragAiChat::-webkit-scrollbar-thumb { background:#d1d5db;border-radius:4px; }
#ragAiChat::-webkit-scrollbar-thumb:hover { background:#9ca3af; }

/* ── Rate-limit banner ── */
.rag-rate-banner { background:#fff7ed;border-bottom:2px solid #fb923c;padding:10px 14px;font-size:11.5px;color:#9a3412;display:flex;align-items:flex-start;gap:8px;flex-shrink:0;line-height:1.55; }
</style>

<script>
// ════════════════════════════════════════════════════════════
//  Smart Reports AI — Floating Widget
// ════════════════════════════════════════════════════════════
(function() {
var _ragInitials = 'AD';
var _ragReady = false;
var _ragSessionId = null;  // server-side session key — sent back on each request
var _ragRateLimited = false;

// ── Rate-limit helpers ────────────────────────────────────────────────────
function _ragSetRateLimited(limited, resetIn) {
  _ragRateLimited = limited;
  var input  = document.getElementById('ragAiInput');
  var sendBtn = input ? input.closest('div').querySelector('button') : null;
  var banner  = document.getElementById('ragRateBanner');

  if (limited) {
    if (input)   { input.disabled = true;  input.placeholder = 'AI unavailable — daily limit reached'; }
    if (sendBtn) { sendBtn.disabled = true; sendBtn.style.opacity = '0.45'; sendBtn.style.cursor = 'not-allowed'; }
    if (!banner) {
      // Insert banner below the panel header
      var chat = document.getElementById('ragAiChat');
      if (chat && chat.parentNode) {
        var b = document.createElement('div');
        b.id = 'ragRateBanner';
        b.style.cssText =
          'background:#fff7ed;border-bottom:2px solid #fb923c;' +
          'padding:10px 14px;font-size:11.5px;color:#9a3412;display:flex;' +
          'align-items:flex-start;gap:8px;flex-shrink:0;line-height:1.55;';
        b.innerHTML =
          '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#9a3412" style="flex-shrink:0;margin-top:1px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>' +
          '<div><strong style="display:block;margin-bottom:2px;">AI unavailable — daily token limit reached</strong>' +
          'Groq free-tier quota is exhausted. Resets in <strong>' + (resetIn || 'some time') + '</strong>. ' +
          'Chat is disabled until then.</div>';
        chat.parentNode.insertBefore(b, chat);
      }
    }
  } else {
    if (input)   { input.disabled = false; input.placeholder = 'Ask about fleet, inventory, maintenance...'; }
    if (sendBtn) { sendBtn.disabled = false; sendBtn.style.opacity = ''; sendBtn.style.cursor = ''; }
    if (banner)  { banner.remove(); }
  }
}

window.ragAiToggle = function() {
  var panel = document.getElementById('ragAiPanel');
  if (!panel) return;
  var isOpen = panel.style.display === 'flex';
  panel.style.display = isOpen ? 'none' : 'flex';
  // Update FAB: show X icon when open, AI image when closed
  var btn = document.getElementById('ragAiToggleBtn');
  if (btn) {
    if (!isOpen) {
      // Now opening — show X
      btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
      btn.style.background = 'linear-gradient(135deg,#E8001C,#c0001a)';
      btn.style.border = 'none';
      btn.style.overflow = 'visible';
      btn.style.padding = '0';
    } else {
      // Now closing — show AI image with red border
      btn.innerHTML = '<img id="ragFabAiImg" src="../static/img/AI_LOGO.png" style="width:48px;height:48px;object-fit:cover;border-radius:50%;display:block;" alt="AI">';
      btn.style.background = 'white';
      btn.style.border = '2.5px solid #E8001C';
      btn.style.overflow = 'hidden';
      btn.style.padding = '3px';
    }
  }
};

// Get admin initials
if (typeof firebase !== 'undefined') {
  firebase.auth().onAuthStateChanged(function(user) {
    if (!user) return;
    firebase.firestore().collection('users').doc(user.uid).get().then(function(doc) {
      if (!doc.exists) return;
      var name = doc.data().name || '';
      var parts = name.trim().split(' ').filter(Boolean);
      _ragInitials = parts.length >= 2 ? (parts[0][0]+parts[1][0]).toUpperCase() : (parts[0]?parts[0][0].toUpperCase():'AD');
    });
  });
}

// Watch for data readiness + check RAG AI health
function _ragWatch() {
  var attempts = 0;
  var iv = setInterval(function() {
    attempts++;
    var v = (window.assets||[]).length, i = (window.inventory||[]).length, s = (window.serviceTransactions||[]).length;
    if (v > 0 || i > 0 || s > 0 || attempts >= 15) {
      clearInterval(iv);
      _ragReady = true;
      // Check RAG AI engine health
      fetch('/api/ai-health').then(function(r){return r.json();}).then(function(d){
        var dot = document.getElementById('ragAiDot');
        var txt = document.getElementById('ragAiStatus');
        if (d.online) {
          if (dot) dot.style.background = '#4ade80';
          if (txt) { txt.textContent = 'Online · RAG AI'; }
        } else {
          if (dot) dot.style.background = '#d69e2e';
          if (txt) { txt.textContent = 'Online · Local mode'; }
        }
      }).catch(function(){
        var dot = document.getElementById('ragAiDot');
        var txt = document.getElementById('ragAiStatus');
        if (dot) dot.style.background = '#d69e2e';
        if (txt) { txt.textContent = 'Online · Local mode'; }
      });
    }
  }, 600);
}
setTimeout(_ragWatch, 1000);
setTimeout(_ragShowWelcome, 1100);

function _ragEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Lightweight markdown renderer for AI responses
function _ragMarkdown(text) {
  if (!text) return '';
  var s = text;

  // Escape HTML first (we'll selectively re-insert tags)
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Bold **text** or __text__
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');

  // Italic *text* or _text_
  s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_\n]+?)_/g, '<em>$1</em>');

  // Code `inline`
  s = s.replace(/`([^`\n]+?)`/g, '<code style="background:#f1f5f9;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:0.92em;">$1</code>');

  // Headers ### ## #
  s = s.replace(/^### (.+)$/gm, '<div style="font-weight:700;font-size:13px;margin:8px 0 3px;color:#1a202c;">$1</div>');
  s = s.replace(/^## (.+)$/gm,  '<div style="font-weight:700;font-size:13.5px;margin:8px 0 3px;color:#1a202c;">$1</div>');
  s = s.replace(/^# (.+)$/gm,   '<div style="font-weight:800;font-size:14px;margin:8px 0 4px;color:#1a202c;">$1</div>');

  // Bullet lists: lines starting with - or * or •
  s = s.replace(/^[\-\*•] (.+)$/gm, '<div style="display:flex;gap:7px;margin:2px 0;"><span style="color:#E8001C;flex-shrink:0;margin-top:1px;">•</span><span>$1</span></div>');

  // Numbered lists: lines starting with 1. 2. etc.
  s = s.replace(/^(\d+)\. (.+)$/gm, '<div style="display:flex;gap:7px;margin:2px 0;"><span style="color:#E8001C;font-weight:700;flex-shrink:0;min-width:16px;">$1.</span><span>$2</span></div>');

  // Horizontal rule ---
  s = s.replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid #e2e8f0;margin:8px 0;">');

  // Line breaks — double newline = paragraph gap, single = <br>
  s = s.replace(/\n\n/g, '<div style="height:6px;"></div>');
  s = s.replace(/\n/g, '<br>');

  return s;
}

var _AI_AVATAR_SVG = '<img src="../static/img/AI_LOGO.png" width="28" height="28" style="object-fit:cover;border-radius:50%;display:block;" alt="AI">';

function _ragAppend(role, html) {
  var chat = document.getElementById('ragAiChat');
  var row = document.createElement('div');
  row.className = 'rag-row' + (role==='user'?' user':'');
  var av = role==='user'
    ? '<div class="rag-av usr">'+_ragInitials+'</div>'
    : '<div class="rag-av ai">'+_AI_AVATAR_SVG+'</div>';
  var bub = '<div class="rag-bub '+role+'">'+html+'</div>';
  row.innerHTML = role==='user' ? bub+av : av+bub;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function _ragTyping() {
  var chat = document.getElementById('ragAiChat');
  var row = document.createElement('div');
  row.className='rag-row'; row.id='ragTyping';
  row.innerHTML='<div class="rag-av ai">'+_AI_AVATAR_SVG+'</div>'
    +'<div class="rag-bub ai"><div class="rag-typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

function _ragRemoveTyping() { var el=document.getElementById('ragTyping'); if(el)el.remove(); }

window.ragAiSend = function(preset) {
  var input = document.getElementById('ragAiInput');
  var text = (preset||input.value).trim();
  if (!text) return;
  if (_ragRateLimited) { return; }  // blocked while rate-limited
  if (!_ragReady) { _ragAppend('ai','<strong>Still loading data…</strong> Please wait.'); return; }
  // Hide welcome block on first real message
  var wb = document.getElementById('ragWelcomeBlock');
  if (wb) wb.remove();
  document.getElementById('ragAiChips').style.display='none';
  _ragAppend('user', _ragEsc(text));
  input.value=''; input.style.height='auto';
  _ragTyping();

  // Call the Flask AI endpoint — session_id enables server-side memory
  fetch('/api/ai-chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message:    text,
      user_type:  'admin',
      session_id: _ragSessionId,
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    _ragRemoveTyping();
    // Persist the session_id returned by the backend for memory continuity
    if (data.session_id) { _ragSessionId = data.session_id; }

    // ── Rate limit notice ─────────────────────────────────────────────────
    if (data.rate_limited) {
      _ragSetRateLimited(true, data.reset_in || 'some time');
      var resetMsg = data.reset_in || 'some time';
      _ragAppend('ai',
        '<div style="background:#fff7ed;border:1.5px solid #fb923c;border-radius:10px;padding:10px 13px;color:#9a3412;">' +
        '<div style="font-size:13px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px;">' +
        '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="#9a3412"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>' +
        'AI Unavailable</div>' +
        '<div style="font-size:11.5px;line-height:1.6;">' +
        'The AI service has reached its <strong>daily token limit</strong> (Groq free tier).<br>' +
        'Resets in <strong>' + resetMsg + '</strong>.<br>' +
        'You cannot send new messages until the quota resets automatically.</div>' +
        '</div>');
      return;
    }

    if (data.offline || !data.success) {
      if (data.cold_start) {
        // Render cold start — backend is waking up, not truly offline
        _ragAppend('ai',
          '<div style="background:#ebf8ff;border:1px solid #bee3f8;border-radius:8px;padding:9px 12px;font-size:11.5px;color:#2b6cb0;">' +
          '&#x26A0; <strong>AI service is warming up</strong> (Render cold start).<br>' +
          'Please wait a few seconds and <strong>send your message again</strong>.' +
          '</div>'
        );
      } else {
        // Truly offline — fall back to local JS engine
        _ragAppend('ai', '<div style="background:#fff7ed;border:1px solid #fb923c;border-radius:8px;padding:7px 11px;font-size:11px;color:#9a3412;margin-bottom:6px;"><strong>AI backend offline</strong> — using local data mode.</div>');
        var result = _ragProcess(text);
        _ragAppend('ai', result.html);
      }
    } else if (data.report_ready) {
      // Report is ready — show message with ONLY the requested download button(s)
      var answer = (data.answer || '').replace(/\n/g, '<br>');
      var rMonth   = data.report_month       || null;
      var rStart   = data.report_start_date  || null;
      var rEnd     = data.report_end_date    || null;
      var rFilters = data.report_filters     || {};
      var rFmt     = (data.report_format     || 'pdf').toLowerCase();

      // Build a human-readable filter label for the button text
      var filterLabel = '';
      if (rStart || rEnd) {
        filterLabel = ' (' + (rStart || '—') + ' to ' + (rEnd || '—') + ')';
      } else if (rMonth) {
        filterLabel = ' (' + rMonth + ')';
      }

      // ── Safe button approach: store params in a JS map, never inject into onclick ──
      // Injecting JSON.stringify into an onclick attribute breaks on any string value
      // containing quotes (e.g. owner names). Instead we assign a unique ID and look up.
      var rId = 'rp_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      window._ragReportParams = window._ragReportParams || {};
      window._ragReportParams[rId] = {
        reportType: data.report_type,
        month:      rMonth,
        startDate:  rStart,
        endDate:    rEnd,
        filters:    rFilters
      };

      function _makeBtn(fmt, style) {
        var btnStyle = style === 'primary'
          ? 'background:#E8001C;color:white;border:none;padding:6px 14px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;'
          : 'background:#f7f8fa;color:#4a5568;border:1.5px solid #e2e8f0;padding:6px 14px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;';
        var label = fmt.toUpperCase();
        var btnId = rId + '_' + fmt;
        // Safe: only safe identifiers (rId, fmt, btnId) go into the onclick string
        return '<button id="' + btnId + '" onclick="ragDownloadReport(\'' + rId + '\',\'' + fmt + '\')" style="' + btnStyle + '">&#x2193; Download ' + label + filterLabel + '</button>';
      }

      // Unique ID for the error slot so ragDownloadReport can update it in-place
      var errId = rId + '_err';
      var btnHtml = '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">';
      if (rFmt === 'both') {
        btnHtml += _makeBtn('pdf',   'primary');
        btnHtml += _makeBtn('excel', 'secondary');
      } else if (rFmt === 'excel') {
        btnHtml += _makeBtn('excel', 'primary');
      } else {
        btnHtml += _makeBtn('pdf', 'primary');
      }
      btnHtml += '</div>';
      btnHtml += '<div id="' + errId + '" style="font-size:11px;margin-top:4px;"></div>';
      _ragAppend('ai', answer + btnHtml);
    } else if (data.answer) {
      // Render the AI answer with lightweight markdown formatting
      _ragAppend('ai', _ragMarkdown(data.answer));
    } else {
      // AI returned success but no answer — use local fallback
      var result = _ragProcess(text);
      _ragAppend('ai', result.html);
    }
  })
  .catch(function(err) {
    // Network error or Flask backend down — fall back to local JS query engine
    _ragRemoveTyping();
    _ragAppend('ai', '<div style="background:#fff7ed;border:1px solid #fb923c;border-radius:8px;padding:7px 11px;font-size:11px;color:#9a3412;margin-bottom:6px;"><strong>AI backend unreachable</strong> — using local data mode.</div>');
    var result = _ragProcess(text);
    _ragAppend('ai', result.html);
  });
};

window.ragAiClear = function() {
  // Clear server-side session memory
  if (_ragSessionId) {
    fetch('/api/ai-session/' + _ragSessionId, { method: 'DELETE' }).catch(function(){});
    _ragSessionId = null;
  }
  _ragSetRateLimited(false);
  document.getElementById('ragAiChat').innerHTML='';
  document.getElementById('ragAiChips').style.display='none';
  _ragShowWelcome();
};

window.ragDownloadReport = function(reportId, format) {
  // ── Guard: block concurrent downloads ────────────────────────────────────
  if (window._ragDownloading) return;

  // Look up the stored report params for this button
  var params = (window._ragReportParams || {})[reportId];
  if (!params) {
    // Params missing — show inline error in the error slot if it exists
    var errSlot = document.getElementById(reportId + '_err');
    if (errSlot) errSlot.innerHTML = '<span style="color:#E8001C;">Session expired. Please ask for the report again.</span>';
    return;
  }

  var reportType = params.reportType;
  var month      = params.month      || null;
  var startDate  = params.startDate  || null;
  var endDate    = params.endDate    || null;
  var filters    = params.filters    || {};
  var errSlot    = document.getElementById(reportId + '_err');
  var btn        = document.getElementById(reportId + '_' + format);

  // ── Lock: disable all buttons for this report, show spinner on clicked one ─
  window._ragDownloading = true;
  ['pdf','excel'].forEach(function(f) {
    var b = document.getElementById(reportId + '_' + f);
    if (b) {
      b.disabled = true;
      b.style.opacity = '0.6';
      b.style.cursor  = 'not-allowed';
    }
  });
  if (btn) {
    btn.style.opacity = '1';
    btn.style.cursor  = 'wait';
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:5px;">'
      + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:ragSpin 0.8s linear infinite;">'
      + '<path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>'
      + 'Generating…</span>';
  }
  if (errSlot) errSlot.innerHTML = '';

  // ── Build request body ────────────────────────────────────────────────────
  var body = { report_type: reportType, format: format };
  if (startDate || endDate) {
    if (startDate) body.start_date = startDate;
    if (endDate)   body.end_date   = endDate;
  } else if (month) {
    body.month = month;
  }
  if (filters && typeof filters === 'object' && Object.keys(filters).length > 0) {
    body.filters = filters;
  }

  fetch('/api/ai-report', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(res) {
    if (!res.ok) {
      return res.json().then(function(e) {
        throw new Error(e.error || 'Report generation failed');
      }).catch(function() {
        throw new Error('Report generation failed (status ' + res.status + ')');
      });
    }
    return res.blob();
  })
  .then(function(blob) {
    // ── Build filename ──────────────────────────────────────────────────────
    var ext = format === 'pdf' ? '.pdf' : '.xlsx';
    var safeSuffix = '';
    if (startDate || endDate) {
      safeSuffix = '_' + (startDate || '').replace(/\s+/g, '_')
                 + '_to_' + (endDate || '').replace(/\s+/g, '_');
    } else if (month) {
      safeSuffix = '_' + month.replace(/\s+/g, '_');
    }
    var filename = reportType + '_report' + safeSuffix + ext;

    // ── Trigger browser download ────────────────────────────────────────────
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // ── Update button to "Downloaded ✓" permanently ────────────────────────
    if (btn) {
      btn.innerHTML = '&#x2713; Downloaded';
      btn.style.background = '#38a169';
      btn.style.color      = 'white';
      btn.style.border     = 'none';
      btn.style.opacity    = '1';
      btn.style.cursor     = 'default';
    }
    // Re-enable the other format button (if "both" was shown)
    ['pdf','excel'].forEach(function(f) {
      if (f === format) return;
      var b = document.getElementById(reportId + '_' + f);
      if (b) {
        b.disabled = false;
        b.style.opacity = '1';
        b.style.cursor  = 'pointer';
      }
    });
  })
  .catch(function(err) {
    // ── Restore buttons and show inline error ──────────────────────────────
    ['pdf','excel'].forEach(function(f) {
      var b = document.getElementById(reportId + '_' + f);
      if (b) {
        b.disabled = false;
        b.style.opacity = '1';
        b.style.cursor  = 'pointer';
      }
    });
    if (btn) {
      // Restore original label
      var origLabel = format.toUpperCase();
      var filterLabel = '';
      if (startDate || endDate) filterLabel = ' (' + (startDate||'—') + ' to ' + (endDate||'—') + ')';
      else if (month) filterLabel = ' (' + month + ')';
      btn.innerHTML = '&#x2193; Download ' + origLabel + filterLabel;
    }
    if (errSlot) errSlot.innerHTML = '<span style="color:#E8001C;font-size:11px;">' + err.message + '</span>';
  })
  .finally(function() {
    window._ragDownloading = false;
  });
};

// ════════════════════════════════════════════════════════════
//  Query Engine (same logic as admin_smart_reports.html)
// ════════════════════════════════════════════════════════════
function _ragProcess(query) {
  var q = query.toLowerCase().trim();
  var assets=window.assets||[], inventory=window.inventory||[], services=window.serviceTransactions||[], issuances=window.issuances||[], users=window.users||[];
  var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtP(n){return '₱'+(parseFloat(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2});}
  function tag(t,c,b){return '<span class="sr-tag" style="background:'+b+';color:'+c+';">'+_ragEsc(t)+'</span>';}
  function isOverdue(a){var s=(a.status||'').toLowerCase();return s==='overdue'||s.includes('overdue');}
  function isMaint(a){var s=(a.status||'').toLowerCase();return s==='maintenance'||s.includes('maintenance');}
  function isDueSoon(a){var s=(a.status||'').toLowerCase();return s==='due-soon'||s.includes('due');}
  function isActive(a){var s=(a.status||'').toLowerCase();return s==='active'||s==='on track';}
  function isLowStock(i){return (parseInt(i.stock)||0)<=(parseInt(i.minLevel)||0);}
  function statusTag(raw){
    var s=(raw||'').toLowerCase(),label=raw||'—';
    if(s==='overdue'||s.includes('overdue'))label='Overdue';
    else if(s==='maintenance'||s.includes('maintenance'))label='Maintenance';
    else if(s==='due-soon'||s.includes('due'))label='Due Soon';
    else if(s==='active'||s==='on track')label='Active';
    else if(s==='pending')label='Pending';
    else if(s==='ongoing')label='Ongoing';
    else if(s==='completed')label='Completed';
    else if(s==='low')label='Low';
    else if(s==='ok')label='OK';
    var map={'Overdue':['#E8001C','rgba(232,0,28,0.1)'],'Maintenance':['#d69e2e','rgba(214,158,46,0.1)'],'Due Soon':['#d97706','rgba(217,119,6,0.1)'],'Active':['#38a169','rgba(56,161,105,0.1)'],'Pending':['#718096','rgba(113,128,150,0.1)'],'Ongoing':['#d69e2e','rgba(214,158,46,0.1)'],'Completed':['#003087','rgba(0,48,135,0.1)'],'Low':['#E8001C','rgba(232,0,28,0.1)'],'OK':['#38a169','rgba(56,161,105,0.1)']};
    var c=map[label]||['#718096','rgba(113,128,150,0.1)'];
    return tag(label,c[0],c[1]);
  }
  function tbl(h,r){if(!r.length)return '<em style="color:#718096;font-size:11px;">No records found.</em>';return '<table><thead><tr>'+h.map(function(x){return '<th>'+_ragEsc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+r.map(function(row){return '<tr>'+row.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
  function ret(html){return {html:html};}

  // Fleet summary
  if(q.includes('fleet summary')||q.includes('summary')||q.includes('overview')){
    var tot=assets.length,ov=assets.filter(isOverdue).length,mt=assets.filter(isMaint).length,ds=assets.filter(isDueSoon).length,ac=assets.filter(isActive).length,ls=inventory.filter(isLowStock).length;
    return ret('<strong>Fleet Summary</strong><br>• Vehicles: <strong>'+tot+'</strong> (Active: '+ac+', Maintenance: '+mt+')<br>• PMS Overdue: <strong>'+ov+'</strong>, Due Soon: <strong>'+ds+'</strong><br>• Low Stock Items: <strong>'+ls+'</strong><br>• Services: <strong>'+services.length+'</strong>');
  }
  // All vehicles
  if((q.includes('all')&&q.includes('vehicle'))||q.includes('show vehicle')||q.includes('list vehicle')){
    if(!assets.length)return ret('No vehicles found.');
    var rows=assets.slice(0,15).map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),statusTag(a.status)];});
    return ret('<strong>Vehicles ('+assets.length+')</strong>'+tbl(['Plate','Description','Status'],rows));
  }
  // Under maintenance
  if(q.includes('under maintenance')||(q.includes('maintenance')&&!q.includes('cost'))){
    var list=assets.filter(isMaint);
    if(!list.length)return ret('No vehicles under maintenance.');
    var rows=list.map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),_ragEsc(a.owner||'—')];});
    return ret('<strong>Under Maintenance ('+list.length+')</strong>'+tbl(['Plate','Description','Owner'],rows));
  }
  // PMS overdue
  if(q.includes('overdue')){
    var list=assets.filter(isOverdue);
    if(!list.length)return ret('No PMS overdue vehicles.');
    var rows=list.map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),_ragEsc(a.owner||'—')];});
    return ret('<strong>PMS Overdue ('+list.length+')</strong>'+tbl(['Plate','Description','Owner'],rows));
  }
  // Due soon
  if(q.includes('due this week')||q.includes('due soon')||(q.includes('pms')&&q.includes('due'))){
    var list=assets.filter(isDueSoon);
    if(!list.length)return ret('No PMS due soon.');
    var rows=list.map(function(a){return [_ragEsc(a.plateNumber||'—'),_ragEsc(a.assetDescription||'—'),statusTag(a.status)];});
    return ret('<strong>PMS Due Soon ('+list.length+')</strong>'+tbl(['Plate','Description','Status'],rows));
  }
  // Low stock
  if(q.includes('low')&&q.includes('stock')){
    var list=inventory.filter(isLowStock);
    if(!list.length)return ret('All stock levels adequate.');
    var rows=list.map(function(i){return [_ragEsc(i.itemName||'—'),String(i.stock||0)+'/'+String(i.minLevel||0),_ragEsc(i.unit||'')];});
    return ret('<strong>Low Stock ('+list.length+')</strong>'+tbl(['Item','Stock/Min','Unit'],rows));
  }
  // Inventory summary
  if(q.includes('inventory summary')||q.includes('inventory overview')){
    var tot=inventory.length,ls=inventory.filter(isLowStock).length,ok=tot-ls;
    return ret('<strong>Inventory</strong><br>• Total: <strong>'+tot+'</strong><br>• OK: <strong>'+ok+'</strong><br>• Low: <strong>'+ls+'</strong>');
  }
  // Materials / parts / stock list
  if(q.includes('material')||q.includes('parts')||q.includes('supplies')||q.includes('stock item')||(q.includes('list')&&q.includes('inventor'))||(q.includes('show')&&(q.includes('stock')||q.includes('inventor')))){
    if(!inventory.length)return ret('No inventory data loaded yet.');
    var rows=inventory.slice(0,20).map(function(i){return [_ragEsc(i.itemName||i.name||'—'),String(i.stock||0),_ragEsc(i.unit||i.uom||''),_ragEsc(i.group||'—')];});
    var note=inventory.length>20?'<div style="font-size:10px;color:#718096;margin-top:4px;">Showing 20 of '+inventory.length+' items. Start the AI backend for the full list.</div>':'';
    return ret('<strong>Materials / Stock ('+inventory.length+')</strong>'+tbl(['Item','Stock','Unit','Group'],rows)+note);
  }
  // Full inventory list
  if(q.includes('inventory')){
    if(!inventory.length)return ret('No inventory data loaded yet.');
    var tot=inventory.length,ls=inventory.filter(isLowStock).length,ok=tot-ls;
    var rows=inventory.slice(0,15).map(function(i){return [_ragEsc(i.itemName||i.name||'—'),String(i.stock||0),_ragEsc(i.unit||i.uom||'')];});
    return ret('<strong>Inventory ('+tot+')</strong><br>• OK: <strong>'+ok+'</strong> &nbsp;• Low: <strong>'+ls+'</strong>'+tbl(['Item','Stock','Unit'],rows));
  }
  // Cost
  if(q.includes('cost')||q.includes('expense')){
    var now=new Date();
    var thisMonth=services.filter(function(s){var d=s.dateServiced||s.date||'';if(!d)return false;var dt=new Date(d);return !isNaN(dt)&&dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();});
    var mCost=thisMonth.reduce(function(s,t){return s+(parseFloat(t.totalCost||t.cost||0)||0);},0);
    var aCost=services.reduce(function(s,t){return s+(parseFloat(t.totalCost||t.cost||0)||0);},0);
    return ret('<strong>Maintenance Cost</strong><br>• This month: <strong>'+fmtP(mCost)+'</strong> ('+thisMonth.length+' services)<br>• All time: <strong>'+fmtP(aCost)+'</strong>');
  }
  // Pending
  if(q.includes('pending')){
    var list=services.filter(function(s){return (s.status||'').toLowerCase()==='pending';});
    if(!list.length)return ret('No pending services.');
    var rows=list.map(function(s){return [_ragEsc(s.plate||'—'),_ragEsc(s.mechanicName||s.mechanic||'—'),_ragEsc(s.dateServiced||s.date||'—')];});
    return ret('<strong>Pending ('+list.length+')</strong>'+tbl(['Plate','Mechanic','Date'],rows));
  }
  // Fast moving
  if(q.includes('fast')||q.includes('most used')){
    var counts={};
    issuances.forEach(function(i){var n=i.itemName||i.item||'';if(n)counts[n]=(counts[n]||0)+(parseFloat(i.quantity||i.qty)||0);});
    var sorted=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,8);
    if(!sorted.length)return ret('No issuance data found.');
    var rows=sorted.map(function(k){return [_ragEsc(k),String(counts[k])];});
    return ret('<strong>Fast Moving Items</strong>'+tbl(['Item','Total Issued'],rows));
  }
  // Users
  if(q.includes('user')||q.includes('staff')){
    var adm=users.filter(function(u){return u.role==='admin';}).length,stf=users.filter(function(u){return u.role==='staff';}).length,cus=users.filter(function(u){return u.role==='customer';}).length;
    return ret('<strong>Users ('+users.length+')</strong><br>• Admin: '+adm+'<br>• Staff: '+stf+'<br>• Customer: '+cus);
  }
  // Fallback
  return ret('<strong>AI backend offline</strong> — running in local mode.<br><span style="font-size:11px;color:#718096;">Local mode supports: <em>fleet summary, overdue, due soon, low stock, inventory, materials, cost, pending, fast moving, users</em>.<br>For full natural language queries, start the AI backend (<code>start.bat</code>).</span>');
}

})();
</script>
