<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMS History</title>
    <link rel="icon" type="image/png" href="../static/img/LOGO_AUTOPRO.png" />
    <link rel="stylesheet" href="../static/css/customer_dashboard.css">
    <style>
        .ph-vehicle-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            margin-bottom: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }
        .ph-vehicle-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.14); }
        .ph-vehicle-icon {
            width: 46px; height: 46px;
            background: rgba(232,0,28,0.08);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            color: #E8001C;
        }
        .ph-plate { font-size: 14px; font-weight: 700; color: #1a202c; }
        .ph-desc  { font-size: 11px; color: #718096; margin-top: 2px; }
        .ph-records { font-size: 11px; color: #718096; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        .ph-cost { font-size: 13px; font-weight: 700; color: #1a202c; }
        .ph-cost-label { font-size: 9px; color: #718096; }

        /* History modal */
        .ph-modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 500;
            align-items: flex-end;
            justify-content: center;
        }
        .ph-modal.active { display: flex; }
        .ph-modal-content {
            background: #F7F8FA;
            border-radius: 24px 24px 0 0;
            width: 100%; max-width: 640px;
            max-height: 88vh;
            overflow-y: auto;
            animation: cuSlideUp .25s ease;
        }
        .ph-modal-header {
            background: #E8001C;
            padding: 20px;
            border-radius: 24px 24px 0 0;
            text-align: center;
            position: sticky; top: 0; z-index: 1;
        }
        .ph-modal-close-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .ph-modal-close {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 28px; height: 28px; border-radius: 14px; font-size: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .ph-modal-body { padding: 16px; }
        .ph-record-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .ph-record-header {
            background: #f7f8fa;
            padding: 12px 14px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #f0f4f8;
        }
        .ph-record-body { padding: 14px; }
        .ph-section-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 600;
            margin-bottom: 8px;
        }
        .ph-line-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: #1a202c;
            margin-bottom: 6px;
        }
        .ph-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body data-page="pms">
<script>
// Instant auth guard 璽?珍Ｔ? blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
  }
})();
</script>

<!-- Sidebar (loaded dynamically) -->
<div id="customerSidebar"></div>

<div class="cu-page-shell">
<!-- Header (loaded dynamically) -->
<div id="customerHeader"></div>

<!-- Main -->
<main class="cu-main">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <div style="position:relative;margin-left:auto;min-width:220px;max-width:320px;flex:1;">
            <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input
                id="phSearch"
                type="text"
                placeholder="Search by plate or description..."
                oninput="phFilterVehicles()"
                style="width:100%;padding:8px 30px 8px 30px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:12px;font-family:inherit;color:#1a202c;background:#fff;outline:none;box-sizing:border-box;transition:border-color .2s;"
                onfocus="this.style.borderColor='#E8001C'"
                onblur="this.style.borderColor='#e2e8f0'"
            />
            <button id="phSearchClear" onclick="phClearSearch()" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#a0aec0;padding:2px;line-height:0;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <div id="phVehiclesList"></div>
    <div id="phNoResults" style="display:none;" class="cu-empty">No vehicles match your search.</div>
</main>

<div id="cuToast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../static/js/customer_shared.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyCaoJWbwJk0Xi694ARHpdHhiNjT0SpASRs",
    authDomain: "caltex-autopro-1e664.firebaseapp.com",
    projectId: "caltex-autopro-1e664",
    storageBucket: "caltex-autopro-1e664.firebasestorage.app",
    messagingSenderId: "930140433367",
    appId: "1:930140433367:web:cf67bfa388fa517422b992"
  });

  const stored = sessionStorage.getItem('cpUser');
  if (!stored) { window.location.href = 'login.html'; }
  const cpUser = JSON.parse(stored || '{}');
  const db = firebase.firestore();

  let _userName = '';
  let _allRecords = [];
  let _myVehicles = []; // store for search filtering
  let _vehicleCards = []; // { plate, desc, html } for each vehicle

  // -- Vehicle icon SVG based on type -----------------------
  function vehicleIconSvg(type, size) {
    const t = (type || '').toLowerCase();
    const s = size || 24;
    if (t.includes('truck')) {
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`;
    }
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l2-4h10l2 4h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>`;
  }

  // Show loading immediately
  document.getElementById('phVehiclesList').innerHTML =
    '<div class="cu-empty" style="color:#718096;">Loading...</div>';

  async function init(user) {
    try {
      if (!user) {
        document.getElementById('phVehiclesList').innerHTML =
          '<div class="cu-empty" style="color:#E8001C;">Session expired. <a href="login.html">Please log in again.</a></div>';
        return;
      }

      // Get user name + companyName from Firestore ??always fetch to ensure
      // companyName is resolved (Google sign-in sessions may lack companyName)
      let userName = cpUser.name || '';
      let companyName = cpUser.companyName || '';
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          if (!userName) userName = userDoc.data().name || '';
          companyName = userDoc.data().companyName || companyName;
        }
      } catch(e) { console.warn('UID lookup failed:', e); }
      if (!userName && cpUser.email) {
        try {
          const snap = await db.collection('users').where('email', '==', cpUser.email).limit(1).get();
          if (!snap.empty) {
            if (!userName) userName = snap.docs[0].data().name || '';
            if (!companyName) companyName = snap.docs[0].data().companyName || '';
          }
        } catch(e) { console.warn('Email lookup failed:', e); }
      }

      _userName = userName;
      const initials = _userName.split(' ').filter(Boolean).map(p => p[0]).join('').toUpperCase().slice(0, 2) || 'CU';
      document.getElementById('cuAvatar').textContent = initials;

      // -- Step 2: Load vehicles filtered by owner (name OR company name) --
      const vSnap = await db.collection('vehicles').get();
      const myVehicles = vSnap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(v => {
          const owner = (v.owner || '').toLowerCase();
          return owner === _userName.toLowerCase() ||
                 (companyName && owner === companyName.toLowerCase());
        });



      const el = document.getElementById('phVehiclesList');
      if (!myVehicles.length) {
        el.innerHTML = `<div class="cu-empty">No vehicles registered under your name.</div>`;
        return;
      }

      // -- Step 3: Load completed maintenance records per plate --
      const plates = myVehicles.map(v => v.plate).filter(Boolean);
      if (plates.length) {
        // Firestore 'in' supports max 10 items
        const chunks = [];
        for (let i = 0; i < plates.length; i += 10) chunks.push(plates.slice(i, i + 10));
        const results = await Promise.all(
          chunks.map(chunk =>
            db.collection('maintenance')
              .where('plate', 'in', chunk)
              .where('status', '==', 'Completed')
              .get()
          )
        );
        _allRecords = results.flatMap(s => s.docs.map(d => ({ id: d.id, ...d.data() })));
      }

      // -- Step 4: Render vehicle cards --
      _myVehicles = myVehicles;
      _vehicleCards = myVehicles.map(v => {
        const records = _allRecords.filter(r => r.plate === v.plate);
        const totalCost = records.reduce((sum, r) => {
          const raw = r.cost || r.totalCost || '0';
          const num = typeof raw === 'number' ? raw
            : parseFloat(String(raw).replace(/[^0-9.]/g, '')) || 0;
          return sum + num;
        }, 0);
        const detailsUrl = `pms_history_details.html?plate=${encodeURIComponent(v.plate)}&desc=${encodeURIComponent(v.desc || '—')}&type=${encodeURIComponent(v.type || '')}`;
        return {
          plate: (v.plate || '').toLowerCase(),
          desc:  (v.desc  || '').toLowerCase(),
          html: `
            <div class="ph-vehicle-card" onclick="window.location.href='${detailsUrl}'">
              <div style="flex:1;">
                <div class="ph-plate">${v.plate}</div>
                <div class="ph-desc">${v.desc || '—'}</div>
                <div class="ph-records">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  ${records.length} service record${records.length !== 1 ? 's' : ''}
                </div>
              </div>
              <div style="text-align:right;">
                <div class="ph-cost">&#x20B1;${totalCost.toLocaleString('en-PH', {minimumFractionDigits:2})}</div>
                <div class="ph-cost-label">total spent</div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:6px;"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>`
        };
      });

      el.innerHTML = _vehicleCards.map(c => c.html).join('');

    } catch (err) {
      console.error('PMS History error:', err);
      document.getElementById('phVehiclesList').innerHTML =
        `<div class="cu-empty" style="color:#E8001C;">Error loading data: ${err.message}</div>`;
    }
  }

  // Wait for Firebase Auth, then load data
  firebase.auth().onAuthStateChanged((user) => {
    if (user) init(user);
    else window.location.href = 'login.html';
  });

  // -- Search / filter --------------------------------------
  window.phFilterVehicles = function () {
    const q = (document.getElementById('phSearch').value || '').toLowerCase().trim();
    const clearBtn = document.getElementById('phSearchClear');
    const noResults = document.getElementById('phNoResults');
    const el = document.getElementById('phVehiclesList');

    clearBtn.style.display = q ? 'block' : 'none';

    if (!_vehicleCards.length) return;

    const filtered = q
      ? _vehicleCards.filter(c => c.plate.includes(q) || c.desc.includes(q))
      : _vehicleCards;

    el.innerHTML = filtered.map(c => c.html).join('');
    noResults.style.display = filtered.length === 0 ? 'block' : 'none';
  };

  window.phClearSearch = function () {
    document.getElementById('phSearch').value = '';
    phFilterVehicles();
    document.getElementById('phSearch').focus();
  };

</script>
<script>
  (function() {
    var sess = JSON.parse(sessionStorage.getItem('cpUser') || '{}');
    var name = sess.name || '';
    var parts = name.trim().split(' ').filter(Boolean);
    var ini = parts.length >= 2 ? (parts[0][0]+parts[1][0]).toUpperCase() : (parts[0]?parts[0][0].toUpperCase():'CU');
    fetch('customer_sidebar.html').then(r => r.text()).then(html => {
      document.getElementById('customerSidebar').innerHTML = html;
      if (typeof setGreeting === 'function') setGreeting();
      if (typeof setActiveTab === 'function') setActiveTab();
      if (name) {
        var av = document.getElementById('cuAvatar'); if(av) av.textContent = ini;
        var hn = document.getElementById('cuHeaderName'); if(hn) hn.textContent = name;
      var ge = document.getElementById('cuGreetLine'); if(ge && !ge.textContent) ge.textContent = sess.email || '';
        var mn = document.getElementById('cuAvatarName'); if(mn) mn.textContent = name;
      }
    });
    fetch('customer_header.html').then(r => r.text()).then(html => {
      document.getElementById('customerHeader').innerHTML = html;
    });
  })();
</script>
</div><!-- /.cu-page-shell -->
</body>
</html>
