<script>
// Instant auth guard â€â€ blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login');
  }
})();
</script>

<!-- Add / Edit Item Master Modal -->
<div class="modal" id="addItemMasterModal">
    <div class="modal-content" style="max-width:560px;padding:0;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;max-height:90vh;">
        <!-- Header -->
        <div id="imModalHeader" style="background:linear-gradient(135deg,#E31E24,#C41E3A);padding:1.25rem 1.5rem;display:flex;align-items:center;gap:0.85rem;flex-shrink:0;">
            <div id="imModalIconWrap" style="display:none;"></div>
            <div style="flex:1;">
                <div id="itemMasterModalTitle" style="color:white;font-size:1rem;font-weight:700;">Add Item</div>
            </div>
            <button onclick="closeModal('addItemMasterModal')" style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">&times;</button>
        </div>
        <!-- Form -->
        <form id="addItemMasterForm" style="padding:1.25rem 1.5rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:0.85rem;">
            <input type="hidden" name="itemNum" id="itemMasterItemNum">
            <div class="fl-field">
                <input type="text" name="supplierCode" id="itemMasterSupplierCode" placeholder=" ">
                <label>Supplier Item Code</label>
            </div>
            <div class="fl-field">
                <input type="text" name="oem" id="itemMasterOEM" placeholder=" ">
                <label>OEM</label>
            </div>
            <div class="fl-field">
                <input type="text" name="itemName" required placeholder=" " oninput="imCheckDuplicateName(this)">
                <label>Item Name *</label>
            </div>
            <div class="fl-field">
                <input type="text" name="description" placeholder=" ">
                <label>Description</label>
            </div>
            <div class="fl-field has-value">
                <select name="commodityGroup" id="itemMasterCommodityGroup" onchange="onItemMasterCommodityGroupChange(this)">
                    <option value="">Select group</option>
                </select>
                <label>Commodity Group</label>
            </div>
            <div class="fl-field has-value">
                <select name="uom" id="itemMasterUOM">
                    <option value="">Select UOM</option>
                </select>
                <label>UOM</label>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
                <div class="fl-field">
                    <input type="number" name="cost" step="0.01" min="0" placeholder=" ">
                    <label>Cost (₱)</label>
                </div>
                <div class="fl-field has-value">
                    <select name="itemType" id="itemMasterItemType" required onchange="onItemTypeChange(this.value)">
                        <option value="">Select Type</option>
                        <option value="Material">Material</option>
                        <option value="Service">Service</option>
                    </select>
                    <label>Item Type *</label>
                </div>
            </div>
            <!-- Footer buttons -->
            <div style="display:flex;gap:0.75rem;padding-top:0.5rem;">
                <button type="button" class="btn-secondary" style="flex:1;display:flex;align-items:center;justify-content:center;" onclick="closeModal('addItemMasterModal')">Cancel</button>
                <button type="submit" class="btn-primary" style="flex:1;display:flex;align-items:center;justify-content:center;gap:0.4rem;" id="imSubmitBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

<script>
  // ââ€€ââ€€ Item Master filter ââ€€ââ€€
  window._imFilter = 'all';
  window._imCommodityFilter = '';

  // ââ€€ââ€€ Live duplicate name check on Item Name field ââ€€ââ€€
  // Only blocks duplicate if BOTH name AND uom match an existing item
  window.imCheckDuplicateName = function(input) {
    var val = (input.value || '').trim().toLowerCase();
    var editingNum = (document.getElementById('itemMasterItemNum') || {}).value || '';
    var uomVal = (document.getElementById('itemMasterUOM') || {}).value || '';
    var items = window.itemMaster || [];
    var isDup = val.length > 0 && items.some(function(i) {
      if (editingNum && (i.itemNum || '') === editingNum) return false;
      var sameName = (i.itemName || '').toLowerCase().trim() === val;
      var sameUom  = uomVal === '' || (i.uom || '') === uomVal;
      return sameName && sameUom;
    });
    input.style.borderColor = isDup ? '#E31E24' : '';
    input.style.boxShadow   = isDup ? '0 0 0 3px rgba(227,30,36,0.12)' : '';
  };

  window.imSetFilter = function(filter, btn) {
    window._imFilter = filter;
    document.querySelectorAll('#imFilterPills .dss-pill').forEach(function(b){ b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    if (typeof renderItemMasterList === 'function') renderItemMasterList();
  };

  window.imSetCommodityFilter = function(val) {
    window._imCommodityFilter = val;
    if (typeof renderItemMasterList === 'function') renderItemMasterList();
  };

  // Populate the commodity group header filter dropdown from Firestore
  window._imPopulateCommodityFilterDropdown = function() {
    var sel = document.getElementById('imCommodityFilterDropdown');
    if (!sel) return;
    if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
      setTimeout(window._imPopulateCommodityFilterDropdown, 400);
      return;
    }
    firebase.firestore().collection('domains').doc('commodity_groups').collection('items').orderBy('name').get()
      .then(function(snap) {
        var cgList = snap.docs.map(function(d){ return d.data().name || ''; }).filter(Boolean);
        if (!cgList.length) cgList = ['Lubricants','Spare Parts','Filter','AutoService'];
        sel.innerHTML = '<option value="">All Groups</option>'
          + cgList.map(function(v){ return '<option value="'+v+'">'+v+'</option>'; }).join('');
        // restore current selection
        if (window._imCommodityFilter) sel.value = window._imCommodityFilter;
      })
      .catch(function() {
        // fallback defaults
        ['Lubricants','Spare Parts','Filter','AutoService'].forEach(function(v){
          var o = document.createElement('option'); o.value = v; o.textContent = v;
          sel.appendChild(o);
        });
      });
  };

  document.addEventListener('DOMContentLoaded', function() {
    window._imPopulateCommodityFilterDropdown();
    // Keep select fl-field labels floated when a value is chosen
    document.querySelectorAll('#addItemMasterModal .fl-field select').forEach(function(sel) {
      sel.addEventListener('change', function() {
        var wrap = sel.closest('.fl-field');
        if (wrap) wrap.classList.toggle('has-value', sel.value !== '');
      });
    });
  });

  // Hide/show fields based on type (no SKU for Service)
  window.onItemTypeChange = function(val) {
    // No additional fields to toggle now
  };

  // Auto-open stock level modal after adding a Material item
  window.openAddInventoryModalWithItem = function(item) {
    // Navigate to stock inventory page with the item pre-selected
    window.location.href = '/admin_inventory_stock#add=' + encodeURIComponent(item.itemNum + '|' + item.itemName + '|' + item.commodityGroup + '|' + item.uom + '|' + (item.supplierCode || ''));
  };

  // Update Item Master stat cards from live data
  (function() {
    function updateImStats() {
      // Filter out archived items, matching the Flutter behavior
      const items = (window.itemMaster || []).filter(function(i) { return !i.archived; });
      const total     = items.length;
      const materials = items.filter(function(i) { return (i.itemType || '') === 'Material'; }).length;
      const services  = items.filter(function(i) { return (i.itemType || '') === 'Service';  }).length;
      const t = document.getElementById('imStatTotal');
      const m = document.getElementById('imStatMaterials');
      const s = document.getElementById('imStatServices');
      if (t) t.textContent = total;
      if (m) m.textContent = materials;
      if (s) s.textContent = services;
    }
    // Patch renderItemMasterList to also update stats on every render
    var _origRender = window.renderItemMasterList;
    window.renderItemMasterList = function() {
      if (typeof _origRender === 'function') _origRender();
      updateImStats();
    };
    // Also run once as soon as Firestore data arrives
    document.addEventListener('DOMContentLoaded', function() {
      // If already loaded from cache, run immediately; otherwise poll briefly
      if (window._fbItemMasterLoaded) {
        updateImStats();
      } else {
        var attempts = 0;
        var poll = setInterval(function() {
          attempts++;
          if (window._fbItemMasterLoaded || attempts > 30) {
            clearInterval(poll);
            updateImStats();
          }
        }, 300);
      }
    });
  })();

  // ââ€€ââ€€ Print Item Master ââ€€ââ€€
  window.printItemMaster = function() {
    var items = window.itemMaster || [];

    // Apply same active filters so print matches what's on screen
    var imFilter = window._imFilter || 'all';
    var cgFilter = window._imCommodityFilter || '';
    var searchQ  = ((document.getElementById('itemMasterSearch') || {}).value || '').toLowerCase().trim();

    var filtered = items;
    if (searchQ) {
      filtered = filtered.filter(function(i) {
        return (i.itemName||'').toLowerCase().includes(searchQ) || (i.itemNum||'').toLowerCase().includes(searchQ);
      });
    }
    if (imFilter !== 'all') {
      filtered = filtered.filter(function(i) {
        return (i.itemType||'').toLowerCase() === imFilter.toLowerCase();
      });
    }
    if (cgFilter) {
      filtered = filtered.filter(function(i) {
        return (i.commodityGroup||'') === cgFilter;
      });
    }
    // Sort same as table â€â€ respects active sort selection
    var imSortVal = (document.getElementById('imSortSelect') || {}).value || 'num-asc';
    filtered = filtered.slice().sort(function(a, b) {
      function numPart(s) { return parseInt((s||'').replace(/[^0-9]/g,'')) || 0; }
      function costVal(i) { return parseFloat(String(i.cost||0).replace(/[₱,]/g,'')) || 0; }
      switch (imSortVal) {
        case 'num-asc':   return numPart(a.itemNum) - numPart(b.itemNum);
        case 'num-desc':  return numPart(b.itemNum) - numPart(a.itemNum);
        case 'name-asc':  return (a.itemName||'').localeCompare(b.itemName||'');
        case 'name-desc': return (b.itemName||'').localeCompare(a.itemName||'');
        case 'group-asc': return (a.commodityGroup||'').localeCompare(b.commodityGroup||'');
        case 'cost-desc': return costVal(b) - costVal(a);
        case 'cost-asc':  return costVal(a) - costVal(b);
        default:          return numPart(a.itemNum) - numPart(b.itemNum);
      }
    });

    var matCount = filtered.filter(function(i){ return (i.itemType||'') === 'Material'; }).length;
    var svcCount = filtered.filter(function(i){ return (i.itemType||'') === 'Service'; }).length;

    var rows = filtered.map(function(i) {
      return [
        i.itemNum || 'â€â€',
        i.supplierCode || 'â€â€',
        i.itemName || 'â€â€',
        i.commodityGroup || 'â€â€',
        i.uom || 'â€â€',
        i.itemType || 'â€â€',
        '₱' + (parseFloat(String(i.cost||0).replace(/[₱,]/g,''))||0).toLocaleString('en-PH',{minimumFractionDigits:2})
      ];
    });

    var printTitle = 'Item Master';
    if (imFilter === 'Material') printTitle += ' (Materials)';
    else if (imFilter === 'Service') printTitle += ' (Services)';
    if (cgFilter) printTitle += ' · ' + cgFilter;

    _doPrint(printTitle,
      [{ label:'Total', value:filtered.length, color:'#1a202c' }, { label:'Materials', value:matCount, color:'#E8001C' }, { label:'Services', value:svcCount, color:'#003087' }],
      ['Item No.', 'Supplier Item Code', 'Item Name', 'Commodity Group', 'UOM', 'Type', 'Cost'],
      rows
    );
  };

  // ââ€€ââ€€ Export Item Master to Excel ââ€€ââ€€
  window.exportItemMasterExcel = function() {
    var items = window.itemMaster || [];

    var imFilter = window._imFilter || 'all';
    var cgFilter = window._imCommodityFilter || '';
    var searchQ  = ((document.getElementById('itemMasterSearch') || {}).value || '').toLowerCase().trim();

    var filtered = items;
    if (searchQ) {
      filtered = filtered.filter(function(i) {
        return (i.itemName||'').toLowerCase().includes(searchQ) || (i.itemNum||'').toLowerCase().includes(searchQ);
      });
    }
    if (imFilter !== 'all') {
      filtered = filtered.filter(function(i) {
        return (i.itemType||'').toLowerCase() === imFilter.toLowerCase();
      });
    }
    if (cgFilter) {
      filtered = filtered.filter(function(i) { return (i.commodityGroup||'') === cgFilter; });
    }

    var imSortVal = (document.getElementById('imSortSelect') || {}).value || 'num-asc';
    filtered = filtered.slice().sort(function(a, b) {
      function numPart(s) { return parseInt((s||'').replace(/[^0-9]/g,'')) || 0; }
      function costVal(i) { return parseFloat(String(i.cost||0).replace(/[^0-9.]/g,'')) || 0; }
      switch (imSortVal) {
        case 'num-asc':   return numPart(a.itemNum) - numPart(b.itemNum);
        case 'num-desc':  return numPart(b.itemNum) - numPart(a.itemNum);
        case 'name-asc':  return (a.itemName||'').localeCompare(b.itemName||'');
        case 'name-desc': return (b.itemName||'').localeCompare(a.itemName||'');
        case 'group-asc': return (a.commodityGroup||'').localeCompare(b.commodityGroup||'');
        case 'cost-desc': return costVal(b) - costVal(a);
        case 'cost-asc':  return costVal(a) - costVal(b);
        default:          return numPart(a.itemNum) - numPart(b.itemNum);
      }
    });

    var now = new Date();
    var stamp = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

    var imTitle = 'Item Master';
    if (imFilter === 'Material') imTitle += ' (Materials)';
    else if (imFilter === 'Service') imTitle += ' (Services)';
    if (cgFilter) imTitle += ' · ' + cgFilter;

    var rows = filtered.map(function(i) {
      return [
        i.itemNum || 'â€â€',
        i.supplierCode || 'â€â€',
        i.itemName || 'â€â€',
        i.commodityGroup || 'â€â€',
        i.uom || 'â€â€',
        i.itemType || 'â€â€',
        (parseFloat(String(i.cost||0).replace(/[^0-9.]/g,''))||0)
      ];
    });

    _downloadExcel(
      'Item_Master_' + stamp + '.xlsx',
      imTitle,
      ['Item No.', 'Supplier Item Code', 'Item Name', 'Commodity Group', 'UOM', 'Item Type', 'Cost'],
      rows,
      null,
      { textColIndexes: [0, 1] }
    );
  };

  // ââ€€ââ€€ Generate & Show Barcode from view modal ââ€€ââ€€
  window._imCurrentViewItem = null; // set by viewItemMasterDetails

  window.imGenerateAndShowBarcode = function() {
    var item = window._imCurrentViewItem;
    if (!item) return;
    var existingBarcode = item.barcode || '';
    if (existingBarcode) {
      _imShowScanCodeModal(item.itemName, item.uom || '', existingBarcode, 'barcode', item.supplierCode || item.itemNum || '');
      return;
    }
    var digits = [];
    for (var i = 0; i < 12; i++) digits.push(Math.floor(Math.random() * 10));
    var sum = 0;
    for (var j = 0; j < 12; j++) sum += digits[j] * (j % 2 === 0 ? 1 : 3);
    digits.push((10 - (sum % 10)) % 10);
    var barcodeVal = digits.join('');
    var fbItem = (window._fbItemMaster || []).find(function(i){ return i.num === item.itemNum; });
    if (fbItem && fbItem._id) {
      firebase.firestore().collection('item_master').doc(fbItem._id).update({ barcode: barcodeVal })
        .catch(function(e) { console.warn('Save error:', e); });
      item.barcode = barcodeVal;
      fbItem.barcode = barcodeVal;
    }
    _imShowScanCodeModal(item.itemName, item.uom || '', barcodeVal, 'barcode', item.supplierCode || item.itemNum || '');
  };

  window.imGenerateAndShowQR = function() {
    var item = window._imCurrentViewItem;
    if (!item) return;
    var existingQr = item.qrcode || '';
    if (existingQr) {
      _imShowScanCodeModal(item.itemName, item.uom || '', existingQr, 'qr', item.supplierCode || item.itemNum || '');
      return;
    }
    var qrVal = 'QR-' + (item.supplierCode || item.itemNum || '').toUpperCase();
    var fbItem2 = (window._fbItemMaster || []).find(function(i){ return i.num === item.itemNum; });
    if (fbItem2 && fbItem2._id) {
      firebase.firestore().collection('item_master').doc(fbItem2._id).update({ qr: qrVal })
        .catch(function(e) { console.warn('Save error:', e); });
      item.qrcode = qrVal;
      fbItem2.qr = qrVal;
    }
    _imShowScanCodeModal(item.itemName, item.uom || '', qrVal, 'qr', item.supplierCode || item.itemNum || '');
  };

  function _imShowScanCodeModal(title, subtitle, value, type, codeLabel) {
    var labelBelow = codeLabel || subtitle;
    document.getElementById('imScanCodeTitle').textContent = title;
    document.getElementById('imScanCodeSubtitle').textContent = subtitle;
    document.getElementById('imScanCodeValue').textContent = labelBelow;
    document.getElementById('imScanCodeBarcodeSvg').style.display = 'none';
    document.getElementById('imScanCodeQrDiv').innerHTML = '';

    if (type === 'barcode') {
      var svg = document.getElementById('imScanCodeBarcodeSvg');
      svg.innerHTML = '';
      svg.removeAttribute('width'); svg.removeAttribute('height'); svg.removeAttribute('viewBox');
      if (typeof JsBarcode !== 'undefined') {
        try {
          JsBarcode(svg, value, { format: 'CODE128', width: 1.5, height: 80, displayValue: false, margin: 8, background: '#ffffff', lineColor: '#000000' });
          // Override JsBarcode's fixed pixel width so the SVG scales to fit its container
          svg.setAttribute('width', '100%');
          svg.style.maxWidth = '100%';
          svg.style.display = 'block';
        } catch(e) { svg.style.display = 'none'; }
      }
      // Show supplier item code below the barcode image
      var valEl = document.getElementById('imScanCodeValue');
      if (valEl) { valEl.textContent = labelBelow; valEl.style.display = 'block'; }
    } else {
      var qrDiv = document.getElementById('imScanCodeQrDiv');
      if (typeof QRCode !== 'undefined') {
        try {
          new QRCode(qrDiv, { text: value, width: 180, height: 180, colorDark: '#1a202c', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
        } catch(e) { qrDiv.textContent = value; }
      }
      // Show supplier code below the QR image
      var valEl = document.getElementById('imScanCodeValue');
      if (valEl) {
        // labelBelow already set at top of function
        valEl.style.display = 'block';
      }
    }
    document.getElementById('imScanCodeModal').classList.add('active');
  }

  window.imPrintScanCode = function() {
    var title = document.getElementById('imScanCodeTitle').textContent;
    var subtitle = document.getElementById('imScanCodeSubtitle').textContent;
    var svg = document.getElementById('imScanCodeBarcodeSvg');
    var qrDiv = document.getElementById('imScanCodeQrDiv');

    // Build print-only div
    var existing = document.getElementById('_imPrintOverlay');
    if (existing) existing.remove();
    var styleEl = document.getElementById('_imPrintStyle');
    if (styleEl) styleEl.remove();

    var barcodeNumEl = document.getElementById('imScanCodeValue');
    var barcodeNum = (barcodeNumEl && barcodeNumEl.style.display !== 'none') ? barcodeNumEl.textContent.trim() : '';

    var div = document.createElement('div');
    div.id = '_imPrintOverlay';
    div.style.cssText = 'display:none;';
    div.innerHTML =
      '<div style="text-align:center;padding:2rem;font-family:sans-serif;">'
      + '<div style="font-size:1rem;font-weight:700;color:#1a202c;margin-bottom:0.15rem;">' + title + '</div>'
      + (subtitle ? '<div style="font-size:0.78rem;color:#718096;margin-bottom:1rem;">' + subtitle + '</div>' : '')
      + (svg && svg.style.display !== 'none' ? svg.outerHTML : '')
      + (barcodeNum ? '<div style="font-family:monospace;font-size:0.9rem;font-weight:600;letter-spacing:0.15em;color:#1a202c;margin-top:0.4rem;">' + barcodeNum + '</div>' : '')
      + (qrDiv && qrDiv.innerHTML ? '<div style="display:flex;justify-content:center;margin-top:0.5rem;">' + qrDiv.innerHTML + '</div>' : '')
      + '</div>';

    var style = document.createElement('style');
    style.id = '_imPrintStyle';
    style.textContent = '@media print { body > *:not(#_imPrintOverlay) { display:none !important; } #_imPrintOverlay { display:block !important; } }';

    document.head.appendChild(style);
    document.body.appendChild(div);

    window.print();

    setTimeout(function() {
      var s = document.getElementById('_imPrintStyle');
      var d = document.getElementById('_imPrintOverlay');
      if (s) s.remove();
      if (d) d.remove();
    }, 500);
  };
</script>

<script>
// ── Item Master cache restore — runs after all scripts so renderItemMasterList is defined ──
(function() {
  try {
    var uid = (JSON.parse(sessionStorage.getItem('apUser') || '{}')).uid || '';
    if (!uid) return;
    var raw = sessionStorage.getItem('imCache_' + uid);
    if (!raw) return;
    var items = JSON.parse(raw);
    if (!Array.isArray(items) || !items.length) return;

    // Only restore if Firestore hasn't already loaded (avoids double render)
    if (window._fbItemMasterLoaded && (window.itemMaster || []).length > 0) return;

    window.itemMaster = items;
    window._fbItemMaster = items.map(function(i) {
      return {
        _id: i.id, num: i.itemNum, supplierCode: i.supplierCode || '',
        oem: i.oem || '', name: i.itemName, desc: i.description || '',
        group: i.commodityGroup, uom: i.uom, cost: i.cost, type: i.itemType,
        barcode: i.barcode || '', qr: i.qrcode || '', archived: i.archived || false,
        avgMonthlyIssuance: i.avgMonthlyIssuance || 0,
        lastMonthIssuance:  i.lastMonthIssuance  || 0,
      };
    });
    window._fbItemMasterLoaded = true;

    // renderItemMasterList is already defined here — call it directly
    if (typeof renderItemMasterList === 'function') renderItemMasterList();
  } catch(e) {}
})();
</script>
