<script>
// Instant auth guard — blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
  }
})();
</script>

<script>
  // Patch renderAssetsList to also update vehicle stat cards and apply sort
  (function() {
    function updateVehStats() {
      var assets = window.assets || [];
      var s = function(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; };
      s('vehStatTotal', assets.length);
      s('vehStatCars',  assets.filter(function(a){ return (a.type||'').toLowerCase() === 'car'; }).length);
      s('vehStatTrucks', assets.filter(function(a){ return (a.type||'').toLowerCase() === 'truck'; }).length);
    }

    function _calcNextPmsDate(asset) {
      var lastSvc = asset.lastServiceDate || asset.lastSvcDate || '';
      var freq    = parseInt(asset.svcFreq || asset.serviceFrequency) || 0;
      if (!lastSvc || !freq) return null;
      var d = new Date(lastSvc);
      if (isNaN(d.getTime())) return null;
      d.setMonth(d.getMonth() + freq);
      return d;
    }

    function applySortToAssets() {
      var sortEl = document.getElementById('vehSortSelect');
      if (!sortEl) return;
      var val = sortEl.value;
      var assets = window.assets;
      if (!assets) return;
      assets.sort(function(a, b) {
        switch (val) {
          case 'plate-asc':
            return (a.plateNumber||a.plate||'').localeCompare(b.plateNumber||b.plate||'');
          case 'plate-desc':
            return (b.plateNumber||b.plate||'').localeCompare(a.plateNumber||a.plate||'');
          case 'owner-asc':
            return (a.owner||'').localeCompare(b.owner||'');
          case 'owner-desc':
            return (b.owner||'').localeCompare(a.owner||'');
          case 'pms-asc': {
            var da = _calcNextPmsDate(a), db2 = _calcNextPmsDate(b);
            if (!da && !db2) return 0;
            if (!da) return 1; if (!db2) return -1;
            return da - db2;
          }
          case 'pms-desc': {
            var da = _calcNextPmsDate(a), db2 = _calcNextPmsDate(b);
            if (!da && !db2) return 0;
            if (!da) return 1; if (!db2) return -1;
            return db2 - da;
          }
          case 'odo-desc':
            return (parseInt(b.odometer)||0) - (parseInt(a.odometer)||0);
          case 'odo-asc':
            return (parseInt(a.odometer)||0) - (parseInt(b.odometer)||0);
          default:
            return 0;
        }
      });
    }

    var _orig = window.renderAssetsList;
    window.renderAssetsList = function() {
      applySortToAssets();
      if (typeof _orig === 'function') _orig();
      updateVehStats();
    };
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(updateVehStats, 1500);
    });
  })();

  // ── Vehicle type filter (from stat cards) ──
  window._vehTypeFilter = 'all';
  window.vehTypeFilter = function(type) {
    window._vehTypeFilter = type;
    if (typeof renderAssetsList === 'function') renderAssetsList();
  };

  // ── Just Serviced checkbox ──────────────────────────────
  function onJustServicedToggle(cb) {
    var section = document.getElementById('lastServiceSection');
    var lsdInput = document.getElementById('lastServiceDateInput');
    var lsoInput = document.getElementById('lastServiceOdoInput');
    if (cb.checked) {
      if (section) section.style.display = 'grid';
      var todayStr = new Date().toISOString().split('T')[0];
      if (lsdInput) { lsdInput.value = todayStr; lsdInput.max = todayStr; }
    } else {
      if (section) section.style.display = 'none';
      if (lsdInput) lsdInput.value = '';
      if (lsoInput) lsoInput.value = '';
    }
  }

  function onOdometerInput() {
    // No longer auto-sync to last service odometer — they are independent fields
  }

  // ── Vehicle modal functions ──
  var _editingVehicleId = null;

  function _vehDetailRow(label, value) {
    return '<div style="display:flex;padding:0.5rem 0;border-bottom:1px solid #f7fafc;">'
      + '<span style="width:150px;flex-shrink:0;font-size:0.78rem;color:#718096;font-weight:500;">' + label + '</span>'
      + '<span style="font-size:0.85rem;font-weight:600;color:#1a202c;flex:1;">' + (value || '—') + '</span>'
      + '</div>';
  }

  function _calcNextPms(lastSvcDate, svcFreq) {
    if (!lastSvcDate || !svcFreq) return '—';
    var date = new Date(lastSvcDate);
    var months = parseInt(svcFreq);
    if (isNaN(date.getTime()) || isNaN(months)) return '—';
    date.setMonth(date.getMonth() + months);
    return date.toISOString().split('T')[0];
  }

  function viewAssetDetails(assetNum) {
    var assets = window.assets || [];
    var asset = assets.find(function(a){ return a.assetNum === assetNum || a.plateNumber === assetNum; });
    if (!asset) return;

    document.getElementById('adPlate').textContent = asset.plateNumber || asset.plate || '—';
    document.getElementById('adAssetDesc').textContent = asset.assetDescription || asset.desc || asset.type || '—';

    var nextPms = _calcNextPms(asset.lastServiceDate || asset.lastSvcDate, asset.serviceFrequency || asset.svcFreq);
    var statusColors = { 'active':'#38a169','Active':'#38a169','maintenance':'#d69e2e','Under Maintenance':'#d69e2e','completed':'#003087','Completed':'#003087','inactive':'#718096','Overdue':'#e53e3e','PMS Due Soon':'#d69e2e' };
    var sc = statusColors[asset.status] || '#718096';

    var lastSvcOdoVal = asset.lastSvcOdo || asset.lastServiceOdometer || '';
    var lastSvcDateVal = asset.lastServiceDate || asset.lastSvcDate || '';

    // KM Since Last Service
    var kmSinceVal = '—';
    var lastOdoNum = parseInt(String(lastSvcOdoVal).replace(/[^0-9]/g, '')) || 0;
    if (asset.odometer > 0 && lastOdoNum > 0 && asset.odometer >= lastOdoNum) {
      kmSinceVal = (asset.odometer - lastOdoNum).toLocaleString() + ' km';
    }

    function _fmtDate(d) {
      if (!d) return '—';
      var dt = new Date(d + 'T00:00:00'); // force local time, avoid UTC shift
      if (isNaN(dt.getTime())) return d;
      return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    document.getElementById('adDetailRows').innerHTML =
      _vehDetailRow('Plate Number', asset.plateNumber || asset.plate)
      + _vehDetailRow('Description', asset.assetDescription || asset.desc)
      + _vehDetailRow('Vehicle Type', asset.type)
      + _vehDetailRow('Owner', asset.owner)
      + _vehDetailRow('Current Odometer', asset.odometer ? asset.odometer.toLocaleString() + ' km' : (asset.odo || '—'))
      + _vehDetailRow('Last Service Date', _fmtDate(lastSvcDateVal))
      + _vehDetailRow('Last Service Odometer', lastSvcOdoVal ? Number(lastSvcOdoVal).toLocaleString() + ' km' : '—')
      + _vehDetailRow('KM Since Last Service', kmSinceVal)
      + _vehDetailRow('Next PMS Due', _fmtDate(nextPms))
      + _vehDetailRow('Service Frequency', (asset.svcFreq || asset.serviceFrequency) ? (asset.svcFreq || asset.serviceFrequency) + ' month(s)' : '—');

    document.getElementById('adEditBtn').onclick = function() {
      closeModal('assetDetailsModal');
      editAsset(assetNum);
    };
    document.getElementById('assetDetailsModal').classList.add('active');
  }

  function openAddAssetModal() {
    _editingVehicleId = null;
    document.getElementById('assetModalTitle').textContent = 'Add Vehicle';
    document.getElementById('assetSubmitBtn').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save';
    document.getElementById('addAssetForm').reset();
    var todayStr = new Date().toISOString().split('T')[0];
    var lsdInput = document.getElementById('lastServiceDateInput');
    if (lsdInput) lsdInput.max = todayStr;
    var cb = document.getElementById('justServicedCheck');
    if (cb) { cb.checked = false; cb.disabled = false; }
    var section = document.getElementById('lastServiceSection');
    if (section) section.style.display = 'none';
    // Reset last service fields to editable state for Add mode
    var lsdInput = document.getElementById('lastServiceDateInput');
    var lsoInput = document.getElementById('lastServiceOdoInput');
    if (lsdInput) { lsdInput.readOnly = false; lsdInput.style.background = ''; lsdInput.style.color = ''; lsdInput.style.cursor = ''; }
    if (lsoInput) { lsoInput.readOnly = false; lsoInput.style.background = ''; lsoInput.style.color = ''; lsoInput.style.cursor = ''; }
    populateVehicleTypeDropdown('assetTypeSelect', '');
    document.getElementById('addAssetModal').classList.add('active');
  }

  function editAsset(assetNum) {
    var assets = window.assets || [];
    var asset = assets.find(function(a){ return a.assetNum === assetNum || a.plateNumber === assetNum; });
    if (!asset) return;
    _editingVehicleId = asset.id;
    document.getElementById('assetModalTitle').textContent = 'Edit Vehicle';
    document.getElementById('assetSubmitBtn').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Update';
    var form = document.getElementById('addAssetForm');
    form.elements.plateNumber.value = asset.plateNumber || asset.plate || '';
    form.elements.assetDescription.value = asset.assetDescription || asset.desc || '';
    form.elements.ownerName.value = asset.owner || '';
    var ownerInput = document.getElementById('ownerNameInput');
    if (ownerInput) ownerInput.value = asset.owner || '';
    form.elements.currentOdometer.value = asset.odometer ? String(asset.odometer).replace(/[^0-9]/g, '') : '';
    form.elements.serviceFrequency.value = asset.svcFreq || asset.serviceFrequency || '';
    form.elements.lastServiceDate.value = asset.lastServiceDate || asset.lastSvcDate || '';
    form.elements.lastServiceOdometer.value = asset.lastSvcOdo || asset.lastServiceOdometer || '';
    var todayStr = new Date().toISOString().split('T')[0];
    var lsdInput = document.getElementById('lastServiceDateInput');
    if (lsdInput) lsdInput.max = todayStr;
    // If existing service data — pre-check the box and show the section
    var hasServiceData = !!(asset.lastServiceDate || asset.lastSvcDate || asset.lastSvcOdo || asset.lastServiceOdometer);
    var cb = document.getElementById('justServicedCheck');
    var section = document.getElementById('lastServiceSection');
    var lsdInput = document.getElementById('lastServiceDateInput');
    var lsoInput = document.getElementById('lastServiceOdoInput');
    if (cb) { cb.checked = hasServiceData; cb.disabled = true; }
    if (section) section.style.display = hasServiceData ? 'grid' : 'none';
    // Make last service fields read-only when editing
    if (lsdInput) { lsdInput.readOnly = true; lsdInput.style.background = '#f7fafc'; lsdInput.style.color = '#718096'; lsdInput.style.cursor = 'not-allowed'; }
    if (lsoInput) { lsoInput.readOnly = true; lsoInput.style.background = '#f7fafc'; lsoInput.style.color = '#718096'; lsoInput.style.cursor = 'not-allowed'; }
    populateVehicleTypeDropdown('assetTypeSelect', asset.type || '');
    document.getElementById('addAssetModal').classList.add('active');
  }

  function deleteAsset(assetNum) {
    var assets = window.assets || [];
    var asset = assets.find(function(a){ return a.assetNum === assetNum || a.plateNumber === assetNum; });
    if (!asset) return;
    if (!confirm('Delete "' + (asset.plateNumber || asset.plate) + '"? This cannot be undone.')) return;
    var docId = asset.id;
    firebase.firestore().collection('vehicles').doc(docId).delete()
      .then(function() { showToast('Vehicle deleted successfully!', 'error'); })
      .catch(function(err) { showToast('Delete failed: ' + err.message, 'error'); });
  }

  document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('addAssetForm');
    // Keep select fl-field label floated when value is chosen
    document.querySelectorAll('#addAssetModal .fl-field select').forEach(function(sel) {
      sel.addEventListener('change', function() {
        var wrap = sel.closest('.fl-field');
        if (wrap) wrap.classList.toggle('has-value', sel.value !== '');
      });
    });
    if (!form) return;
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var plate = form.elements.plateNumber.value.trim().toUpperCase();
      if (!plate) return;
      var lastSvcDate = form.elements.lastServiceDate.value || '';
      var lastSvcOdo  = form.elements.lastServiceOdometer.value ? parseInt(form.elements.lastServiceOdometer.value) : null;      var svcFreq = form.elements.serviceFrequency.value;
      var ownerName = form.elements.ownerName.value.trim();
      var data = {
        plate: plate,
        desc: form.elements.assetDescription.value.trim(),
        type: form.elements.assetType.value,
        owner: ownerName,
        odo: form.elements.currentOdometer.value ? form.elements.currentOdometer.value + ' km' : '',
        lastSvcDate: lastSvcDate,
        lastServiceDate: lastSvcDate,
        lastSvcOdo: lastSvcOdo !== null ? lastSvcOdo : '',
        lastServiceOdometer: lastSvcOdo !== null ? lastSvcOdo : '',
        svcFreq: svcFreq,
      };
      // Also keep legacy fields for compatibility
      data.plateNumber = data.plate;
      data.assetDescription = data.desc;
      data.odometer = parseInt(form.elements.currentOdometer.value) || 0;
      data.serviceFrequency = parseInt(svcFreq) || null;
      if (lastSvcDate && svcFreq) {
        var d = new Date(lastSvcDate);
        d.setMonth(d.getMonth() + parseInt(svcFreq));
        data.nextPMSDue = d.toISOString().split('T')[0];
      }

      var db = firebase.firestore();

      // Resolve ownerId from owner name so PMS notifications can target the customer
      function _saveVehicle(extraData) {
        var finalData = Object.assign({}, data, extraData || {});
        if (_editingVehicleId) {
          var vBtn = document.getElementById('assetSubmitBtn');
          if (vBtn) { vBtn.disabled = true; vBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.49"/></svg> Updating…'; }
          db.collection('vehicles').doc(_editingVehicleId).update(finalData)
            .then(function() { closeModal('addAssetModal'); showToast('Vehicle updated successfully!', 'success'); })
            .catch(function(err) { showToast('Update failed: ' + err.message, 'error'); })
            .finally(function() { if (vBtn) { vBtn.disabled = false; vBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Update'; } });
        } else {
          var vBtn2 = document.getElementById('assetSubmitBtn');
          db.collection('vehicles').where('plate', '==', plate).limit(1).get().then(function(snap) {
            if (!snap.empty) { showToast('A vehicle with this plate already exists.', 'error'); return; }
            if (vBtn2) { vBtn2.disabled = true; vBtn2.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.49"/></svg> Saving…'; }
            finalData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            finalData.status = 'Active';
            return db.collection('vehicles').add(finalData);
          }).then(function(ref) {
            if (ref) { closeModal('addAssetModal'); showToast('Vehicle added successfully!', 'success'); }
          }).catch(function(err) { showToast('Save failed: ' + err.message, 'error'); })
          .finally(function() { if (vBtn2) { vBtn2.disabled = false; vBtn2.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save'; } });
        }
      }

      // Look up customer UID by name and attach as ownerId
      if (ownerName) {
        db.collection('users')
          .where('name', '==', ownerName)
          .where('role', '==', 'customer')
          .limit(1).get()
          .then(function(snap) {
            var ownerId = snap.empty ? '' : snap.docs[0].id;
            _saveVehicle({ ownerId: ownerId });
          })
          .catch(function() { _saveVehicle({}); });
      } else {
        _saveVehicle({});
      }
    });
  });

  // ── Owner name autocomplete (customers only) ─────────────
  var _ownerNames = [];
  var _ownerNamesLoaded = false;

  function _loadOwnerNames() {
    if (_ownerNamesLoaded) return Promise.resolve();
    return firebase.firestore().collection('users')
      .where('role', '==', 'customer').get()
      .then(function(snap) {
        _ownerNames = snap.docs
          .map(function(d) { return d.data().name || ''; })
          .filter(function(n) { return n.trim() !== ''; })
          .sort();
        _ownerNamesLoaded = true;
      }).catch(function() {});
  }

  function ownerNameLookup(input) {
    var q = input.value.trim().toLowerCase();
    var suggestions = document.getElementById('ownerNameSuggestions');
    if (!q) { suggestions.style.display = 'none'; return; }

    _loadOwnerNames().then(function() {
      var matches = _ownerNames.filter(function(n) {
        return n.toLowerCase().includes(q);
      });
      if (matches.length === 0) { suggestions.style.display = 'none'; return; }
      suggestions.innerHTML = matches.map(function(name) {
        return '<div style="padding:0.6rem 0.85rem;cursor:pointer;border-bottom:1px solid #f0f4f8;display:flex;align-items:center;gap:0.6rem;font-size:0.85rem;" '
          + 'onmousedown="event.preventDefault();ownerNameSelect(\'' + name.replace(/'/g, "\\'") + '\');">'
          + '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#003087" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
          + '<span style="font-weight:600;color:#1a202c;">' + name + '</span>'
          + '</div>';
      }).join('');
      suggestions.style.display = 'block';
    });
  }

  function ownerNameSelect(name) {
    var input = document.getElementById('ownerNameInput');
    if (input) input.value = name;
    document.getElementById('ownerNameSuggestions').style.display = 'none';
  }

  // Close suggestions on outside click
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#ownerNameInput') && !e.target.closest('#ownerNameSuggestions')) {
      var s = document.getElementById('ownerNameSuggestions');
      if (s) s.style.display = 'none';
    }
  });

  // Pre-load owner names when modal opens
  var _origOpenAddAssetModal = window.openAddAssetModal;
  window.openAddAssetModal = function() {
    _loadOwnerNames();
    if (typeof _origOpenAddAssetModal === 'function') _origOpenAddAssetModal();
  };

  // ── Plate number formatter: AAA 1234 ─────────────────────
  function formatPlateNumber(input) {
    // Store cursor position before we mess with the value
    var raw = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    var letters = raw.replace(/[^A-Z]/g, '').substring(0, 3);
    var digits  = raw.replace(/[^0-9]/g, '').substring(0, 4);
    var result = letters + (digits.length > 0 ? ' ' + digits : (letters.length === 3 && input._addSpace ? ' ' : ''));
    input.value = result;
    input._addSpace = false;
  }

  function filterPlateKey(e, input) {
    var key = e.key;
    // Always allow: backspace, delete, tab, arrows, home, end, ctrl+A/C/V/X
    if (key.length > 1 || e.ctrlKey || e.metaKey) return true;
    var raw = input.value.replace(/[^A-Z0-9]/gi, '');
    var letters = raw.replace(/[^A-Z]/gi, '').length;
    var digits  = raw.replace(/[^0-9]/g, '').length;
    if (letters < 3 && /[a-zA-Z]/.test(key)) {
      // If this will complete the 3 letters, flag to add space
      if (letters === 2) input._addSpace = true;
      return true;
    }
    if (letters >= 3 && digits < 4 && /[0-9]/.test(key)) return true;
    e.preventDefault(); return false;
  }
</script>
</html>
