<script>
// Instant auth guard aa? blocks bfcache back-navigation after logout
(function() {
  var logoutTime = localStorage.getItem('_loggedOut');
  var loginTime  = localStorage.getItem('_loggedIn');
  // If logged out more recently than logged in, block access
  if (logoutTime && (!loginTime || parseInt(logoutTime) > parseInt(loginTime))) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
    return;
  }
  var hasSession = sessionStorage.getItem('apUser') ||
                   sessionStorage.getItem('spUser') ||
                   sessionStorage.getItem('cpUser');
  if (!hasSession) {
    document.documentElement.style.display = 'none';
    window.location.replace('/login.html');
  }
})();
</script>

<script>
// aa?aa? Load header aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?
// ww Load sidebar + header

      var ge = document.getElementById('cuGreetLine'); if(ge && !ge.textContent) ge.textContent = sess.email || '';
      var mn = document.getElementById('cuAvatarName'); if(mn) mn.textContent = name;

// aa?aa? Helpers aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?aa?
var _MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function _formatDate(s) {
  if (!s) return 'aa?';
  var p = s.split('-');
  if (p.length !== 3) return s;
  var y=parseInt(p[0]), m=parseInt(p[1])-1, d=parseInt(p[2]);
  if (isNaN(y)||isNaN(m)||isNaN(d)) return s;
  return _MONTHS[m] + ' ' + d + ', ' + y;
}
function _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Booking store ─────────────────────────────────────────────
var _bookings = {};
var _allDocs  = [];
var _mbFilter = 'all';

// ── Cache key for this user's bookings ────────────────────────
var _MB_CACHE_KEY = 'mbBookingsCache_';

// ── Restore from sessionStorage cache so data shows instantly ─
// Called before the Firestore listener fires.
function _mbRestoreCache(uid) {
  try {
    var raw = sessionStorage.getItem(_MB_CACHE_KEY + uid);
    if (!raw) return false;
    var cached = JSON.parse(raw);
    if (!cached || !cached.length) return false;
    // Build _allDocs as plain objects with a .data() shim
    _allDocs = cached.map(function(item) {
      return { id: item.id, _d: item.data, data: function(){ return this._d; } };
    });
    _allDocs.forEach(function(doc) { _bookings[doc.id] = doc.data(); });
    // Rebuild stat counts from cache
    var cntApproved = 0, cntResched = 0, cntCancelled = 0;
    _allDocs.forEach(function(doc) {
      var d = doc.data();
      var status = (d.status || '').toLowerCase();
      var isResched = d.previousDate && d.previousDate !== d.preferredDate;
      if (status === 'cancelled') cntCancelled++;
      else if (status === 'approved' && isResched) cntResched++;
      else if (status === 'approved') cntApproved++;
    });
    function _s(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
    _s('mbCntApproved', cntApproved);
    _s('mbCntRescheduled', cntResched);
    _s('mbCntCancelled', cntCancelled);
    var statsEl = document.getElementById('mbStats');
    if (statsEl) statsEl.style.display = _allDocs.length > 0 ? 'grid' : 'none';
    var tabBar = document.getElementById('mbTabBar');
    if (tabBar) tabBar.style.display = 'flex';
    _mbRender();
    return true;
  } catch(e) { return false; }
}

// ── Persist snapshot to sessionStorage ───────────────────────
function _mbSaveCache(uid, docs) {
  try {
    var toSave = docs.map(function(doc) {
      return { id: doc.id, data: doc.data() };
    });
    sessionStorage.setItem(_MB_CACHE_KEY + uid, JSON.stringify(toSave));
  } catch(e) {}
}

// ── Pagination state ──────────────────────────────────────────
var _mbPage = 1;
var _MB_PER_PAGE = 10;

function _mbGoPage(page) {
  _mbPage = page;
  _mbRender();
}

window.mbSetFilter = function(filter) {
  _mbFilter = filter;
  _mbPage   = 1; // reset to first page on filter change
  // Update stat cards
  ['approved','rescheduled','cancelled'].forEach(function(f) {
    var card = document.getElementById('mbStat_' + f);
    if (card) card.classList.toggle('active', f === filter);
  });
  // Update pills
  ['all','approved','rescheduled','cancelled'].forEach(function(f) {
    var btn = document.getElementById('mbTab_' + f);
    if (btn) btn.classList.toggle('active', f === filter);
  });
  _mbRender();
};

function _mbRender() {
  var list = document.getElementById('mbList');

  var filtered = _allDocs.filter(function(doc) {
    var d = doc.data();
    var status = (d.status || '').toLowerCase();
    var isRescheduled = d.previousDate && d.previousDate !== d.preferredDate;
    switch (_mbFilter) {
      case 'approved':    return status === 'approved' && !isRescheduled;
      case 'rescheduled': return status === 'approved' && isRescheduled;
      case 'cancelled':   return status === 'cancelled';
      default:            return true;
    }
  });

  if (filtered.length === 0) {
    var emptyMsg = _mbFilter === 'all' ? 'No bookings yet.'
      : 'No ' + _mbFilter + ' bookings.';
    list.innerHTML = '<div style="text-align:center;padding:80px 20px;">'
      + '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
      + '<p style="font-size:14px;color:#718096;margin:12px 0;">' + emptyMsg + '</p>'
      + (_mbFilter === 'all' ? '<a href="customer_book_service.html" style="color:#E8001C;font-weight:600;text-decoration:none;">Book a Service →</a>' : '')
      + '</div>';
    return;
  }

  // Build row HTML strings array
  var rows = [];
  filtered.forEach(function(doc) {
    var d  = doc.data();
    var id = doc.id;
    _bookings[id] = d;

    var status        = (d.status || 'Approved').toLowerCase();
    var isRescheduled = d.previousDate && d.previousDate !== d.preferredDate;
    var badgeClass, badgeLabel;
    if (isRescheduled && status === 'approved') {
      badgeClass = 'rescheduled'; badgeLabel = 'Rescheduled';
    } else if (status === 'approved') {
      badgeClass = 'approved';    badgeLabel = 'Approved';
    } else if (status === 'completed') {
      badgeClass = 'completed';   badgeLabel = 'Completed';
    } else if (status === 'pending') {
      badgeClass = 'pending';     badgeLabel = 'Pending';
    } else {
      badgeClass = 'cancelled';   badgeLabel = 'Cancelled';
    }

    var services = (d.services || []).join(', ') || '—';

    rows.push('<tr onclick="mbOpenModal(\'' + id + '\')">'
      + '<td class="mb-td">'

// ── Auto-cancel expired bookings ─────────────────────────────────────────
// Runs on each snapshot. Cancels Approved/Pending bookings that were never
// started (status never moved to 'Under Maintenance') when:
//   • preferredDate is before today, OR
//   • preferredDate is today AND current time is past 5:00 PM
// Notifies the customer, admin, and staff for each auto-cancel.
function _mbAutoCancelExpired(docs, db) {
  var now         = new Date();
  var currentHour = now.getHours(); // 17 = 5 PM
  var todayKey    = now.getFullYear() + '-'
    + String(now.getMonth() + 1).padStart(2, '0') + '-'
    + String(now.getDate()).padStart(2, '0');

  docs.forEach(function(doc) {
    var d      = doc.data();
    var status = (d.status || '').toLowerCase();
    if (status !== 'approved' && status !== 'pending') return;
    if (!d.preferredDate) return;

    var isPastDate = d.preferredDate < todayKey;
    var isToday    = d.preferredDate === todayKey;
    var isPast5PM  = isToday && currentHour >= 17;

    if (!isPastDate && !isPast5PM) return;

    var cancelReason = isPastDate
      ? 'No-show / Service date passed'
      : 'No-show / Service not started by 5:00 PM';

    db.collection('service_bookings').doc(doc.id).update({
      status: 'Cancelled',
      cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
      cancelledBy: 'system',
      cancellationReason: cancelReason,
    }).then(function() {
      var plate     = d.plate || '';
      var dateLabel = _formatDate(d.preferredDate);
      var timeLabel = d.preferredTime ? ' at ' + d.preferredTime : '';
      var custName  = d.customerName || 'Customer';

      // ── Notify customer ──
      if (d.customerId) {
        db.collection('notifications').add({
          title: '❌ Booking Auto-Cancelled',
          message: 'Your booking for ' + plate + ' on ' + dateLabel + timeLabel
            + ' was automatically cancelled because the service was not started by 5:00 PM.',
          type: 'warning',
          targetRole: '', targetUid: d.customerId,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          readBy: {}, isRead: false,
        });
      }

      var adminStaffMsg = custName + '\'s booking for ' + plate + ' on ' + dateLabel
        + timeLabel + ' was auto-cancelled (no-show / not started by 5:00 PM).';

      // ── Notify admin ──
      db.collection('notifications').add({
        title: '🔔 Booking Auto-Cancelled',
        message: adminStaffMsg,
        type: 'warning',
        targetRole: 'admin', targetUid: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        readBy: {}, isRead: false,
      });

      // ── Notify staff ──
      db.collection('notifications').add({
        title: '🔔 Booking Auto-Cancelled',
        message: adminStaffMsg,
        type: 'warning',
        targetRole: 'staff', targetUid: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        readBy: {}, isRead: false,
      });
    }).catch(function() {}); // silent — Firestore will retry on next snapshot
  });
}

// ── Load bookings (real-time) ──
var _unsubscribe = null;

firebase.auth().onAuthStateChanged(function(user) {
  if (!user) { window.location.href = 'login.html'; return; }

  var db = firebase.firestore();

  // ── Show cached data instantly while Firestore fetches ──
  _mbRestoreCache(user.uid);

  if (_unsubscribe) _unsubscribe();
  _unsubscribe = db
    .collection('service_bookings')
    .where('customerId', '==', user.uid)
    .onSnapshot(function(snap) {
      // ── Auto-cancel any expired bookings first ──
      _mbAutoCancelExpired(snap.docs, db);
      // Keep all (including cancelled) — filter client-side
      _allDocs = snap.docs.filter(function(doc) {
        var st = (doc.data().status || '').toLowerCase();
        return st !== 'under maintenance' && st !== 'completed';
      }).sort(function(a,b) {
        var at = a.data().createdAt ? a.data().createdAt.toMillis() : 0;
        var bt = b.data().createdAt ? b.data().createdAt.toMillis() : 0;
        return bt - at;
      });

      // ── Persist for instant restore on next visit ──
      _mbSaveCache(user.uid, _allDocs);

      // Rebuild _bookings cache
      _allDocs.forEach(function(doc) { _bookings[doc.id] = doc.data(); });

      // Update stat counts
      var cntApproved = 0, cntResched = 0, cntCancelled = 0;
      _allDocs.forEach(function(doc) {
        var d = doc.data();
        var status = (d.status || '').toLowerCase();
        var isResched = d.previousDate && d.previousDate !== d.preferredDate;
        if (status === 'cancelled') cntCancelled++;
        else if (status === 'approved' && isResched) cntResched++;
        else if (status === 'approved') cntApproved++;
      });
      var cntAll = _allDocs.length;
      function _s(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
      _s('mbCntAll', cntAll);
      _s('mbCntApproved', cntApproved);
      _s('mbCntRescheduled', cntResched);
      _s('mbCntCancelled', cntCancelled);

      // Show stats grid once data loads
      var statsEl = document.getElementById('mbStats');
      if (statsEl) statsEl.style.display = cntAll > 0 ? 'grid' : 'none';
      var tabBar = document.getElementById('mbTabBar');
      if (tabBar) tabBar.style.display = 'flex';

      _mbRender();
    }, function(err) {
      document.getElementById('mbList').innerHTML =
        '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#e53e3e;font-size:13px;">Error: ' + err.message + '</div>';
    });
});

          sendAlertEmail({ title: 'aA?? Booking Cancelled by Customer', message: cancelMsg, type: 'warning', targetRole: 'admin' });
        }
        var t = document.getElementById('cuToast');
        if (t) {
          t.textContent = 'Booking cancelled successfully.';
          t.className = 'cu-toast show';
          clearTimeout(t._timer);
          t._timer = setTimeout(function(){ t.className = 'cu-toast'; }, 3000);
        }
        mbCloseModal();
      })
      .catch(function(err) { alert('Error: ' + err.message); });
  });
};
</script>

</div><!-- /.cu-page-shell -->
</body>
</html>
